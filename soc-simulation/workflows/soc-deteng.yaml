version: '1'
name: SOC Detection Engineering
description: Scheduled feedback loop. Analyzes triage outcomes and tunes detection rules.
enabled: true

triggers:
  - type: scheduled
    with:
      every: 30m

steps:
  - name: tune_rules
    type: ai.agent
    agent-id: soc-deteng-agent
    with:
      message: >
        Analyze recent triage outcomes and tune detection rules.
        Check .soc-outcomes for FP/TP patterns from the last 30 minutes.
    timeout: 300s

  - name: audit
    type: console
    with:
      message: "DetEng audit: agent=deteng action=rules_tuned"

  - name: log_evolution
    type: console
    with:
      message: "DetEng Agent result: {{ steps.tune_rules.output | json }}"
