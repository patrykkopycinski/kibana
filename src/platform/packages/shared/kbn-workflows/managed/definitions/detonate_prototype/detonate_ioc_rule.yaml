version: "1"
name: Detonate IOC Rule Worker (prototype)
description: >
  Detonate prototype: the IOC-backed sibling of the Detonate Detection Rule
  Creation Worker, for a run whose record carries extracted IOCs. Estimates
  how many recent events the IOCs match, drafts one indicator match rule over
  one value list per family (domains and file hashes as keyword, IPs as ip),
  and records it as a proposal on the run's investigation. It writes nothing
  before approval: on approval the action loads the lists and creates the
  rule, enabled, under the approver's identity; a re-check of the stored rule
  then queues the Hunt Worker or disables the rule.
enabled: true
tags:
  - security
  - detection-rule-creation
  - detonate_prototype
settings:
  # Same key as the rule-creation copy: one candidate per detonation run at a
  # time, whichever of the two the sweep dispatched.
  concurrency:
    key: "detonate-coverage-{{ inputs.task_id }}"
    strategy: drop
    max: 1
  # This run parks in WAITING_FOR_CHILD while the proposal gate holds the
  # decision. Budget: a 72h create decision, a re-park margin, plus the
  # action's list loads and the verify steps. A test pins the relationship.
  timeout: "96h"
  # A step that fails the run never reaches clear_in_progress, and the sweep
  # skips a run while its lock is set. This fallback releases the lock on that
  # path; the run still fails. It does not run on a timeout or cancellation.
  on-failure:
    fallback:
      - name: release_coverage_lock
        type: kibana.request
        timeout: "30s"
        with:
          method: POST
          path: "/s/{{ workflow.spaceId }}/internal/detonate_prototype/runs/{{ inputs.task_id }}/handoff"
          headers:
            kbn-xsrf: "true"
            elastic-api-version: "1"
            Content-Type: application/json
          body:
            remove:
              - detonate:coverage-in-progress
triggers:
  - type: manual
    inputs:
      properties:
        task_id:
          type: string
          minLength: 1
          maxLength: 128
          description: >-
            Detonate run id whose record carries the IOCs. Tags the rule with
            the run and keys the concurrency lock.
        estimate_days:
          type: integer
          minimum: 1
          maximum: 30
          default: 2
          description: Days of source events the match estimate covers.
        investigation_id:
          type: string
          maxLength: 512
          description: >-
            Investigation the proposal is recorded on. The detonation's own
            conversation, so the analyst sees a single record for the run.
      required: [task_id, investigation_id]
      additionalProperties: false
outputs:
  - name: created
    type: boolean
  - name: reviewed
    type: boolean
  - name: decision
    type: string
  - name: rule_name
    type: string
  - name: skip_reason
    type: string
consts:
  no_rows: []
steps:
  # The record's IOCs are sanitized at extraction (domain pattern, IP parse,
  # hex digest, at most 100 per family), so every value is valid for its list
  # type. A failed read skips everything below up to the lock release.
  - name: read_record
    type: kibana.request
    timeout: "30s"
    on-failure:
      continue: true
    with:
      method: GET
      path: "/s/{{ workflow.spaceId }}/internal/detonate_prototype/runs/{{ inputs.task_id }}/record"
      headers:
        kbn-xsrf: "true"
        elastic-api-version: "1"

  # The candidate id is this execution's id: the list ids, the item ids the
  # action writes and the rule's candidate tag all derive from it, so a
  # re-offered approval hits the same ids and two candidates for one run never
  # share a list. The action derives the same list ids from candidate_id.
  - name: resolve_iocs
    type: data.set
    if: "${{ steps.read_record.error == null }}"
    with:
      # The kibana.request step's output IS the response body (no wrapper);
      # the record route returns the detonation record flat.
      domains: "${{ steps.read_record.output['detonate.iocs.domains'] | default: consts.no_rows }}"
      ips: "${{ steps.read_record.output['detonate.iocs.ips'] | default: consts.no_rows }}"
      file_hashes: "${{ steps.read_record.output['detonate.iocs.file_hashes'] | default: consts.no_rows }}"
      domain_count: "${{ steps.read_record.output['detonate.iocs.domains'] | default: consts.no_rows | size }}"
      ip_count: "${{ steps.read_record.output['detonate.iocs.ips'] | default: consts.no_rows | size }}"
      hash_count: "${{ steps.read_record.output['detonate.iocs.file_hashes'] | default: consts.no_rows | size }}"
      sample: "{{ steps.read_record.output['file.hash.sha256'] | default: inputs.task_id }}"
      candidate_tag: "detonate:candidate:{{ execution.id }}"
      domain_list_id: "detonate-ioc-domains-{{ execution.id }}"
      ip_list_id: "detonate-ioc-ips-{{ execution.id }}"
      hash_list_id: "detonate-ioc-hashes-{{ execution.id }}"

  - name: has_iocs
    type: data.set
    if: "${{ steps.resolve_iocs.output != null }}"
    with:
      ok: >-
        ${{ steps.resolve_iocs.output.domain_count > 0
          or steps.resolve_iocs.output.ip_count > 0
          or steps.resolve_iocs.output.hash_count > 0 }}

  # The lists are written on approval, by the action under the approver: this
  # worker may not write list indices. What it can read is the source index,
  # so it estimates matches with the same three field mappings the rule uses.
  # The estimate is a count of matching events, not of alerts; the rule
  # alerts once per matching event in its own window.
  - name: estimate_matches
    type: elasticsearch.search
    if: "${{ steps.has_iocs.output.ok == true }}"
    timeout: "60s"
    on-failure:
      continue: true
    with:
      index: logs-*
      ignore_unavailable: true
      allow_no_indices: true
      size: 0
      track_total_hits: true
      query:
        bool:
          filter:
            - range:
                "@timestamp":
                  gte: "now-{{ inputs.estimate_days }}d"
          should:
            - terms:
                dns.question.name: "${{ steps.resolve_iocs.output.domains }}"
            - terms:
                destination.ip: "${{ steps.resolve_iocs.output.ips }}"
            - terms:
                file.hash.sha256: "${{ steps.resolve_iocs.output.file_hashes }}"
          minimum_should_match: 1
      aggregations:
        domains:
          filter:
            terms:
              dns.question.name: "${{ steps.resolve_iocs.output.domains }}"
        ips:
          filter:
            terms:
              destination.ip: "${{ steps.resolve_iocs.output.ips }}"
        hashes:
          filter:
            terms:
              file.hash.sha256: "${{ steps.resolve_iocs.output.file_hashes }}"

  # The candidate rule, built once and read everywhere below: attachment,
  # proposal and the post-create check. One indicator match rule over the
  # three lists the action creates; the threat filter scopes the indicator
  # search to this candidate's lists, without it every list in the space
  # would act as indicators. The action sets the indicator index and filter
  # itself from the candidate id; they are here so the attached draft shows
  # the rule as it will be stored. The mapping entries are ORed: any one
  # family matching alerts.
  - name: candidate
    type: data.set
    if: "${{ steps.has_iocs.output.ok == true }}"
    with:
      ok: true
      rule:
        type: threat_match
        language: kuery
        name: "Detonate IOC match: sample {{ steps.resolve_iocs.output.sample | slice: 0, 12 }}"
        description: >-
          Matches production events against the indicators the detonation of
          run {{ inputs.task_id }} extracted: {{ steps.resolve_iocs.output.domain_count }} domains,
          {{ steps.resolve_iocs.output.ip_count }} IPs and {{ steps.resolve_iocs.output.hash_count }} file hashes.
        query: "*:*"
        index:
          - logs-*
        threat_index:
          - ".items-{{ workflow.spaceId }}"
        threat_query: "*:*"
        threat_language: kuery
        threat_filters:
          - query:
              terms:
                list_id:
                  - "{{ steps.resolve_iocs.output.domain_list_id }}"
                  - "{{ steps.resolve_iocs.output.ip_list_id }}"
                  - "{{ steps.resolve_iocs.output.hash_list_id }}"
        threat_mapping:
          - entries:
              - field: dns.question.name
                type: mapping
                value: keyword
          - entries:
              - field: destination.ip
                type: mapping
                value: ip
          - entries:
              - field: file.hash.sha256
                type: mapping
                value: keyword
        interval: 5m
        from: now-6m
        severity: medium
        risk_score: 47
        tags:
          - detonate:trial
          - "detonate:{{ inputs.task_id }}"
          - "{{ steps.resolve_iocs.output.candidate_tag }}"

  # The action's input: the IOCs to load and the rule body without the
  # indicator index and filter, which the action derives from candidate_id.
  - name: action_input
    type: data.set
    if: "${{ steps.candidate.output.ok == true }}"
    with:
      value:
        candidate_id: "{{ execution.id }}"
        sample_label: "{{ steps.resolve_iocs.output.sample | slice: 0, 12 }}"
        task_id: "{{ inputs.task_id }}"
        iocs:
          domains: "${{ steps.resolve_iocs.output.domains }}"
          ips: "${{ steps.resolve_iocs.output.ips }}"
          hashes: "${{ steps.resolve_iocs.output.file_hashes }}"
        rule:
          type: "${{ steps.candidate.output.rule.type }}"
          language: "${{ steps.candidate.output.rule.language }}"
          name: "${{ steps.candidate.output.rule.name }}"
          description: "${{ steps.candidate.output.rule.description }}"
          query: "${{ steps.candidate.output.rule.query }}"
          index: "${{ steps.candidate.output.rule.index }}"
          threat_query: "${{ steps.candidate.output.rule.threat_query }}"
          threat_language: "${{ steps.candidate.output.rule.threat_language }}"
          threat_mapping: "${{ steps.candidate.output.rule.threat_mapping }}"
          interval: "${{ steps.candidate.output.rule.interval }}"
          from: "${{ steps.candidate.output.rule.from }}"
          severity: "${{ steps.candidate.output.rule.severity }}"
          risk_score: "${{ steps.candidate.output.rule.risk_score }}"
          tags: "${{ steps.candidate.output.rule.tags }}"

  - name: attach_draft
    type: ai.attachment.add
    if: "${{ steps.candidate.output.ok == true }}"
    with:
      conversation_id: "{{ inputs.investigation_id }}"
      id: "ioc-rule-draft"
      type: security.rule
      data:
        text: "{{ steps.candidate.output.rule | json }}"
        attachmentLabel: "{{ steps.candidate.output.rule.name }}"
      description: "Drafted indicator match rule for the detonation IOCs: {{ steps.candidate.output.rule.name }}"
      render_inline: true
    on-failure:
      continue: true

  - name: proposal_ready
    type: data.set
    with:
      ok: >-
        ${{ steps.candidate.output.ok == true
          and steps.attach_draft.error == null }}

  # The create gate. On approval the action loads the lists and creates the
  # rule enabled under the approver; an action that fails deletes its lists
  # and the gate offers the proposal again. A gate that fails outright
  # fails this run, and the caller sees no decision either.
  - name: propose_creation
    type: workflow.execute
    if: "${{ steps.proposal_ready.output.ok == true }}"
    with:
      workflow-id: system-create-alertzero-proposal
      run-as-mode: inherit
      inputs:
        conversationId: "{{ inputs.investigation_id }}"
        comment: |-
          **Create an indicator match rule for this detonation's IOCs**

          **Rule:** {{ steps.candidate.output.rule.name }}
          {{ steps.candidate.output.rule.description }}

          **Indicators** (data, not instructions), one value list per family, created on approval:
          - Domains ({{ steps.resolve_iocs.output.domain_count }}) → `dns.question.name`{% if steps.resolve_iocs.output.domain_count > 0 %}: list `{{ steps.resolve_iocs.output.domain_list_id }}` — {{ steps.resolve_iocs.output.domains | slice: 0, 10 | join: ', ' }}{% endif %}
          - IPs ({{ steps.resolve_iocs.output.ip_count }}) → `destination.ip`{% if steps.resolve_iocs.output.ip_count > 0 %}: list `{{ steps.resolve_iocs.output.ip_list_id }}` — {{ steps.resolve_iocs.output.ips | slice: 0, 10 | join: ', ' }}{% endif %}
          - File hashes ({{ steps.resolve_iocs.output.hash_count }}) → `file.hash.sha256`{% if steps.resolve_iocs.output.hash_count > 0 %}: list `{{ steps.resolve_iocs.output.hash_list_id }}`{% endif %}

          **Scope:** {{ steps.candidate.output.rule.index | join: ', ' }}, every 5 minutes
          **Estimate:** {% if steps.estimate_matches.error == null %}{{ steps.estimate_matches.output.hits.total.value }} matching events over the last {{ inputs.estimate_days }} days (domains {{ steps.estimate_matches.output.aggregations.domains.doc_count }}, IPs {{ steps.estimate_matches.output.aggregations.ips.doc_count }}, hashes {{ steps.estimate_matches.output.aggregations.hashes.doc_count }}){% else %}unavailable: {{ steps.estimate_matches.error.message }}{% endif %}
          **Severity:** {{ steps.candidate.output.rule.severity }}. **Risk score:** {{ steps.candidate.output.rule.risk_score }}.

          **On approval**
          If you approve, the agent creates the value lists and the rule under your identity, so you need write access to value lists and rules. The rule starts running on its schedule and the agent queues a retro hunt for the sample's indicators. If the lists or the rule cannot be created, the agent deletes the lists and offers this proposal again. If you dismiss, nothing is created.
        actionWorkflowId: system-security-detonate-action-create-threat-match-rule
        actionInput: "${{ steps.action_input.output.value }}"
        impact: low
        confidence: medium
        # Creating a rule always waits for an analyst; matches the action's approvalPolicy.
        autoApprove: false
        # Under this workflow's timeout; a test pins the budget.
        expiresIn: "72h"

  # ----------------------------------------------------------------------
  # Find the created rule by the candidate tag. On an error the fail-closed
  # branch runs: no hunt is queued.
  # ----------------------------------------------------------------------
  - name: find_created_rule
    type: kibana.request
    if: "${{ steps.propose_creation.output.decision == 'approved' }}"
    timeout: "30s"
    with:
      method: GET
      path: "/s/{{ workflow.spaceId }}/api/detection_engine/rules/_find?per_page=10&filter={{ steps.resolve_iocs.output.candidate_tag | prepend: 'alert.attributes.tags:\"' | append: '\"' | url_encode }}"
      headers:
        elastic-api-version: "2023-10-31"
    on-failure:
      continue: true

  - name: resolve_found_rule
    type: data.set
    if: "${{ steps.propose_creation.output.decision == 'approved' }}"
    # The rules _find route returns `{ page, perPage, total, data }` flat.
    with:
      found: >-
        ${{ steps.find_created_rule.error == null
          and steps.find_created_rule.output.data.size == 1 }}
      rule_id: "${{ steps.find_created_rule.output.data[0].id | default: '' }}"
      rule_name_found: "${{ steps.find_created_rule.output.data[0].name | default: '' }}"
      type_found: "${{ steps.find_created_rule.output.data[0].type | default: '' }}"
      language_found: "${{ steps.find_created_rule.output.data[0].language | default: '' }}"
      query_found: "${{ steps.find_created_rule.output.data[0].query | default: '' }}"
      lists_found: "{{ steps.find_created_rule.output.data[0].threat_filters[0].query.terms.list_id | join: ',' }}"
      lists_proposed: "{{ steps.candidate.output.rule.threat_filters[0].query.terms.list_id | join: ',' }}"

  # Re-guard the created rule as stored: exactly one rule by the candidate
  # tag, still an indicator match over this candidate's lists only. A rule
  # whose list filter was edited away would match every list in the space.
  # On any mismatch: disable it and note why.
  - name: verify_ok
    type: data.set
    if: "${{ steps.propose_creation.output.decision == 'approved' }}"
    with:
      ok: >-
        ${{ steps.resolve_found_rule.output.found == true
          and steps.resolve_found_rule.output.type_found == 'threat_match'
          and steps.resolve_found_rule.output.language_found == 'kuery'
          and steps.resolve_found_rule.output.query_found == steps.candidate.output.rule.query
          and steps.resolve_found_rule.output.lists_found == steps.resolve_found_rule.output.lists_proposed }}
      reason: >-
        {% if steps.resolve_found_rule.output.found != true %}the created rule could not be found by its candidate tag (it may have been deleted, or edited so the tag was removed){% elsif steps.resolve_found_rule.output.type_found != 'threat_match' or steps.resolve_found_rule.output.language_found != 'kuery' %}rule is no longer an indicator match rule{% elsif steps.resolve_found_rule.output.query_found != steps.candidate.output.rule.query %}query changed after review{% elsif steps.resolve_found_rule.output.lists_found != steps.resolve_found_rule.output.lists_proposed %}indicator list filter changed after review{% else %}{% endif %}

  - name: disable_changed_rule
    type: kibana.request
    if: >-
      ${{ steps.verify_ok.output.ok == false
        and steps.resolve_found_rule.output.found == true }}
    timeout: "30s"
    with:
      method: PATCH
      path: "/s/{{ workflow.spaceId }}/api/detection_engine/rules"
      headers:
        kbn-xsrf: "true"
        elastic-api-version: "2023-10-31"
        Content-Type: application/json
      body:
        id: "{{ steps.resolve_found_rule.output.rule_id }}"
        enabled: false
    on-failure:
      continue: true

  - name: note_verification_failure
    type: ai.conversation.add_user_message
    if: "${{ steps.verify_ok.output.ok == false }}"
    on-failure:
      continue: true
    with:
      conversation_id: "{{ inputs.investigation_id }}"
      message: >-
        {%- if steps.resolve_found_rule.output.found != true -%}
        Hunt sweep not queued: {{ steps.verify_ok.output.reason }}.
        {%- elsif steps.disable_changed_rule.error == null -%}
        Trial rule disabled: {{ steps.verify_ok.output.reason }}. [{{ steps.resolve_found_rule.output.rule_name_found }}](/s/{{ workflow.spaceId }}/app/security/rules/id/{{ steps.resolve_found_rule.output.rule_id }})
        {%- else -%}
        Disable failed, rule still enabled, disable manually: {{ steps.verify_ok.output.reason }} — [{{ steps.resolve_found_rule.output.rule_name_found }}](/s/{{ workflow.spaceId }}/app/security/rules/id/{{ steps.resolve_found_rule.output.rule_id }})
        {%- endif -%}

  # On a verified create, hand the run to the Hunt Worker through the handoff
  # route. Runs as this copy's caller (inherit), which holds alertzero_write.
  - name: queue_hunt
    type: kibana.request
    if: "${{ steps.verify_ok.output.ok == true }}"
    timeout: "30s"
    with:
      method: POST
      path: "/s/{{ workflow.spaceId }}/internal/detonate_prototype/runs/{{ inputs.task_id }}/handoff"
      headers:
        kbn-xsrf: "true"
        elastic-api-version: "1"
        Content-Type: application/json
      body:
        add:
          - detonate:hunt-requested
    on-failure:
      continue: true

  - name: note_hunt_queue_failure
    type: ai.conversation.add_user_message
    if: "${{ steps.queue_hunt.error != null }}"
    on-failure:
      continue: true
    with:
      conversation_id: "{{ inputs.investigation_id }}"
      message: "Hunt sweep not queued: {{ steps.queue_hunt.error.message }}. Queue it from the detonation result flyout."

  # ----------------------------------------------------------------------
  # Release the coverage lock the sweep took on dispatch. Always runs and
  # always clears, whatever path this copy took.
  # ----------------------------------------------------------------------
  - name: clear_in_progress
    type: kibana.request
    timeout: "30s"
    with:
      method: POST
      path: "/s/{{ workflow.spaceId }}/internal/detonate_prototype/runs/{{ inputs.task_id }}/handoff"
      headers:
        kbn-xsrf: "true"
        elastic-api-version: "1"
        Content-Type: application/json
      body:
        remove:
          - detonate:coverage-in-progress
    on-failure:
      continue: true

  - name: note_clear_failure
    type: ai.conversation.add_user_message
    if: "${{ steps.clear_in_progress.error != null }}"
    on-failure:
      continue: true
    with:
      conversation_id: "{{ inputs.investigation_id }}"
      message: "Coverage lock not released: {{ steps.clear_in_progress.error.message }}. The run stays hidden from the Detection Worker until the marker is cleared."

  - name: emit_result
    type: workflow.output
    status: completed
    with:
      created: "${{ steps.propose_creation.output.status == 'succeeded' }}"
      reviewed: >-
        ${{ steps.propose_creation.output.decision == 'approved'
          or steps.propose_creation.output.decision == 'dismissed' }}
      decision: "{{ steps.propose_creation.output.decision }}"
      rule_name: "{{ steps.candidate.output.rule.name }}"
      skip_reason: >-
        {% if steps.read_record.error != null %}The run record could not be read: {{ steps.read_record.error.message }}{% elsif steps.has_iocs.output.ok != true %}The run record carries no IOCs.{% elsif steps.attach_draft.error != null %}The draft could not be attached to the investigation: {{ steps.attach_draft.error.message }}{% endif %}
