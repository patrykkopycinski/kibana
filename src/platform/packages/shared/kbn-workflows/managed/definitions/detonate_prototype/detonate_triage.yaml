version: "1"
name: Detonate triage
description: >
  Detonate prototype: the automated triage tier. A reputation gate runs
  first — a digest the service has already seen detonate is tagged straight
  away and never spends a VM. Only `unknown` hashes are detonated, and the
  run's verdict is written back to the alert (tag plus evidence note; the
  alert's status is never touched by the workflow). A malicious verdict also
  offers a fleet-wide blocklist entry — behind an analyst approval, never on
  the verdict alone. Experimental, off by default.
enabled: true
tags:
  - security
  - detonate_prototype
triggers:
  # API-fired only (workflow.execute / Run dialog). No alert trigger exists in
  # the registry yet — "automated" today means one API call, with the run
  # visible in Executions.
  - type: manual
    inputs:
      properties:
        sha256:
          type: string
          minLength: 32
          maxLength: 128
          description: Hash of the sample to triage, typically the alert's file.hash.sha256.
        alert_id:
          type: string
          minLength: 1
          maxLength: 128
          description: Elasticsearch _id of the alert the verdict is written back to.
        case_id:
          type: string
          maxLength: 256
          description: Optional case to carry confirmed-malicious evidence into, as a comment.
      required:
        - sha256
        - alert_id
      additionalProperties: false
outputs:
  - name: source
    type: string
  - name: verdict
    type: string
  - name: tag
    type: string
steps:
  # The gate only answers `known-malicious` or `unknown`. `unknown` is honest
  # uncertainty — no benign answer exists — and it is what earns a detonation.
  - name: reputation
    type: detonate.prototype.detonateReputation
    with:
      sha256: "{{ inputs.sha256 }}"

  - name: reputation_gate
    type: switch
    expression: "{{ steps.reputation.output.status }}"
    cases:
      # Already-known malware: write the verdict back from reputation alone.
      # No VM is spent re-confirming what the service has already seen, and
      # the note says so explicitly so nobody hunts for a run that does not
      # exist.
      - match: known-malicious
        steps:
          - name: tag_known
            type: security.setAlertTags
            with:
              alert_ids: "{{ inputs.alert_id }}"
              tags_to_add:
                - "detonate:known-malicious"

          - name: note_known
            type: security.createNote
            with:
              document_id: "{{ inputs.alert_id }}"
              text: >-
                Detonate triage: reputation gate reports this hash as
                known-malicious{% if steps.reputation.output.malware_family != blank %} (family
                {{ steps.reputation.output.malware_family }}){% endif %}. No new detonation was
                run — the verdict comes from prior runs of the same sample.

    # `unknown` falls through to the default: detonate, derive the verdict,
    # write it back. This is the only path that spends a VM.
    default:
      - name: detonate
        type: detonate.prototype.detonateSample
        with:
          sample_hash: "{{ inputs.sha256 }}"
          # The sandbox OS is recorded on the task and surfaces in the verdict
          # output — the blocklist artifact below is compiled per OS and
          # accepts exactly one, so it must travel with the run.
          vm_os_family: linux
          tags:
            - "alert:{{ inputs.alert_id }}"
            - "triage"
          max_wait_secs: 900

      - name: verdict
        type: detonate.prototype.detonateVerdict
        with:
          task_id: "{{ steps.detonate.output.task_id }}"
          alert_id: "{{ inputs.alert_id }}"

      - name: apply
        type: detonate.prototype.applyDetonationVerdict
        with:
          verdict: "{{ steps.verdict.output.verdict }}"
          alert_id: "{{ inputs.alert_id }}"
          task_id: "{{ steps.verdict.output.task_id }}"
          evidence: "{{ steps.verdict.output.evidence }}"

      # F3: the run's extracted IOCs (domains, IPs, hashes) are only as
      # valuable as the question they answer next — which OTHER hosts in
      # the fleet contacted the same infrastructure? Two hunts, one per
      # indicator family the sim extracts: DNS answers for the domains,
      # destination IPs for the IPs.
      #
      # The IN-lists splice textually (the alertzero batched-generation
      # pattern): IOC values are lowercased domains and IPs, which cannot
      # carry a quote, so the splice cannot break the query. The `if`
      # guards keep an empty family from ever compiling an invalid
      # `IN ("")` — an absent `extracted_iocs` (service predates
      # extraction) also never fires the step.
      #
      # `on-failure: continue` on both: a stack without endpoint network
      # data (the common lab case) fails the FROM clause at
      # verification — "Unknown column [dns.question.name]" — and a
      # missing hunt must not fail a triage run whose verdict is already
      # on the alert.
      #
      # The hunts run inside the detonate branch only, after `apply`,
      # because that is where `steps.detonate.output.extracted_iocs`
      # exists; the known-malicious branch has no detonation to extract
      # from (its note already says so).
      - name: hunt_domains
        type: elasticsearch.esql.query
        if: "${{ steps.detonate.output.extracted_iocs != blank and steps.detonate.output.extracted_iocs.domains.size > 0 }}"
        on-failure:
          continue: true
        with:
          query: |-
            FROM logs-endpoint.events.network-*
              | WHERE dns.question.name IN ("{{ steps.detonate.output.extracted_iocs.domains | join: '", "' }}")
              | STATS last_seen = MAX(@timestamp) BY host.name
              | KEEP host.name, last_seen
              | SORT host.name ASC
              | LIMIT 100

      - name: hunt_ips
        type: elasticsearch.esql.query
        if: "${{ steps.detonate.output.extracted_iocs != blank and steps.detonate.output.extracted_iocs.ips.size > 0 }}"
        on-failure:
          continue: true
        with:
          query: |-
            FROM logs-endpoint.events.network-*
              | WHERE @timestamp >= NOW() - 30d
              | WHERE destination.ip IN ("{{ steps.detonate.output.extracted_iocs.ips | join: '", "' }}")
              | STATS last_seen = MAX(@timestamp) BY host.name
              | KEEP host.name, last_seen
              | SORT host.name ASC
              | LIMIT 100

      # Both hunts land on the alert as a note: the analyst sees the
      # fleet exposure without leaving the alert. `map: 'first'`
      # extracts the hostname from each row (rows are
      # [host.name, last_seen]); `uniq` because a host found by BOTH
      # hunts (DNS and TCP to the same infrastructure) must not appear
      # twice. Skipped or failed hunts render as empty lists — `concat`
      # over an empty array is still an array.
      - name: hunt_note
        type: security.createNote
        if: "${{ (steps.hunt_domains.output != blank and steps.hunt_domains.output.values.size > 0) or (steps.hunt_ips.output != blank and steps.hunt_ips.output.values.size > 0) }}"
        on-failure:
          continue: true
        with:
          document_id: "{{ inputs.alert_id }}"
          text: >-
            {%- if steps.hunt_domains.output != blank -%}
            {%- assign domain_hosts = steps.hunt_domains.output.values | map: 'first' -%}
            {%- else -%}
            {%- assign domain_hosts = '' | split: ',' -%}
            {%- endif -%}
            {%- if steps.hunt_ips.output != blank -%}
            {%- assign ip_hosts = steps.hunt_ips.output.values | map: 'first' -%}
            {%- else -%}
            {%- assign ip_hosts = '' | split: ',' -%}
            {%- endif -%}
            {%- assign hosts = domain_hosts | concat: ip_hosts | uniq | sort -%}
            Detonate hunt: {{ hosts | join: ', ' }} also contacted the
            infrastructure this sample used ({% if domain_hosts.size > 0 %}DNS{% endif %}{% if domain_hosts.size > 0 and ip_hosts.size > 0 %} and {% endif %}{% if ip_hosts.size > 0 %}destination IP{% endif %} matches over the last 30 days).

      # F6: a blocklist write is a fleet-wide enforcement action, so it never
      # rides on a sandbox verdict alone — an analyst confirms it first. The
      # gate sits after `apply` (the verdict is already on the alert either
      # way) and before any blocklist write. A timeout reads as no answer and
      # skips the blocklist: the run stays honest rather than failing loudly
      # over a decision nobody made. The failure travels as an error on the
      # step, adopted below before the output is evicted.
      - name: blocklist_gate
        type: waitForApproval
        if: "${{ steps.verdict.output.verdict == 'malicious' }}"
        timeout: 3600s
        on-failure:
          continue: true
        with:
          message: >-
            Detonate triage: blocklist this hash on every endpoint?
            {{ steps.verdict.output.evidence }}
          approveLabel: Blocklist hash
          rejectLabel: Skip

      # `waitForApproval` output resolves to its latest execution and is not
      # exempt from eviction, so the answer is adopted into a variable before
      # anything reads it. Blank on timeout, which is what the guard below
      # keys on: an unanswered gate is not a yes.
      - name: resolve_blocklist_gate
        type: data.set
        if: "${{ steps.verdict.output.verdict == 'malicious' }}"
        with:
          blocklist_approved: '${{ steps.blocklist_gate.output.response.approved == true }}'
          blocklist_timed_out: '${{ steps.blocklist_gate.error != blank }}'

      # The write itself. `item_id` is derived from the hash so the step is
      # idempotent: re-running triage on the same sample skips instead of
      # stacking duplicate entries. `on-failure: continue` because a stack
      # without the blocklist list (it is created by the Artifacts UI, not
      # provisioned) must not fail the whole triage run — the verdict is
      # already recorded on the alert.
      - name: blocklist
        type: security.createExceptionListItem
        if: "${{ variables.blocklist_approved == true }}"
        on-failure:
          continue: true
        with:
          list_id: endpoint_blocklists
          namespace_type: agnostic
          item_id: "detonate-{{ inputs.sha256 }}"
          overwrite: true
          name: "Detonate: {{ steps.verdict.output.evidence | truncate: 200 }}"
          description: >-
            Added by the Detonate triage workflow after an approved malicious
            detonation (task {{ steps.verdict.output.task_id }}).
          entries:
            # Endpoint blocklist entries must be `match_any` + `included` with
            # an array value (BlocklistValidator) — the step's `is_one_of`
            # verb maps to exactly that; plain `is` maps to `match` and the
            # blocklist validator rejects it.
            - field: file.hash.sha256
              operator: is_one_of
              values:
                - "{{ inputs.sha256 }}"
          # An endpoint blocklist artifact is compiled per OS and the validator
          # accepts exactly one os_types entry (minSize 1, maxSize 1) — the OS
          # the sample actually ran on, from the verdict output.
          os_types:
            - "{{ steps.verdict.output.vm_os_family }}"
          # Attribution: the resumed execution writes under the workflow
          # runner's identity, not the approver's, so the approver is recorded
          # on the item itself — the audit trail the Artifacts UI shows.
          comments:
            - "Blocklisted by {{ steps.blocklist_gate.output.respondedBy }} after detonation task {{ steps.verdict.output.task_id }}."

      # A confirmed-malicious detonation is worth a case comment; a quiet or
      # inconclusive run stays on the alert, where the analyst already is.
      # Failing to comment on the case must not fail the run — the alert
      # already carries the verdict.
      - name: case_comment_on_malicious
        type: if
        condition: "{{ steps.verdict.output.verdict == 'malicious' and inputs.case_id != blank }}"
        steps:
          - name: comment
            type: detonate.prototype.caseComment
            on-failure:
              continue: true
            with:
              case_id: "{{ inputs.case_id }}"
              comment: "Detonation confirmed malicious — {{ steps.verdict.output.evidence }}"
