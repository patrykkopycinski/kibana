version: '1'
name: SOC Caldera Poller
description: >
  Watches attack commands in .soc-attack-commands that the dispatcher has
  marked status=running, polls the Caldera REST API for each, and writes back
  techniques_executed / final status once the operation reaches a terminal state.

  Companion workflow to soc-caldera-dispatcher. Together they replace the
  former caldera-bridge Python sidecar — the SOC simulation now drives Caldera
  entirely from native workflow steps (elasticsearch.*, http, foreach, if).

  Terminal states per Caldera: finished, cleanup, paused. Anything else means
  still running; if a command has been running longer than 10 minutes we mark
  it failed with reason=timeout.
enabled: true

triggers:
  - type: scheduled
    with:
      every: 30s
  - type: manual

consts:
  caldera_url: "http://caldera:8888"
  caldera_api_key: "ADMIN123"
  timeout_minutes: 10

steps:
  # ── Pull running commands ────────────────────────────────────────────
  - name: running_commands
    type: elasticsearch.search
    with:
      index: ".soc-attack-commands"
      body:
        size: 20
        query:
          bool:
            filter:
              - term: { status: "running" }
              - exists: { field: "caldera_operation_id" }
        sort:
          - "claimed_at": asc

  # ── Poll and update each ─────────────────────────────────────────────
  - name: poll
    type: foreach
    foreach: "{{ steps.running_commands.output.hits.hits | default: [] }}"
    steps:
      - name: get_operation
        type: http
        with:
          url: "{{ consts.caldera_url }}/api/v2/operations/{{ foreach.item._source.caldera_operation_id }}"
          method: GET
          headers:
            KEY: "{{ consts.caldera_api_key }}"
          timeout: 15s

      # Terminal — finished/cleanup/paused: pull techniques from the chain
      - name: mark_completed
        type: elasticsearch.document.update
        with:
          index: ".soc-attack-commands"
          id: "{{ foreach.item._id }}"
          body:
            doc:
              status: "completed"
              completed_at: "{{ 'now' | date: '%Y-%m-%dT%H:%M:%SZ' }}"
              caldera_state: "{{ steps.get_operation.output.state }}"
              techniques_executed: "{{ steps.get_operation.output.chain | map: 'ability' | map: 'technique_id' | uniq | compact }}"
        if: >-
          {{ steps.get_operation.output.state == 'finished'
             or steps.get_operation.output.state == 'cleanup'
             or steps.get_operation.output.state == 'paused' }}

      # Timeout — claimed_at older than 10 min and still not terminal
      - name: mark_timeout
        type: elasticsearch.document.update
        with:
          index: ".soc-attack-commands"
          id: "{{ foreach.item._id }}"
          body:
            doc:
              status: "failed"
              completed_at: "{{ 'now' | date: '%Y-%m-%dT%H:%M:%SZ' }}"
              caldera_state: "{{ steps.get_operation.output.state | default: 'unknown' }}"
              error: "Caldera operation did not terminate within {{ consts.timeout_minutes }} minutes"
        if: >-
          {{ steps.get_operation.output.state != 'finished'
             and steps.get_operation.output.state != 'cleanup'
             and steps.get_operation.output.state != 'paused'
             and foreach.item._source.claimed_at < ('now-' | append: consts.timeout_minutes | append: 'm' | date: '%Y-%m-%dT%H:%M:%SZ') }}

  - name: heartbeat
    type: elasticsearch.index
    with:
      index: .soc-audit-trail
      document:
        "@timestamp": "{{ 'now' | date: '%Y-%m-%dT%H:%M:%SZ' }}"
        event_type: caldera_poller_tick
        running_count: "{{ steps.running_commands.output.hits.hits | size | default: 0 }}"

  - name: log_done
    type: console
    with:
      message: "Caldera poller tick complete — inspected {{ steps.running_commands.output.hits.hits | size | default: 0 }} running operations"
