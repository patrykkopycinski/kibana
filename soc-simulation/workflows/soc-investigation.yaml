version: '1'
name: SOC Investigation
description: Deep threat hunting for ambiguous alerts. Runs structured investigations to raise or lower confidence.
enabled: true

triggers:
  - type: manual

inputs:
  - name: triage_result
    type: string
    required: true
  - name: enrichment_result
    type: string
    required: true

steps:
  - name: hunt
    type: ai.agent
    agent-id: soc-hunt-agent
    with:
      message: >
        Investigate this ambiguous alert. Triage result:
        {{ inputs.triage_result }}
        Entity enrichment:
        {{ inputs.enrichment_result }}
    timeout: 300s

  - name: store_findings
    type: console
    with:
      message: "Investigation findings: {{ steps.hunt.output | json }}"

  - name: audit
    type: console
    with:
      message: "Investigation audit: agent=hunt action=investigated confidence={{ steps.hunt.output.confidence }}"

  - name: route_after_hunt
    type: if
    condition: '${{ steps.hunt.output.confidence >= 70 }}'
    steps:
      - name: to_response
        type: workflow.executeAsync
        with:
          workflow-id: soc-response
          inputs:
            correlation_id: "{{ steps.hunt.output.correlation_id }}"
            confidence: "{{ steps.hunt.output.confidence }}"
            alert_ids: "{{ steps.hunt.output.related_alerts_found | json }}"
            iocs: "{{ steps.hunt.output.iocs_discovered | json }}"
    else:
      - name: close_inconclusive
        type: console
        with:
          message: "Investigation inconclusive: correlation_id={{ steps.hunt.output.correlation_id }} confidence={{ steps.hunt.output.confidence }}"

on-failure:
  fallback:
    - name: dead_letter
      type: console
      with:
        message: "Investigation workflow failure: source=investigation_workflow error={{ error.message }}"
