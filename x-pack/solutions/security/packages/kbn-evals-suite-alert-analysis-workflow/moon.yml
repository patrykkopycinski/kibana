# To extend this, write your extensions/overrides to 'moon.extend.yml'
tasks:
  analyze:
    command: node scripts/analyze-token-usage.mjs
    description: Compute per-model token/latency means + C2 (cost) and C3 (latency) ratios from a token-usage JSONL.
    args:
      usage: analyze <jsonl> [priceBasis.json]
