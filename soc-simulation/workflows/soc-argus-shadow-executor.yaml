version: '1'
name: ARGUS Shadow Executor (R8)
description: >
  ARGUS R8 — shadow / dry-run execution of draft detection rules BEFORE
  the autonomous applier deploys them.

  For every recommendation whose trust-gate verdict is `allow` and which
  has not yet been shadow-tested, this workflow:

    1. Reads `details.new_definition.query` from the rec (the draft
       rule's raw Elasticsearch QueryDSL container).
    2. Runs that query against the configured historical index pattern
       over the last 7 days, counting total hits per hour.
    3. Writes a row into `.soc-argus-eval-runs` (run_kind=shadow_backtest) with the hit-rate
       estimate and a pass/fail `gate_decision`.
    4. If the shadow run fails (hit-rate far above the expected baseline
       or query errored), downgrades the rec to `pending_review` so the
       applier never fires it live.
    5. If it passes, stamps `shadow_gate=pass` on the rec so the applier
       can pick it up with a cheap index-term lookup.

  The shadow executor is DELIBERATELY conservative. The hit-rate cap of
  50 events/hour is tuned for the demo corpus; in production the cap
  would come from per-rule envelope `expected_impact.tp_gain_pct` or an
  actor-tier policy override.

  Triggers:
    * scheduled 3m   : frequent enough to land a shadow verdict between
                       trust-gate pass and applier sweep
    * manual         : demo operators can force a shadow run

enabled: true

triggers:
  - type: scheduled
    with:
      every: 3m
  - type: manual

consts:
  recs_index: ".soc-recommendations"
  backtest_index: ".soc-argus-eval-runs"
  # Sources the shadow executor replays draft rules against. `logs-*`
  # covers ECS-shaped telemetry; the variant-bank live index gives the
  # demo an immediate corpus of mythos-style events.
  shadow_source_pattern: "logs-*,.soc-eval-corpus-*"
  shadow_window: "now-7d"
  # Cap expressed as hits-per-hour. Anything above this in the shadow
  # window is a probable noise-cannon and must be human-reviewed.
  max_hits_per_hour: 50

steps:
  - name: fetch_shadow_candidates
    type: elasticsearch.search
    with:
      index: "{{ consts.recs_index }}"
      size: 25
      query:
        bool:
          filter:
            - term:   { trust_gate_decision: "allow" }
            - term:   { status: "auto_apply_ready" }
            - exists: { field: "details.artifact_id" }
          must_not:
            - exists: { field: "shadow_gate" }

  - name: run_each_shadow
    type: foreach
    foreach: "{{ steps.fetch_shadow_candidates.output.hits.hits }}"
    steps:
      - name: run_shadow_query
        type: security.shadowExecuteRule
        with:
          rule_query: "{{ foreach.item._source.details.new_definition.query }}"
          rule_type: "{{ foreach.item._source.details.new_definition.language | default: 'kql' }}"
          index_patterns: ["logs-*", ".soc-eval-corpus-*"]
          time_window: "24h"
          max_hits_per_hour_threshold: 50

      - name: compute_shadow_verdict
        type: console
        with:
          message: "{{ steps.run_shadow_query.output.verdict }}"

      - name: compute_shadow_reason
        type: console
        with:
          message: "{{ steps.run_shadow_query.output.reason }}"

      - name: write_backtest_row
        type: elasticsearch.index
        with:
          index: "{{ consts.backtest_index }}"
          document:
            "@timestamp": "{{ execution.startedAt | date: '%Y-%m-%dT%H:%M:%S.%LZ' }}"
            run_kind: "shadow_backtest"
            run_id: "argus-shadow-{{ execution.startedAt | date: '%Y%m%d%H%M%S' }}-{{ foreach.item._id }}"
            rec_id: "{{ foreach.item._source.rec_id | default: foreach.item._id }}"
            advisory_id: "{{ foreach.item._source.advisory_id | default: 'unknown' }}"
            rule_id: "{{ foreach.item._source.details.artifact_id | default: 'unknown' }}"
            rule_name: "{{ foreach.item._source.details.new_definition.name | default: foreach.item._source.title }}"
            index_pattern: "{{ consts.shadow_source_pattern }}"
            window:
              gte: "{{ consts.shadow_window }}"
              lte: "now"
            backtest:
              total_docs: "{{ steps.run_shadow_query.output.total_hits | default: 0 }}"
              positive_hits: "{{ steps.run_shadow_query.output.total_hits | default: 0 }}"
              hit_rate_per_hour: "{{ steps.run_shadow_query.output.hits_per_hour | default: 0 }}"
            gate_decision: "{{ steps.compute_shadow_verdict.output }}"
            gate_reason: "{{ steps.compute_shadow_reason.output }}"

      - name: annotate_rec_pass
        type: elasticsearch.update
        if: "steps.compute_shadow_verdict.output: pass"
        with:
          index: "{{ consts.recs_index }}"
          id: "{{ foreach.item._id }}"
          doc:
            shadow_gate: "pass"
            shadow_gate_reason: "{{ steps.compute_shadow_reason.output }}"
            shadow_gate_checked_at: "{{ execution.startedAt | date: '%Y-%m-%dT%H:%M:%S.%LZ' }}"

      - name: annotate_rec_fail
        type: elasticsearch.update
        if: "steps.compute_shadow_verdict.output: fail"
        with:
          index: "{{ consts.recs_index }}"
          id: "{{ foreach.item._id }}"
          doc:
            status: "pending_review"
            shadow_gate: "fail"
            shadow_gate_reason: "{{ steps.compute_shadow_reason.output }}"
            shadow_gate_checked_at: "{{ execution.startedAt | date: '%Y-%m-%dT%H:%M:%S.%LZ' }}"
            rejection_reason: "shadow_gate_fail:{{ steps.compute_shadow_reason.output }}"

      - name: write_shadow_trace
        type: elasticsearch.index
        with:
          index: .soc-reasoning-trace
          document:
            "@timestamp": "{{ execution.startedAt | date: '%Y-%m-%dT%H:%M:%S.%LZ' }}"
            run_id: "argus-shadow-{{ execution.startedAt | date: '%Y%m%d%H%M%S' }}"
            agent_id: "soc-argus-shadow-executor"
            step_index: 0
            step_type: "run_summary"
            content: "rec {{ foreach.item._id }} rule={{ foreach.item._source.details.artifact_id | default: 'unknown' }} verdict={{ steps.compute_shadow_verdict.output }} reason={{ steps.compute_shadow_reason.output }}"
            argus:
              agent:
                id: "soc-argus-shadow-executor"
                version: "argus-phase3-r8"
              decision:
                kind: "shadow_gate"
                id: "{{ foreach.item._id }}"
                confidence: 1.0
            gen_ai:
              system: "argus"
              operation:
                name: "argus.shadow_executor.backtest"
              agent:
                id: "soc-argus-shadow-executor"
                name: "ARGUS Shadow Executor"
                description: "Dry-run backtester for draft detection rules (ARGUS R8)"

  - name: heartbeat
    type: elasticsearch.index
    with:
      index: .soc-audit-trail
      document:
        "@timestamp": "{{ execution.startedAt | date: '%Y-%m-%dT%H:%M:%S.%LZ' }}"
        event_type: argus_shadow_executor_tick
        source: "soc-argus-shadow-executor"
        tick_id: "argus-shadow-{{ execution.startedAt | date: '%Y%m%d%H%M%S' }}"
        shadowed_count: "{{ steps.fetch_shadow_candidates.output.hits.hits | size | default: 0 }}"

  - name: log_done
    type: console
    with:
      message: "ARGUS shadow executor complete — candidates={{ steps.fetch_shadow_candidates.output.hits.hits | size | default: 0 }}"
