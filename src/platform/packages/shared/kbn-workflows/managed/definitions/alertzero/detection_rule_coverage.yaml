version: "1"
name: Rule Coverage
description: >
  Per-space Detection rule-coverage worker. Dispatches the global coverage sweep,
  which picks up pending coverage-gap indicators and starts one review per gap.
enabled: false
tags:
  - watch
  - watch-detection
settings:
  __WORKER_RUN_AS_LINE__:
triggers:
  - type: scheduled
    with:
      every: "__WORKER_SCHEDULE_INTERVAL__"
  - type: manual
outputs:
  - name: pending
    type: number
  - name: started
    type: number
  - name: in_flight
    type: number
  - name: search_failed
    type: boolean
  - name: lookup_failed
    type: boolean
consts:
  worker_settings:
    settingsVersion: __WORKER_SETTINGS_VERSION__
    autonomy: "__WORKER_AUTONOMY_LEVEL__"
    scheduleInterval: "__WORKER_SCHEDULE_INTERVAL__"
    extras: __WORKER_EXTRAS__
  # Detonate prototype entry gate, render-time only. The AlertZero server fills it from
  # `xpack.alertzero.detonatePrototypeDev`; it is not part of Worker settings, and the
  # settings PUT schema rejects a write carrying it.
  detonate_prototype_dev: __DETONATE_PROTOTYPE_DEV__
steps:
  - name: run_rule_coverage
    type: workflow.execute
    with:
      workflow-id: system-security-coverage-worker
      run-as-mode: inherit
      inputs:
        autonomy_level: "{{ consts.worker_settings.autonomy }}"
        lookback_days: "${{ consts.worker_settings.extras.lookbackDays }}"
        batch_size: "${{ consts.worker_settings.extras.maxGapsPerRun }}"

  # Detonate prototype hand-off: runs waiting for this Worker in this space. Detached, so
  # the coverage sweep above is never blocked by a prototype child. Skipped with the dev
  # setting off: no failed child step on any tick, in any space. The version bump is the
  # only visible change for deployments that keep the setting off.
  - name: dispatch_detonate_coverage_gap
    type: workflow.executeAsync
    if: "${{ consts.detonate_prototype_dev }}"
    on-failure:
      continue: true
    with:
      workflow-id: system-security-detonate-coverage-gap
      run-as-mode: inherit

  # The sweep swallows read failures and reports them as flags. Without them a
  # failed run looks like an empty queue.
  - name: emit_result
    type: workflow.output
    status: completed
    with:
      pending: "${{ steps.run_rule_coverage.output.pending | default: 0 }}"
      started: "${{ steps.run_rule_coverage.output.started | default: 0 }}"
      in_flight: "${{ steps.run_rule_coverage.output.in_flight | default: 0 }}"
      search_failed: "${{ steps.run_rule_coverage.output.search_failed | default: false }}"
      lookup_failed: "${{ steps.run_rule_coverage.output.lookup_failed | default: false }}"
