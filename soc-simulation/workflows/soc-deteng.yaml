version: '1'
name: SOC Detection Engineering
description: >
  Scheduled rule health review. Runs in two phases so that tactical tuning and
  strategic authoring have clear ownership and blast radius:

  Phase 1 — Signal Quality: tunes existing rules (exceptions, thresholds)
            based on triage outcomes. Emits `redesign_required` for rules that
            are structurally noisy.

  Phase 2 — Principal Detection Engineering: closes coverage gaps with new
            rules (always DISABLED) and redesigns rules flagged in Phase 1.

  Both phases write recommendations into .soc-recommendations with distinct
  `source` values so the human reviewer and the soc-autonomous-applier can
  route them correctly.

consts:
  outcomes_index: ".soc-outcomes"
  coverage_gaps_index: ".soc-coverage-gaps"
  recommendations_index: ".soc-recommendations"
  evolution_log_index: ".soc-evolution-log"
  reasoning_trace_index: ".soc-reasoning-trace"
  artifact_registry_index: ".soc-artifact-registry"

enabled: true

triggers:
  - type: scheduled
    with:
      every: 30m
  - type: manual

consts:
  workflow_id: soc-deteng

steps:
  # ──────────────────────────────────────────────────────────────────────
  # Shared inputs
  # ──────────────────────────────────────────────────────────────────────

  - name: get_recent_outcomes
    type: elasticsearch.search
    with:
      index: "{{ consts.outcomes_index }}"
      query:
        range:
          "@timestamp":
            gte: "now-6h"
      size: 50
  - name: get_coverage_gaps
    type: elasticsearch.search
    with:
      index: "{{ consts.coverage_gaps_index }}"
      query:
        range:
          "@timestamp":
            gte: "now-24h"
      size: 20
  - name: get_rejected_recs
    type: elasticsearch.search
    with:
      index: "{{ consts.recommendations_index }}"
      query:
        bool:
          filter:
            - terms:
                source: ["soc-deteng", "default", "default"]
            - range:
                "@timestamp":
                  gte: "now-7d"
          should:
            - term:
                status: rejected
            - exists:
                field: sub_items
          minimum_should_match: 1
      size: 20
      _source:
        - title
        - summary
        - rejection_reason
        - reviewed_at
        - sub_items
        - source

  - name: get_open_redesign_flags
    type: elasticsearch.search
    with:
      index: "{{ consts.evolution_log_index }}"
      query:
        bool:
          filter:
            - term: {source: "default"}
            - term: {event_type: "redesign_required"}
            - range:
                "@timestamp":
                  gte: "now-24h"
      size: 20
      _source:
        - "@timestamp"
        - rule_id
        - analysis_output

  - name: fetch_rule_corpus
    type: elasticsearch.search
    with:
      index: "{{ consts.recommendations_index }}"
      size: 1
      query:
        bool:
          filter:
            - exists:
                field: "details.new_definition.query"

  # ──────────────────────────────────────────────────────────────────────
  # Phase 1 — Signal quality backtest (deterministic volume / FP proxy)
  # ──────────────────────────────────────────────────────────────────────

  - name: analyze_signal_quality
    type: security.backtestRule
    with:
      query: "{{ steps.fetch_rule_corpus.output.hits.hits.0._source.details.new_definition.query | default: steps.fetch_rule_corpus.output.hits.hits.0._source.query | default: steps.analyze_principal_deteng.output.query | default: '*' }}"
      query_type: "{{ steps.fetch_rule_corpus.output.hits.hits.0._source.details.new_definition.language | default: steps.fetch_rule_corpus.output.hits.hits.0._source.language | default: 'kql' }}"
      index_patterns: ["logs-*", ".alerts-security.alerts-*"]
      time_window: "7d"

  - name: write_signal_quality_evolution_log
    type: elasticsearch.index
    with:
      index: "{{ consts.evolution_log_index }}"
      document:
        "@timestamp": "{{ 'now' | date: '%Y-%m-%dT%H:%M:%SZ' }}"
        source: "default"
        event_type: "signal_quality_tuning"
        analysis_output: "{{ steps.analyze_signal_quality.output | json }}"

  # ARGUS M2.5 — governance trace for Phase 1. Emits a span document with
  # `argus.*` populated so that every detection-engineering decision is
  # attributable to an agent+decision_kind. Phase 1 uses a deterministic backtest step.
  - name: write_signal_quality_reasoning_trace
    type: elasticsearch.index
    with:
      index: "{{ consts.reasoning_trace_index }}"
      document:
        "@timestamp": "{{ 'now' | date: '%Y-%m-%dT%H:%M:%S.%LZ' }}"
        run_id: "deteng-signal-quality-{{ 'now' | date: '%Y%m%d%H%M%S' }}"
        agent_id: "default"
        step_index: 0
        step_type: "run_summary"
        content: "Signal Quality backtest — verdict={{ steps.analyze_signal_quality.output.verdict | default: 'unknown' }} total_hits={{ steps.analyze_signal_quality.output.total_hits | default: 0 }}"
        argus:
          agent:
            id: "default"
            version: "argus-m2.5"
          decision:
            kind: "rule_update"
            id: "{{ steps.write_signal_quality_evolution_log.output._id }}"
            confidence: 1.0
          actor:
            trust_tier: "scoped"
        attributes:
          argus.agent.id: "default"
          argus.agent.version: "argus-m2.5"
          argus.decision.kind: "rule_update"
          argus.decision.id: "{{ steps.write_signal_quality_evolution_log.output._id }}"
          argus.decision.confidence: 1.0
          argus.actor.trust_tier: "scoped"

  - name: write_signal_quality_recommendation
    type: elasticsearch.index
    with:
      index: "{{ consts.recommendations_index }}"
      document:
        "@timestamp": "{{ 'now' | date: '%Y-%m-%dT%H:%M:%SZ' }}"
        rec_id: "signal-quality-{{ 'now' | date: '%Y%m%d%H%M%S' }}"
        type: "rule_tuning"
        source: "default"
        source_doc_id: "{{ steps.write_signal_quality_evolution_log.output._id }}"
        status: "pending"
        title: "Signal Quality tuning - {{ 'now' | date: '%Y-%m-%dT%H:%M' }}"
        summary: "Backtest verdict={{ steps.analyze_signal_quality.output.verdict | default: 'unknown' }} hits_per_hour={{ steps.analyze_signal_quality.output.hits_per_hour | default: 0 }} estimated_fp_rate={{ steps.analyze_signal_quality.output.estimated_fp_rate | default: 0 }}"
        details: "{{ steps.analyze_signal_quality.output | json }}"
        reasoning: "Tactical FP/TP tuning based on .soc-outcomes"
        confidence: 75
        track: "agentic"
        expected_impact: "{{ steps.analyze_signal_quality.output.expected_impact | default: empty }}"
        evidence: "{{ steps.analyze_signal_quality.output.evidence | default: [] }}"

  # ──────────────────────────────────────────────────────────────────────
  # Phase 2 — Principal Detection Engineering (strategic authoring)
  # ──────────────────────────────────────────────────────────────────────

  - name: analyze_principal_deteng
    type: ai.agent
    connector-id: opus
    with:
      message: >
        Close coverage gaps with NEW rules (DISABLED), redesign rules flagged
        by the Signal Quality agent, and deprecate stale rules. Do NOT tune
        existing rules for FP/TP — that is Phase 1's job.

        Apply your instructions' validation rules on every new/redesigned rule:
        - execute the query against a 24h window
        - reject if >10k hits or catch-all
        - confirm fields exist in the target mapping
        - require a concrete MITRE tactic + technique

        Open redesign flags from Phase 1 (prioritize these):
        {{ steps.get_open_redesign_flags.output.hits.hits | json }}

        Coverage gaps (last 24h):
        {{ steps.get_coverage_gaps.output.hits.hits | json }}

        Signal Quality output from Phase 1 (for context):
        {{ steps.analyze_signal_quality.output | json }}

        Previously rejected recommendations (learn from these — do NOT repeat):
        {{ steps.get_rejected_recs.output.hits.hits | json }}

        Respond with JSON:
        {
          "findings": [ /* per-rule authoring/redesign observations */ ],
          "summary":  "...",
          "intents":  [ /* mutation_intent objects for each new/redesigned/retired rule
                           — details.artifact_type="rule", artifact_id="auto-*",
                           op="create|update|delete", expected_ownership="autosoc",
                           new_definition (full rule payload with enabled:false for new rules),
                           evidence[] (must cite coverage gap or redesign flag),
                           expected_impact{} with coverage_delta_pct or fp_reduction_pct */ ]
        }
      schema:
        type: object
        properties:
          findings:
            type: array
            items:
              type: object
              additionalProperties: true
          summary:
            type: string
          intents:
            type: array
            items:
              type: object
              additionalProperties: true
        required:
          - findings
          - summary
          - intents
    timeout: 300s
    on_failure:
      - name: log_analyze_principal_deteng_failure
        type: elasticsearch.request
        with:
          method: POST
          path: /.soc-audit-trail/_doc
          body:
            event_type: workflow_step_failure
            workflow_id: "{{ consts.workflow_id }}"
            step_id: analyze_principal_deteng
            step_name: analyze_principal_deteng
            error: "{{ error.message }}"
            "@timestamp": "{{ 'now' | date: '%Y-%m-%dT%H:%M:%S.%LZ' }}"

  - name: write_principal_evolution_log
    type: elasticsearch.index
    with:
      index: "{{ consts.evolution_log_index }}"
      document:
        "@timestamp": "{{ 'now' | date: '%Y-%m-%dT%H:%M:%SZ' }}"
        source: "default"
        event_type: "principal_deteng_cycle"
        analysis_output: "{{ steps.analyze_principal_deteng.output | json }}"

  # ARGUS M2.5 — governance trace for Phase 2. Separate span from Phase 1 so
  # the governance dashboard can distinguish tactical tuning from strategic
  # authoring when it slices by `argus.decision.kind`.
  - name: write_principal_reasoning_trace
    type: elasticsearch.index
    with:
      index: "{{ consts.reasoning_trace_index }}"
      document:
        "@timestamp": "{{ 'now' | date: '%Y-%m-%dT%H:%M:%S.%LZ' }}"
        run_id: "deteng-principal-{{ 'now' | date: '%Y%m%d%H%M%S' }}"
        agent_id: "default"
        step_index: 0
        step_type: "run_summary"
        content: "Principal DetEng cycle — {{ steps.analyze_principal_deteng.output.intents | size | default: 0 }} intent(s) produced"
        argus:
          agent:
            id: "default"
            version: "argus-m2.5"
          decision:
            kind: "rule_create"
            id: "{{ steps.write_principal_evolution_log.output._id }}"
            confidence: "{{ steps.analyze_principal_deteng.output.confidence | default: 75 | divided_by: 100.0 }}"
          actor:
            trust_tier: "scoped"
        attributes:
          argus.agent.id: "default"
          argus.agent.version: "argus-m2.5"
          argus.decision.kind: "rule_create"
          argus.decision.id: "{{ steps.write_principal_evolution_log.output._id }}"
          argus.decision.confidence: "{{ steps.analyze_principal_deteng.output.confidence | default: 75 | divided_by: 100.0 }}"
          argus.actor.trust_tier: "scoped"

  - name: write_principal_recommendation
    type: elasticsearch.index
    with:
      index: "{{ consts.recommendations_index }}"
      document:
        "@timestamp": "{{ 'now' | date: '%Y-%m-%dT%H:%M:%SZ' }}"
        rec_id: "deteng-principal-{{ 'now' | date: '%Y%m%d%H%M%S' }}"
        type: "rule_authoring"
        source: "default"
        source_doc_id: "{{ steps.write_principal_evolution_log.output._id }}"
        status: "pending"
        title: "Principal DetEng cycle - {{ 'now' | date: '%Y-%m-%dT%H:%M' }}"
        summary: "{{ steps.analyze_principal_deteng.output.summary | default: steps.analyze_principal_deteng.output.message }}"
        details: "{{ steps.analyze_principal_deteng.output | json }}"
        reasoning: "Strategic rule authoring driven by coverage gaps + Signal Quality redesign flags"
        confidence: 75
        track: "agentic"
        expected_impact: "{{ steps.analyze_principal_deteng.output.expected_impact }}"
        evidence: "{{ steps.analyze_principal_deteng.output.evidence | default: [] }}"

  # ──────────────────────────────────────────────────────────────────────
  # Fan-out: materialize concrete mutation intents from BOTH phases
  # Each concrete intent becomes its own .soc-recommendations doc with
  # type=mutation_intent, which soc-autonomous-applier picks up under
  # governance gates.
  # ──────────────────────────────────────────────────────────────────────

  - name: gate_has_signal_quality_intents
    type: console
    with:
      message: >-
        {%- assign _n = steps.analyze_signal_quality.output.intents | size | default: 0 -%}
        {% if _n > 0 %}yes{% else %}no{% endif %}

  - name: write_signal_quality_intents
    type: foreach
    foreach: "{{ steps.analyze_signal_quality.output.intents }}"
    if: "steps.gate_has_signal_quality_intents.output: yes"
    steps:
      - name: write_intent
        type: elasticsearch.index
        with:
          index: "{{ consts.recommendations_index }}"
          document:
            "@timestamp": "{{ 'now' | date: '%Y-%m-%dT%H:%M:%S.%LZ' }}"
            rec_id: "sq-mi-{{ 'now' | date: '%Y%m%d%H%M%S' }}-{{ foreach.index }}"
            schema_version: 2
            type: "mutation_intent"
            source: "default"
            source_doc_id: "{{ steps.write_signal_quality_evolution_log.output._id }}"
            status: "pending"
            title: "{{ foreach.item.title }}"
            summary: "{{ foreach.item.summary }}"
            reasoning: "{{ foreach.item.reasoning | default: 'Signal-quality tuning' }}"
            confidence: "{{ foreach.item.confidence | default: 75 }}"
            track: "{{ foreach.item.track | default: 'agentic' }}"
            housekeeping: "{{ foreach.item.housekeeping | default: false }}"
            expected_impact: "{{ foreach.item.expected_impact | default: empty }}"
            evidence: "{{ foreach.item.evidence | default: empty }}"
            details: "{{ foreach.item.details }}"

  - name: gate_has_principal_intents
    type: console
    with:
      message: >-
        {%- assign _n = steps.analyze_principal_deteng.output.intents | size | default: 0 -%}
        {% if _n > 0 %}yes{% else %}no{% endif %}

  - name: write_principal_intents
    type: foreach
    foreach: "{{ steps.analyze_principal_deteng.output.intents }}"
    if: "steps.gate_has_principal_intents.output: yes"
    steps:
      - name: write_principal_intent
        type: elasticsearch.index
        with:
          index: "{{ consts.recommendations_index }}"
          document:
            "@timestamp": "{{ 'now' | date: '%Y-%m-%dT%H:%M:%S.%LZ' }}"
            rec_id: "deteng-mi-{{ 'now' | date: '%Y%m%d%H%M%S' }}-{{ foreach.index }}"
            schema_version: 2
            type: "mutation_intent"
            source: "default"
            source_doc_id: "{{ steps.write_principal_evolution_log.output._id }}"
            status: "pending"
            title: "{{ foreach.item.title }}"
            summary: "{{ foreach.item.summary }}"
            reasoning: "{{ foreach.item.reasoning | default: 'Principal DetEng authoring' }}"
            confidence: "{{ foreach.item.confidence | default: 75 }}"
            track: "{{ foreach.item.track | default: 'agentic' }}"
            housekeeping: "{{ foreach.item.housekeeping | default: false }}"
            expected_impact: "{{ foreach.item.expected_impact | default: empty }}"
            evidence: "{{ foreach.item.evidence | default: empty }}"
            details: "{{ foreach.item.details }}"

      - name: seed_artifact_registry
        type: elasticsearch.index
        with:
          index: "{{ consts.artifact_registry_index }}"
          id: "{{ foreach.item.details.artifact_type | default: 'rule' }}-{{ foreach.item.details.artifact_id | default: foreach.index }}"
          document:
            "@timestamp": "{{ 'now' | date: '%Y-%m-%dT%H:%M:%S.%LZ' }}"
            artifact_id: "{{ foreach.item.details.artifact_id }}"
            type: "{{ foreach.item.details.artifact_type | default: 'rule' }}"
            owner: "autosoc"
            created_by: "soc-deteng"
            created_at: "{{ 'now' | date: '%Y-%m-%dT%H:%M:%S.%LZ' }}"

  - name: log_result
    type: console
    with:
      message: >-
        Detection Engineering cycle complete —
        {{ steps.analyze_signal_quality.output.intents | size | default: 0 }} signal-quality
        + {{ steps.analyze_principal_deteng.output.intents | size | default: 0 }} principal intent(s)
        dispatched to soc-autonomous-applier.
