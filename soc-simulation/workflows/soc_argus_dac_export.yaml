version: '1'
name: ARGUS DaC Export (B4)
description: >
  AutoDEX B4 — Detection-as-code (DaC) export spike.

  Vision-doc §1.6.1 calls for a git-backed deployment path so detection
  rules become committable, reviewable, round-trippable artifacts. This
  workflow is the **in-cluster producer** of that loop: every 1h it
  scans applied ARGUS-authored mutation_intent rows that have not yet
  been exported to git and queues a DaC artifact per rule into
  `.soc-dac-export-queue`. A sidecar agent (out of cluster, with git
  credentials) reads the queue, opens PRs, and updates the queue rows
  with `status: pr_opened` + `git_status.pr_url`.

  Why a queue (not a direct push)?
    - Keeps git credentials OUT of the Kibana cluster.
    - Lets the org choose any git provider (GitHub / GitLab / Bitbucket
      / private gitea) by swapping the sidecar.
    - Decouples cluster availability from git availability — a transient
      git outage doesn't block ARGUS synthesis.

  Pure-logic core lives at `lib/argus/dac/rule_artifact.ts`
  (23 unit tests; round-trip identity proven). The artifact envelope:

      apiVersion: argus.elastic.co/v1
      kind: ARGUSDetectionRule
      metadata: { name, version, source, authored_by, authored_at }
      spec:     { name, description, query, gate_overrides? }

  Triggers:
    * scheduled 1h : steady cadence
    * manual       : operator can kick a backfill

enabled: true

triggers:
  - type: scheduled
    with:
      every: 1h
  - type: manual

consts:
  mutations_index: ".soc-mutation-intents"
  queue_index:     ".soc-dac-export-queue"
  audit_index:     ".soc-audit-trail"
  window_recent:   "now-24h"
  fanout_max:      50
  schema_version:  1

steps:
  # ── 1. Find applied ARGUS-authored rules awaiting export ─────────────
  - name: find_applied_argus_rules
    type: elasticsearch.search
    with:
      index: "{{ consts.mutations_index }}"
      size: "{{ consts.fanout_max }}"
      query:
        bool:
          filter:
            - term:  { kind: "rule_create" }
            - term:  { status: "applied" }
            - term:  { "argus.origin": "synthesis_driver" }
            - range:
                "@timestamp":
                  gte: "{{ consts.window_recent }}"
          must_not:
            - exists: { field: "argus.dac_exported_at" }
      sort:
        - "@timestamp":
            order: desc

  # ── 1b. Compute a gate flag the workflow `if` operator can read ──────
  # Workflow `if:` uses KQL-equality, not Liquid. Land arithmetic checks
  # in a console step's output, then match on the resulting "yes"/"no".
  - name: gate_has_rules
    type: console
    with:
      message: >-
        {%- assign _n = steps.find_applied_argus_rules.output.hits.hits | size | default: 0 -%}
        {% if _n > 0 %}yes{% else %}no{% endif %}

  # ── 2. Queue an export per rule ──────────────────────────────────────
  # NOTE: This Liquid emission is the conservative shape. The full
  # round-trip-safe artifact (with sorted labels/annotations,
  # canonical JSON stringification) lives in `rule_artifact.ts`. A
  # follow-up registered server-side step `security.argusBuildDacArtifact`
  # will call the helper and write a byte-identical artifact. Until
  # then the YAML emits the conservative envelope and the sidecar
  # canonicalises it before committing — the round-trip helpers gate
  # accept/reject anyway.
  - name: queue_exports
    type: foreach
    foreach: "{{ steps.find_applied_argus_rules.output.hits.hits }}"
    if: "steps.gate_has_rules.output: yes"
    steps:
      - name: write_queue_row
        type: elasticsearch.index
        with:
          index: "{{ consts.queue_index }}"
          id: "{{ foreach.item._source.mutation_intent_id }}"
          document:
            "@timestamp": "{{ execution.startedAt | date: '%Y-%m-%dT%H:%M:%S.%LZ' }}"
            queue_id: "{{ foreach.item._source.mutation_intent_id }}"
            rule_id: "{{ foreach.item._source.proposed_rule.rule_id | default: foreach.item._source.mutation_intent_id }}"
            rule_version: "{{ foreach.item._source.proposed_rule.rule_version | default: '1' }}"
            source: "argus"
            status: "pending"
            artifact:
              apiVersion: "argus.elastic.co/v1"
              kind: "ARGUSDetectionRule"
              metadata:
                name: "{{ foreach.item._source.proposed_rule.rule_id | default: foreach.item._source.mutation_intent_id }}"
                version: "{{ foreach.item._source.proposed_rule.rule_version | default: '1' }}"
                source: "argus"
                authored_by: "{{ foreach.item._source.argus.agent_id | default: 'argus.synthesis.driver' }}"
                authored_at: "{{ foreach.item._source['@timestamp'] }}"
              spec:
                name: "{{ foreach.item._source.proposed_rule.name | default: foreach.item._source.proposed_rule.rule_id }}"
                description: "{{ foreach.item._source.proposed_rule.description | default: 'ARGUS-synthesised detection' }}"
                query: "{{ foreach.item._source.proposed_rule.query | default: empty }}"
            git_status:
              branch: null
              pr_url: null
              committed_at: null
              merged_at: null
            schema_version: "{{ consts.schema_version }}"

  # ── 3. Heartbeat ─────────────────────────────────────────────────────
  - name: heartbeat
    type: elasticsearch.index
    with:
      index: "{{ consts.audit_index }}"
      document:
        "@timestamp": "{{ execution.startedAt | date: '%Y-%m-%dT%H:%M:%S.%LZ' }}"
        event_type: "argus_dac_export_tick"
        source: "soc_argus_dac_export"
        tick_id: "argus-dac-{{ execution.startedAt | date: '%Y%m%d%H%M%S' }}"
        rules_queued: "{{ steps.find_applied_argus_rules.output.hits.total.value | default: 0 }}"

  - name: log_done
    type: console
    with:
      message: "ARGUS DaC export complete — rules_queued={{ steps.find_applied_argus_rules.output.hits.total.value | default: 0 }}"
