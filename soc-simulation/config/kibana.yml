# SOC Simulation — Kibana configuration overrides
# This file is mounted into the Docker container, replacing the default kibana.yml.
# All essential settings must be included here.

# Bind to all interfaces (required for Docker port mapping)
server.host: "0.0.0.0"

# Enable experimental Agent Builder features (SML, skills)
uiSettings:
  overrides:
    agentBuilder:experimentalFeatures: true
    agentBuilder:navEnabled: true

# Increase connector response timeout (default 60s too short for AI agent tool calls)
xpack.actions.responseTimeout: 300s
