version: "1"
name: Detection Rule Tuning Worker
description: >
  Harvests rules whose alerts analysts closed as false positives, diagnoses each one,
  and applies the approved tuning change: a rule exception, a narrowed query,
  or a risk score adjustment — otherwise it hands off for manual tuning.
enabled: true
tags:
  - security
  - detection-rule-tuning
settings:
  concurrency:
    # The harvest reads alerts NOT carrying `reviewed_tag`, but that tag is only written
    # by the mark steps at the very end — after a 72h approval gate. Two overlapping runs
    # against the same alert index would both harvest the same alerts and diagnose them
    # twice, so production MUST share one lock: the key defaults to a constant.
    #
    # An eval run drives its own isolated stack and its own seeded alert index, where that
    # cross-run hazard does not exist and the shared lock only serializes fixtures that
    # have nothing to do with each other. Passing `concurrency_key` lets such a run opt
    # into an isolated lock; unset, behaviour is byte-identical to the constant key.
    key: "detection-rule-tuning-{{ inputs.concurrency_key | default: 'shared' }}"
    strategy: drop
    max: 1
triggers:
  - type: manual
    inputs:
      properties:
        min_fp_count:
          type: number
          default: 1
          description: Minimum false-positive alerts a rule needs before it is diagnosed.
        preview_invocation_count:
          type: number
          default: 2
          description: Rule executions each backtest preview simulates.
        lookback_hours:
          type: number
          default: 24
          description: How far back to look for alerts analysts closed as false positives.
        connector_id:
          type: string
          description: >
            Inference connector the diagnose step runs on. Pinning it here is what lets an
            eval run compare models; unset, every run silently uses the deployment default
            and a multi-model sweep measures the same model N times.
        concurrency_key:
          type: string
          description: >
            Suffix for the concurrency lock. Leave unset in production so every run shares
            one lock — the harvest's `reviewed_tag` filter cannot prevent two overlapping
            runs from diagnosing the same alerts, because that tag is written only after
            the approval gate. Eval runs own an isolated stack and seeded alerts, so they
            pass a unique value to stop unrelated fixtures serializing behind each other.
      additionalProperties: false
outputs:
  - name: rules_examined
    type: number
  - name: harvest_failed
    type: boolean
consts:
  # Liquid has no array literal, so `| default: []` yields undefined rather than an
  # empty array. A const is the only way to spell an empty-array fallback.
  no_rows: []
  # Written onto every alert that reached a decision, and filtered out by the harvest,
  # so a later sweep cannot rediagnose the same alerts into the same proposal. The
  # mark steps below spell the tag lists inline: setAlertTags validates them statically.
  reviewed_tag: detection-watch:tuning-reviewed
  dismissed_tags:
    - detection-watch:tuning-reviewed
    - detection-watch:tuning-dismissed
  applied_tags:
    - detection-watch:tuning-reviewed
    - detection-watch:tuning-applied
steps:
  # Scoped to one space because the tag API writes to the space's own alerts index, so
  # a cross-space harvest would keep rediagnosing alerts it can never mark.
  # `allow_partial_results: false` because a partial aggregation would both undercount
  # fp_count and return a short alert_ids list, leaving alerts that drove a decision
  # untagged. The 1000-id slice keeps the bulk tag request inside Kibana's payload
  # limit; a rule noisier than that surfaces again on the next sweep.
  - name: harvest_fp_alerts_by_rule
    type: elasticsearch.esql.query
    with:
      allow_partial_results: false
      query: |-
        FROM .alerts-security.alerts-{{ workflow.spaceId }} METADATA _id
        | WHERE `kibana.alert.workflow_status` == "closed"
          AND `kibana.alert.workflow_reason` == "false_positive"
          AND @timestamp >= NOW() - {{ inputs.lookback_hours }} hours
          AND NOT MV_CONTAINS(`kibana.alert.workflow_tags`, "{{ consts.reviewed_tag }}")
        | STATS fp_count = COUNT(*), last_fp_at = MAX(@timestamp), alert_ids = MV_SLICE(VALUES(_id), 0, 999) BY `kibana.alert.rule.uuid`, `kibana.alert.rule.name`, `kibana.alert.rule.rule_id`
        | WHERE fp_count >= {{ inputs.min_fp_count }}
        | KEEP `kibana.alert.rule.uuid`, `kibana.alert.rule.name`, fp_count, `kibana.alert.rule.rule_id`, last_fp_at, alert_ids
        | SORT fp_count DESC
        | LIMIT 10
    on-failure:
      continue: true

  # No iteration-timeout: an enclosing step-timeout zone would cut short the 72h
  # approval gate below. Runaway work is bounded by the agent step's own timeout.
  - name: tune_each_rule
    type: foreach
    foreach: "${{ steps.harvest_fp_alerts_by_rule.output.values | default: consts.no_rows }}"
    steps:
      - name: fetch_rule
        type: kibana.request
        with:
          method: GET
          path: "/s/{{ workflow.spaceId }}/api/detection_engine/rules?rule_id={{ foreach.item.3 }}"
          headers:
            kbn-xsrf: string
            elastic-api-version: "2023-10-31"
            Content-Type: application/json
        on-failure:
          continue: true

      # Surfaces fetch failures in the execution trace so they don't disappear
      # silently. Alerts stay untagged, so the rule re-appears on the next sweep.
      - name: record_fetch_failed
        type: data.set
        if: "${{ steps.fetch_rule.error != null }}"
        with:
          rule_id: "{{ foreach.item.0 }}"
          rule_name: "{{ foreach.item.1 }}"
          note: >-
            Could not fetch rule details. Alerts will be re-harvested on the next sweep.

      - name: fetch_fp_entities
        type: elasticsearch.esql.query
        if: "${{ steps.fetch_rule.error == null and steps.fetch_rule.output.enabled == true }}"
        with:
          allow_partial_results: false
          query: |-
            FROM .alerts-security.alerts-{{ workflow.spaceId }}
            | WHERE `kibana.alert.rule.uuid` == "{{ foreach.item.0 }}"
              AND `kibana.alert.workflow_status` == "closed"
              AND `kibana.alert.workflow_reason` == "false_positive"
              AND @timestamp >= NOW() - {{ inputs.lookback_hours }} hours
            | STATS entity_fp_count = COUNT(*) BY `host.name`, `user.name`, `source.ip`, `process.name`
            | SORT entity_fp_count DESC
            | LIMIT 20
        on-failure:
          continue: true

      - name: fetch_open_entities
        type: elasticsearch.esql.query
        if: "${{ steps.fetch_rule.error == null and steps.fetch_rule.output.enabled == true }}"
        with:
          allow_partial_results: false
          query: |-
            FROM .alerts-security.alerts-{{ workflow.spaceId }}
            | WHERE `kibana.alert.rule.uuid` == "{{ foreach.item.0 }}"
              AND NOT (`kibana.alert.workflow_status` == "closed" AND `kibana.alert.workflow_reason` == "false_positive")
              AND @timestamp >= NOW() - {{ inputs.lookback_hours }} hours
            | STATS entity_count = COUNT(*) BY `host.name`, `user.name`, `source.ip`, `process.name`
            | SORT entity_count DESC
            | LIMIT 20
        on-failure:
          continue: true

      - name: diagnose_rule
        type: ai.agent
        if: "${{ steps.fetch_rule.error == null and steps.fetch_rule.output.enabled == true }}"
        timeout: "10m"
        create-conversation: true
        connector-id: "{{ inputs.connector_id }}"
        with:
          message: |-
            Use the [/investigate-rule](skill://investigate-rule) skill to investigate
            rule_id "{{ foreach.item.3 }}" ({{ foreach.item.1 }}), then return a structured
            tuning proposal. Ground every claim in the rule definition and the evidence
            below; this decision is applied automatically once an analyst approves it, so
            do not describe changes for a human to make by hand. Follow the skill's
            investigation steps, but answer with the schema below rather than its prose
            sections, and choose the change_type by the criteria stated here.

            {{ foreach.item.2 }} alerts from this rule were closed as false positives
            during the last {{ inputs.lookback_hours }} hours. These are confirmed
            analyst dispositions — not suspected noise.

            Rule definition
              type:            {{ steps.fetch_rule.output.type }}
              language:        {{ steps.fetch_rule.output.language | default: 'n/a' }}
              query:           {{ steps.fetch_rule.output.query | default: 'n/a' }}
              risk_score:      {{ steps.fetch_rule.output.risk_score }}
              severity:        {{ steps.fetch_rule.output.severity }}

            The query above is the rule's current logic — narrow it only from this text.
            The risk_score and severity above are its current scoring; propose new values
            relative to them rather than in the abstract.

            Entity breakdown of those false positives
            (columns: {{ steps.fetch_fp_entities.output.columns | map: 'name' | json }}):
            {% if steps.fetch_fp_entities.error == null and steps.fetch_fp_entities.output.values %}
            {{ steps.fetch_fp_entities.output.values | json }}

            Each row is one host/user/ip/process combination and how many false
            positives it accounts for. A cluster concentrated on one combination is
            exceptionable when the rule type allows it; one spread evenly across
            unrelated entities is not, and points at the query or the rule itself.
            {% else %}
            Unavailable — the entity aggregation did not return. Diagnose from the rule
            definition alone, and prefer `manual` over a change you cannot ground in
            evidence.
            {% endif %}

            Still-open alerts from this rule (everything NOT closed as a false positive —
            live detections and other dispositions)
            (columns: {{ steps.fetch_open_entities.output.columns | map: 'name' | json }}):
            {% if steps.fetch_open_entities.error == null and steps.fetch_open_entities.output.values %}
            {{ steps.fetch_open_entities.output.values | json }}

            These are live detections. If entities that produce the false positives
            above also appear in the still-open alerts here, then no exception,
            suppression, or query narrowing can remove the noise without also
            suppressing live alerts — every field-based change is unsafe for them.
            {% else %}
            None returned — every recent alert from this rule was closed as a false
            positive, or the aggregation did not return.
            {% endif %}

            After investigating, return one structured tuning proposal using the schema.
            Choose exactly one change_type — the one whose criteria the evidence actually
            meets. The four are listed in no priority order and none is a preferred or
            default answer; a type is correct only when its own criteria below are met.

            exception  — The rule logic is correct but fires on a known-good entity.
              Use the entity breakdown above to identify the tightest conditions.
              Populate exception_entries; each entry is one field condition the step
              will AND together. Supported operators:
                is / is_not              → single value string
                is_one_of / is_not_one_of → values array
                matches / does_not_match  → glob pattern string (* and ?)
                exists / does_not_exist   → no value needed

            query  — The query is too broad and FPs share a pattern not worth
              excepting individually. Only valid for rule type "query". Populate
              proposed_query with the full narrowed KQL in the same language.

            Rule type gates the automated options. The rule's type is shown above.
            exception and query both edit query-rule logic: when the type is
            anything other than "query" (for example "new_terms"), neither applies
            however concentrated the false positives look, and the correct answer
            is manual even for a single repeating entity.

            risk_score  — The rule has real detection value but its alerts are rated
              more urgent than they are. The decisive evidence is the current scoring
              shown above versus what the activity is worth: benign routine work
              carrying a high risk_score or severity is mis-rated, not un-tunable.
              This is the right answer when the false positives are spread across many
              distinct entities (so no exception is tight enough) yet the query itself
              is correctly written (so nothing needs narrowing). Populate
              proposed_risk_score (0–100) and proposed_severity
              (low / medium / high / critical) with the lowered rating.

            manual  — Use ONLY after checking the three above against their own criteria
              and finding that none is met: no known-good entity to except, no shared
              over-broad pattern to narrow (or the rule type is not "query"), and the
              alerts' current scoring already matches what the activity is worth.
              When the entities behind the false positives also appear in the still-open
              alerts above, every field-based change would suppress live detections too —
              that overlap on its own makes this a manual situation.
              `manual` is not a fallback for uncertainty — if one of the three fits
              the evidence, choose it. Use summary
              to describe: (a) the false-positive pattern you found, (b) which automated
              paths you considered (exception / query / risk_score) and the specific
              reason each is unsafe or inapplicable for this rule, and (c) a concrete
              recommendation for what the analyst should do manually in the Detection
              Rules UI.
          schema:
            type: object
            properties:
              change_type:
                type: string
                enum: [exception, query, risk_score, manual]
              summary:
                type: string
              exception_entries:
                type: array
                minItems: 1
                items:
                  type: object
                  properties:
                    field:
                      type: string
                    operator:
                      type: string
                      enum: [is, is_not, is_one_of, is_not_one_of, matches, does_not_match, exists, does_not_exist]
                    value:
                      type: string
                    values:
                      type: array
                      items:
                        type: string
                  required: [field, operator]
              proposed_query:
                type: string
              proposed_risk_score:
                type: integer
                minimum: 0
                maximum: 100
              proposed_severity:
                type: string
                enum: [low, medium, high, critical]
            required: [change_type, summary]

      # Both previews end at the last false positive, not at now, so the rule's own
      # `from` lookback covers the events analysts judged. Anchoring at now would
      # backtest a window where those events no longer exist.
      - name: preview_current_query
        type: workflow.execute
        if: >-
          ${{ steps.diagnose_rule.output.structured_output.change_type == 'query'
            and steps.diagnose_rule.output.structured_output.proposed_query != ''
            and steps.fetch_rule.output.type == 'query' }}
        with:
          workflow-id: system-security-rule-preview
          inputs:
            space_id: "{{ workflow.spaceId }}"
            preview_body:
              type: query
              name: "{{ steps.fetch_rule.output.name }}"
              description: "{{ steps.fetch_rule.output.description }}"
              query: "{{ steps.fetch_rule.output.query }}"
              language: "{{ steps.fetch_rule.output.language }}"
              index: "${{ steps.fetch_rule.output.index }}"
              severity: "{{ steps.fetch_rule.output.severity }}"
              risk_score: "${{ steps.fetch_rule.output.risk_score }}"
              interval: "{{ steps.fetch_rule.output.interval }}"
              from: "{{ steps.fetch_rule.output.from }}"
              to: "{{ steps.fetch_rule.output.to }}"
              invocationCount: "${{ inputs.preview_invocation_count }}"
              timeframeEnd: "{{ foreach.item.4 }}"

      - name: preview_proposed_query
        type: workflow.execute
        if: >-
          ${{ steps.diagnose_rule.output.structured_output.change_type == 'query'
            and steps.diagnose_rule.output.structured_output.proposed_query != ''
            and steps.fetch_rule.output.type == 'query' }}
        with:
          workflow-id: system-security-rule-preview
          inputs:
            space_id: "{{ workflow.spaceId }}"
            preview_body:
              type: query
              name: "{{ steps.fetch_rule.output.name }}"
              description: "{{ steps.fetch_rule.output.description }}"
              query: "{{ steps.diagnose_rule.output.structured_output.proposed_query }}"
              language: "{{ steps.fetch_rule.output.language }}"
              index: "${{ steps.fetch_rule.output.index }}"
              severity: "{{ steps.fetch_rule.output.severity }}"
              risk_score: "${{ steps.fetch_rule.output.risk_score }}"
              interval: "{{ steps.fetch_rule.output.interval }}"
              from: "{{ steps.fetch_rule.output.from }}"
              to: "{{ steps.fetch_rule.output.to }}"
              invocationCount: "${{ inputs.preview_invocation_count }}"
              timeframeEnd: "{{ foreach.item.4 }}"

      - name: review_tuning
        type: waitForApproval
        if: >-
          ${{ steps.fetch_rule.error == null
            and steps.fetch_rule.output.enabled == true
            and steps.diagnose_rule.output.structured_output.summary != null }}
        timeout: "72h"
        with:
          approveLabel: Apply tuning
          rejectLabel: Dismiss
          message: |-
            Rule tuning proposal for {{ foreach.item.1 }}
            {{ foreach.item.2 }} alerts were closed as false positives.

            {{ steps.diagnose_rule.output.structured_output.summary }}

            {% if steps.diagnose_rule.output.structured_output.change_type == "exception" %}
            Proposed exception:
            {% for entry in steps.diagnose_rule.output.structured_output.exception_entries %}
            - {{ entry.field }} {{ entry.operator }}{% if entry.values %} {{ entry.values | join: ", " }}{% elsif entry.value %} {{ entry.value }}{% endif %}
            {% endfor %}
            Approving adds the exception to the rule's own exception list. It can be removed in the Detection Rules UI.
            {% endif %}
            {% if steps.diagnose_rule.output.structured_output.change_type == "query" %}
            Current query:
            {{ steps.fetch_rule.output.query }}

            Proposed query:
            {{ steps.diagnose_rule.output.structured_output.proposed_query }}

            Backtest:
            current {% if steps.preview_current_query.output.succeeded and steps.preview_current_query.output.is_aborted == false %}{{ steps.preview_current_query.output.alert_count }}{% else %}inconclusive{% endif %},
            proposed {% if steps.preview_proposed_query.output.succeeded and steps.preview_proposed_query.output.is_aborted == false %}{{ steps.preview_proposed_query.output.alert_count }}{% else %}inconclusive{% endif %}.
            {% if steps.preview_current_query.output.error_text != '' %}
            Current query preview errors: {{ steps.preview_current_query.output.error_text }}
            {% endif %}
            {% if steps.preview_proposed_query.output.error_text != '' %}
            Proposed query preview errors: {{ steps.preview_proposed_query.output.error_text }}
            {% endif %}
            Approving replaces the rule query. It can be edited back in the Detection Rules UI.
            {% endif %}
            {% if steps.diagnose_rule.output.structured_output.change_type == "risk_score" %}
            Proposed risk score: {{ steps.diagnose_rule.output.structured_output.proposed_risk_score }}
            Proposed severity: {{ steps.diagnose_rule.output.structured_output.proposed_severity }}
            Approving patches the rule's risk score and severity. It can be changed back in the Detection Rules UI.
            {% endif %}
            {% if steps.diagnose_rule.output.structured_output.change_type == "manual" %}
            No automated change can be applied safely for this rule.
            Approving records the handoff — no rule changes are made automatically.

            Analysis and recommendation:
            {{ steps.diagnose_rule.output.structured_output.summary }}

            Apply the recommended change in the Detection Rules UI.
            {% endif %}

            {% if steps.diagnose_rule.output.conversation_id %}
            Continue investigation: /app/agent_builder/conversations/{{ steps.diagnose_rule.output.conversation_id }}
            {% endif %}

      # Decided once so the apply and hand-off branches stay exact complements.
      # Gated on fetch_rule so a skipped diagnose_rule cannot carry a prior
      # iteration's stale proposal into the apply steps.
      - name: classify_proposal
        type: data.set
        if: "${{ steps.fetch_rule.error == null and steps.fetch_rule.output.enabled == true }}"
        with:
          can_apply_query: >-
            ${{ steps.diagnose_rule.output.structured_output.change_type == 'query'
              and steps.diagnose_rule.output.structured_output.proposed_query != ''
              and steps.fetch_rule.output.type == 'query' }}
          can_apply_exception: >-
            ${{ steps.diagnose_rule.output.structured_output.change_type == 'exception'
              and steps.diagnose_rule.output.structured_output.exception_entries != null
              and steps.diagnose_rule.output.structured_output.exception_entries.size > 0 }}
          can_apply_risk_score: >-
            ${{ steps.diagnose_rule.output.structured_output.change_type == 'risk_score'
              and steps.diagnose_rule.output.structured_output.proposed_risk_score != null
              and steps.diagnose_rule.output.structured_output.proposed_severity != null }}

      - name: apply_query_tuning
        type: security.patchRule
        if: >-
          ${{ steps.fetch_rule.error == null
            and steps.fetch_rule.output.enabled == true
            and steps.review_tuning.output.response.approved == true
            and steps.classify_proposal.output.can_apply_query == true }}
        on-failure:
          continue: true
        with:
          patch:
            id: "{{ foreach.item.0 }}"
            query: "{{ steps.diagnose_rule.output.structured_output.proposed_query }}"

      # Each approval creates its own item. A rule only returns here on new false
      # positives, so a later proposal is a different pattern, not a duplicate.
      - name: apply_exception_tuning
        type: security.createRuleException
        if: >-
          ${{ steps.fetch_rule.error == null
            and steps.fetch_rule.output.enabled == true
            and steps.review_tuning.output.response.approved == true
            and steps.classify_proposal.output.can_apply_exception == true }}
        on-failure:
          continue: true
        with:
          rule_id: "{{ foreach.item.0 }}"
          name: "Tuning: {{ foreach.item.1 }}"
          description: "Added by the rule tuning workflow."
          entries: "${{ steps.diagnose_rule.output.structured_output.exception_entries }}"


      - name: apply_risk_score_tuning
        type: security.patchRule
        if: >-
          ${{ steps.fetch_rule.error == null
            and steps.fetch_rule.output.enabled == true
            and steps.review_tuning.output.response.approved == true
            and steps.classify_proposal.output.can_apply_risk_score == true }}
        on-failure:
          continue: true
        with:
          patch:
            id: "{{ foreach.item.0 }}"
            risk_score: "${{ steps.diagnose_rule.output.structured_output.proposed_risk_score }}"
            severity: "{{ steps.diagnose_rule.output.structured_output.proposed_severity }}"


      - name: record_manual_tuning
        type: data.set
        if: >-
          ${{ steps.fetch_rule.error == null
            and steps.fetch_rule.output.enabled == true
            and steps.review_tuning.output.response.approved == true
            and steps.classify_proposal.output.can_apply_query == false
            and steps.classify_proposal.output.can_apply_exception == false
            and steps.classify_proposal.output.can_apply_risk_score == false }}
        with:
          rule_id: "{{ foreach.item.0 }}"
          note: Apply the approved proposal in the Detection Rules UI.

      # Each error check is paired with the gate that ran its apply step: a skipped
      # step leaves no execution record, so `steps.<name>.error` would otherwise
      # resolve to that step's result from an earlier iteration of the loop.
      - name: classify_apply_failures
        type: data.set
        with:
          any_apply_ran: >-
            ${{ steps.classify_proposal.output.can_apply_query == true
              or steps.classify_proposal.output.can_apply_exception == true
              or steps.classify_proposal.output.can_apply_risk_score == true }}
          query_failed: >-
            ${{ steps.review_tuning.output.response.approved == true
              and steps.classify_proposal.output.can_apply_query == true
              and steps.apply_query_tuning.error != null }}
          exception_failed: >-
            ${{ steps.review_tuning.output.response.approved == true
              and steps.classify_proposal.output.can_apply_exception == true
              and steps.apply_exception_tuning.error != null }}
          risk_score_failed: >-
            ${{ steps.review_tuning.output.response.approved == true
              and steps.classify_proposal.output.can_apply_risk_score == true
              and steps.apply_risk_score_tuning.error != null }}

      # An approved proposal whose apply step errored must not vanish silently.
      - name: record_failed_apply
        type: data.set
        if: >-
          ${{ steps.classify_apply_failures.output.query_failed == true
            or steps.classify_apply_failures.output.exception_failed == true
            or steps.classify_apply_failures.output.risk_score_failed == true }}
        with:
          rule_id: "{{ foreach.item.0 }}"
          note: >-
            The approved tuning change failed to apply automatically. Apply it in the
            Detection Rules UI.

      # ES|QL rows arrive as positional arrays, so `item.5` is the sixth field the
      # harvest's KEEP projects: the alert_ids multivalue.
      - name: mark_alerts_dismissed
        type: security.setAlertTags
        if: >-
          ${{ steps.fetch_rule.error == null
            and steps.fetch_rule.output.enabled == true
            and steps.review_tuning.output.response.approved == false }}
        with:
          alert_ids: "${{ foreach.item.5 }}"
          tags_to_add: "${{ consts.dismissed_tags }}"
          tags_to_remove: []
        on-failure:
          continue: true

      # Alerts behind a failed apply stay untagged on purpose: the change never landed,
      # so the next sweep re-harvests them and proposes it again.
      - name: mark_alerts_applied
        type: security.setAlertTags
        if: >-
          ${{ steps.fetch_rule.error == null
            and steps.fetch_rule.output.enabled == true
            and steps.review_tuning.output.response.approved == true
            and steps.classify_apply_failures.output.any_apply_ran == true
            and steps.classify_apply_failures.output.query_failed != true
            and steps.classify_apply_failures.output.exception_failed != true
            and steps.classify_apply_failures.output.risk_score_failed != true }}
        with:
          alert_ids: "${{ foreach.item.5 }}"
          tags_to_add: "${{ consts.applied_tags }}"
          tags_to_remove: []
        on-failure:
          continue: true

      # Manual handoffs are approved but nothing is applied; tag alerts reviewed-only
      # so the harvest filter excludes them and the same proposal is not re-diagnosed.
      - name: mark_alerts_reviewed_manual
        type: security.setAlertTags
        if: >-
          ${{ steps.fetch_rule.error == null
            and steps.fetch_rule.output.enabled == true
            and steps.review_tuning.output.response.approved == true
            and steps.classify_proposal.output.can_apply_query == false
            and steps.classify_proposal.output.can_apply_exception == false
            and steps.classify_proposal.output.can_apply_risk_score == false }}
        with:
          alert_ids: "${{ foreach.item.5 }}"
          tags_to_add: "${{ consts.dismissed_tags }}"
          tags_to_remove: []
        on-failure:
          continue: true

  # Size is computed on its own because comparison operators cannot follow a filter chain.
  - name: count_examined_rules
    type: data.set
    with:
      rules_examined: "${{ steps.harvest_fp_alerts_by_rule.output.values | size | default: 0 }}"

  - name: emit_result
    type: workflow.output
    status: completed
    with:
      rules_examined: "${{ steps.count_examined_rules.output.rules_examined }}"
      harvest_failed: "${{ steps.harvest_fp_alerts_by_rule.error != null }}"
