version: "1"
name: Detonate completion sweep (prototype)
description: >
  Detonate prototype: writes finished detonations back to the alerts they were
  started from. Lists this space's completed runs, keeps the newest per source
  alert, skips alerts that already carry a detonation verdict, and applies the
  rest (tag + note, never status). Every write-back is journaled into one
  Investigation per sweep, so the analyst reads the sweep's verdicts in one
  place. It starts no detonations and spends no sandbox VMs.
enabled: false
tags:
  - security
  - detonate_prototype

settings:
  # One sweep per space. The alert's verdict tag is the handled marker, so a
  # dropped overlapping sweep loses nothing: the next sweep finds the same
  # untagged alerts again.
  concurrency:
    key: detonate-completion-sweep
    strategy: drop
    max: 1

triggers:
  - type: scheduled
    with:
      every: 5m
  # Keep manual for desk testing without waiting for the schedule.
  - type: manual

steps:
  # ---------------------------------------------------------------------------
  # 1. Completed runs whose source alert has no verdict yet. The step reads the
  #    alert tags itself, so idempotence lives in one unit-tested place.
  # ---------------------------------------------------------------------------
  - name: completed_runs
    type: detonate.prototype.detonateCompletedRuns
    on-failure:
      retry:
        max-attempts: 3
        delay: 5s
    with:
      max_pending: 20

  # ---------------------------------------------------------------------------
  # 2. Open the sweep's Investigation. A sweep with nothing to write back opens
  #    none, so an idle schedule does not fill the Investigations list.
  # ---------------------------------------------------------------------------
  - name: create_investigation
    type: ai.conversation.create
    if: "${{ steps.completed_runs.output.pending_count > 0 }}"
    with:
      template_id: investigation
      title: "File Detonation — completion sweep {{ execution.id }}"
      access_control:
        access_mode: public
      metadata:
        status: open
        severity: low
        description: >-
          Detonation verdicts written back to their source alerts by the
          completion sweep.

  # ---------------------------------------------------------------------------
  # 3. Write each verdict back, then journal it. One failed alert must not
  #    abort the others; a failed apply ends its iteration before the journal
  #    line, so the Investigation only lists verdicts that landed.
  # ---------------------------------------------------------------------------
  - name: write_back
    type: foreach
    if: "${{ steps.completed_runs.output.pending_count > 0 }}"
    foreach: "${{ steps.completed_runs.output.pending }}"
    iteration-on-failure:
      continue: true
    steps:
      - name: apply
        type: detonate.prototype.applyDetonationVerdict
        with:
          verdict: "{{ foreach.item.verdict }}"
          alert_id: "{{ foreach.item.alert_id }}"
          task_id: "{{ foreach.item.task_id }}"
          evidence: "{{ foreach.item.evidence }}"

      - name: journal
        type: ai.conversation.add_user_message
        if: "${{ steps.create_investigation.output.conversation_id != blank }}"
        on-failure:
          continue: true
        with:
          conversation_id: "{{ steps.create_investigation.output.conversation_id }}"
          message: >-
            File detonation verdict for alert {{ foreach.item.alert_id }}:
            {{ foreach.item.verdict | upcase }} (run {{ foreach.item.task_id }}) —
            {{ foreach.item.evidence }}

  # ---------------------------------------------------------------------------
  # 4. Report the sweep.
  # ---------------------------------------------------------------------------
  # No `.size` here: workflow.output renders against a context narrowed to the
  # referenced paths, so `| size` and `pending[0]` are what resolve.
  - name: emit_result
    type: workflow.output
    status: completed
    with:
      skip_reason: >-
        {%- if steps.completed_runs.output.pending[0] -%}none{%- else -%}nothing_pending{%- endif -%}
      attempted: "${{ steps.completed_runs.output.pending | size }}"
      completed_runs: "${{ steps.completed_runs.output.completed_runs }}"
      unlinked_runs: "${{ steps.completed_runs.output.unlinked_runs }}"
      already_applied: "${{ steps.completed_runs.output.already_applied }}"
      missing_alerts: "${{ steps.completed_runs.output.missing_alerts }}"
      deferred: "${{ steps.completed_runs.output.deferred }}"
      investigation_conversation_id: "{{ steps.create_investigation.output.conversation_id }}"
