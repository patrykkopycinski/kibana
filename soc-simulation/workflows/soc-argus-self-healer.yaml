version: '1'
name: SOC ARGUS — Self-Healer (workflow failures)
description: >
  Subscribes to workflows.failed. Logs failures, retries a small allow-listed set of
  operational workflows once via workflow.execute, otherwise writes dead-letter + audit alert rows.
enabled: true

triggers:
  - type: workflows.failed
    on:
      condition: 'not event.workflow.isErrorHandler:true'

consts:
  audit_index: ".soc-audit-trail"
  dlq_index: ".soc-dead-letter"

steps:
  - name: log_failure_audit
    type: elasticsearch.index
    with:
      index: "{{ consts.audit_index }}"
      document:
        "@timestamp": "{{ 'now' | date: '%Y-%m-%dT%H:%M:%S.%LZ' }}"
        event_type: workflow_failure
        source: soc-argus-self-healer
        failed_workflow_id: "{{ event.workflow.id }}"
        failed_workflow_name: "{{ event.workflow.name }}"
        failed_execution_id: "{{ event.execution.id }}"
        error_message: "{{ event.error.message }}"
        failed_step_id: "{{ event.error.stepId | default: 'unknown' }}"

  - name: gate_recoverable
    type: console
    with:
      message: >-
        {% assign n = event.workflow.name %}{% if n == 'SOC Pipeline Run Telemetry Indexer (Event Log -> .soc-pipeline-runs)' or n == 'SOC Workflow Liveness Watchdog' or n == 'SOC ARGUS — Health Aggregator' or n == 'SOC Skill Metrics Roller' %}yes{% else %}no{% endif %}

  - name: retry_recoverable
    type: workflow.execute
    if: "steps.gate_recoverable.output: yes"
    with:
      workflow-id: "{{ event.workflow.id }}"
      inputs: {}

  - name: log_retry_audit
    type: elasticsearch.index
    if: "steps.gate_recoverable.output: yes"
    with:
      index: "{{ consts.audit_index }}"
      document:
        "@timestamp": "{{ 'now' | date: '%Y-%m-%dT%H:%M:%S.%LZ' }}"
        event_type: workflow_self_heal_retry
        source: soc-argus-self-healer
        retried_workflow_id: "{{ event.workflow.id }}"
        retried_workflow_name: "{{ event.workflow.name }}"

  - name: dead_letter_non_recoverable
    type: elasticsearch.index
    if: "steps.gate_recoverable.output: no"
    with:
      index: "{{ consts.dlq_index }}"
      document:
        "@timestamp": "{{ 'now' | date: '%Y-%m-%dT%H:%M:%S.%LZ' }}"
        stage: workflow_self_heal
        source: soc-argus-self-healer
        error: "{{ event.error.message }}"
        failed_workflow_id: "{{ event.workflow.id }}"
        failed_workflow_name: "{{ event.workflow.name }}"
        failed_execution_id: "{{ event.execution.id }}"
        recoverable: false

  - name: alert_non_recoverable
    type: elasticsearch.index
    if: "steps.gate_recoverable.output: no"
    with:
      index: "{{ consts.audit_index }}"
      document:
        "@timestamp": "{{ 'now' | date: '%Y-%m-%dT%H:%M:%S.%LZ' }}"
        event_type: workflow_self_heal_escalation
        source: soc-argus-self-healer
        severity: high
        details: "Non-recoverable workflow failure — see .soc-dead-letter"
        failed_workflow_name: "{{ event.workflow.name }}"
        failed_execution_id: "{{ event.execution.id }}"
