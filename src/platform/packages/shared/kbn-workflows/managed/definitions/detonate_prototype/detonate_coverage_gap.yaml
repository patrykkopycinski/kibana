version: "1"
name: Detonate Coverage Gap Sweep (prototype)
description: >
  One sweep over this space's detonation runs waiting for the Detection
  Worker: runs whose alerts carry the malicious verdict without
  coverage-reviewed, or an explicit coverage-requested marker. For each run
  (oldest first, at most 5) it reads the run record, opens an Investigation
  for the gap, marks the run coverage-reviewed before dispatch so the next
  tick does not pick the same run again, and starts one Detonate Detection
  Rule Creation copy with inputs built from the record. A failed dispatch
  rolls the markers back so the next tick retries the run. Does not write to
  alerts directly; all marker writes go through the handoff route.
enabled: true
tags:
  - security
  - detonate-prototype
settings:
  # One sweep per space at a time. Two sweeps at the same time could dispatch
  # two copies for one run; the copy's own per-task drop key is the second
  # lock, this one keeps the sweep itself from piling up on a slow tick.
  concurrency:
    key: "detonate-coverage-gap-{{ workflow.spaceId }}"
    strategy: drop
    max: 1
triggers:
  # Manual trigger only. The AlertZero Detection Worker's tick dispatches this
  # sweep when the detonate prototype dev setting is on; there is no schedule
  # of its own, and the Run dialog works for a one-off sweep.
  - type: manual
    inputs:
      properties: {}
      additionalProperties: false
outputs:
  - name: listed
    type: number
  - name: list_failed
    type: boolean
consts:
  no_rows: []
steps:
  # The runs waiting for this Worker in this space. The route
  # searches the space's alerts index, drops alerts no run was started from,
  # groups by run and cuts at five tasks, oldest alert first. A failed read
  # does not fail the sweep: an empty result would look like an empty queue,
  # so the failure is reported in the output instead.
  - name: list_handoffs
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: GET
      path: "/s/{{ workflow.spaceId }}/internal/detonate_prototype/handoffs?marker=coverage"
      headers:
        kbn-xsrf: "true"
        elastic-api-version: "1"

  - name: resolve_entries
    type: data.set
    with:
      # The kibana.request step's output IS the response body (no wrapper);
      # the handoffs route returns `{ handoffs: [...] }` flat.
      entries: "${{ steps.list_handoffs.output.handoffs | default: consts.no_rows }}"
  # The steps below run once per run (at most 5, oldest alert first). A branch
  # that fails before dispatch leaves the markers untouched, so the next tick
  # picks the run again; only a failed dispatch rolls the reviewed marker back.
  # Every gate below reads an output, not an error: a skipped step has no error
  # either, so `.error == null` cannot tell ran-and-failed from never-ran.
  - name: sweep_entries
    type: foreach
    foreach: "${{ steps.resolve_entries.output.entries }}"
    mode: settled
    steps:
      # A run that already has an enabled rule is covered. Without this check
      # the hunt's loop back (hunt -> coverage-requested) drafts a duplicate
      # rule after every approved create. Every rule this flow creates carries
      # the run's task tag. A failed lookup reads as not covered, so the run
      # falls through to a draft, which still waits for an analyst.
      - name: find_existing_rule
        type: kibana.request
        timeout: "30s"
        on-failure:
          continue: true
        with:
          method: GET
          path: "/s/{{ workflow.spaceId }}/api/detection_engine/rules/_find?per_page=1&filter={{ foreach.item.task_id | prepend: 'alert.attributes.tags:\"detonate:' | append: '\" AND alert.attributes.enabled:true' | url_encode }}"
          headers:
            elastic-api-version: "2023-10-31"

      - name: resolve_coverage
        type: data.set
        with:
          covered: >-
            ${{ steps.find_existing_rule.error == null
              and steps.find_existing_rule.output.total > 0 }}
          covering_rule_id: "${{ steps.find_existing_rule.output.data[0].id | default: '' }}"

      # Covered: close the request without a draft. No lock is taken because
      # nothing is dispatched.
      - name: mark_covered
        type: kibana.request
        if: "${{ steps.resolve_coverage.output.covered == true }}"
        on-failure:
          continue: true
        with:
          method: POST
          path: "/s/{{ workflow.spaceId }}/internal/detonate_prototype/runs/{{ foreach.item.task_id }}/handoff"
          headers:
            kbn-xsrf: "true"
            elastic-api-version: "1"
            Content-Type: application/json
          body:
            add:
              - detonate:coverage-reviewed
            remove:
              - detonate:coverage-requested

      # The record the inputs are built from. It can 404 when the service
      # dropped the task between the list and this read; the branch then stops
      # before any marker write, and the next sweep re-evaluates the alerts.
      - name: read_record
        type: kibana.request
        on-failure:
          continue: true
        with:
          method: GET
          path: "/s/{{ workflow.spaceId }}/internal/detonate_prototype/runs/{{ foreach.item.task_id }}/record"
          headers:
            kbn-xsrf: "true"
            elastic-api-version: "1"

      # The gap text and evidence come from the record, never from the alert.
      # The technique stays empty: the record carries no ATT&CK mapping, and
      # the copy treats it as optional.
      - name: gap_text
        type: data.set
        if: "${{ steps.read_record.error == null }}"
        with:
          # The kibana.request step's output IS the response body (no wrapper);
          # the record route returns the record fields flat.
          gap_description: >-
            Detonation run {{ foreach.item.task_id }} (sample {{ foreach.item.sha256 | slice: 0, 12 }})
            was {{ steps.read_record.output['detonate.verdict'] }} on
            {{ steps.read_record.output['detonate.vm.os_family'] | default: 'an unknown OS' }}.
            {{ steps.read_record.output['detonate.alerts.total'] }} sandbox alerts fired
            ({{ steps.read_record.output['detonate.endpoint_event_codes'] | join: ', ' }})
            {%- if steps.read_record.output['detonate.detections_to_review'] != empty %},
            and no enabled production rule covered:
            {{ steps.read_record.output['detonate.detections_to_review'] | join: ', ' }}
            {%- endif %}.
            Draft an ES|QL rule that detects this behaviour in production logs.
          evidence: >-
            Sandbox run record: {{ steps.read_record.output['detonate.evidence'] | default: 'no evidence text' }}
            Production endpoint alerts: {{ steps.read_record.output['detonate.alerts.production_endpoint'] | default: 0 }};
            production detection alerts: {{ steps.read_record.output['detonate.alerts.production_detection'] | default: 0 }};
            detection rules that already fired:
            {{ steps.read_record.output['detonate.detection_rule_names'] | join: ', ' }}.
            Field values observed in the sandbox events (ECS field: values):
            event.code: {{ steps.read_record.output['detonate.endpoint_event_codes'] | default: [] | join: ', ' | default: 'none' }};
            dns.question.name: {{ steps.read_record.output['detonate.iocs.domains'] | default: [] | join: ', ' | default: 'none' }};
            destination.ip: {{ steps.read_record.output['detonate.iocs.ips'] | default: [] | join: ', ' | default: 'none' }};
            file.hash.sha256: {{ steps.read_record.output['detonate.iocs.file_hashes'] | default: [] | join: ', ' | default: 'none' }}.
            Build the query on these fields and values. Do not invent indicators
            or field names.

      # One Investigation per gap, like the coverage review: the proposal, the
      # draft attachment and the decision all land on this conversation. When
      # the record read failed this step is skipped, and every gate below
      # reads its missing output and skips too.
      - name: create_investigation
        type: ai.conversation.create
        if: "${{ steps.read_record.error == null and steps.resolve_coverage.output.covered != true }}"
        with:
          template_id: investigation
          title: "Coverage gap: {{ foreach.item.sha256 | slice: 0, 12 }} (run {{ foreach.item.task_id | slice: 0, 8 }})"
          access_control:
            access_mode: public
          metadata:
            status: open
            severity: low
            description: >-
              Coverage gap proposed by the Detonate Detection Worker for run
              {{ foreach.item.task_id }}.
            workflow_execution_ids: ["{{ execution.id }}"]

      # Set reviewed, clear requested and take the coverage lock BEFORE the
      # dispatch, so the next tick cannot pick the same run. On failure the
      # dispatch still runs: the copy's own per-task drop key is the backstop
      # against a second copy.
      - name: set_reviewed
        type: kibana.request
        if: "${{ steps.create_investigation.output.conversation_id != null }}"
        on-failure:
          continue: true
        with:
          method: POST
          path: "/s/{{ workflow.spaceId }}/internal/detonate_prototype/runs/{{ foreach.item.task_id }}/handoff"
          headers:
            kbn-xsrf: "true"
            elastic-api-version: "1"
            Content-Type: application/json
          body:
            add:
              - detonate:coverage-reviewed
              - detonate:coverage-in-progress
            remove:
              - detonate:coverage-requested

      # Fire and forget. The copy parks for up to two 72h decision windows;
      # waiting for it here would hold this sweep's concurrency slot for days.
      - name: dispatch_rule_creation
        type: workflow.executeAsync
        if: "${{ steps.create_investigation.output.conversation_id != null }}"
        on-failure:
          continue: true
        with:
          workflow-id: system-security-detonate-rule-creation
          run-as-mode: inherit
          inputs:
            task_id: "{{ foreach.item.task_id }}"
            investigation_id: "{{ steps.create_investigation.output.conversation_id }}"
            gap_description: "{{ steps.gap_text.output.gap_description }}"
            evidence: "{{ steps.gap_text.output.evidence }}"

      # Rollback: a dispatch that failed to start leaves the run marked
      # reviewed, which would hide it forever. Restore the requested marker so
      # the next tick retries it. Reached only when the dispatch actually ran
      # (a skipped dispatch has no error), and only after the marker was set.
      - name: rollback_reviewed
        type: kibana.request
        if: >-
          ${{ steps.dispatch_rule_creation.error != null
          and steps.set_reviewed.output != null }}
        on-failure:
          continue: true
        with:
          method: POST
          path: "/s/{{ workflow.spaceId }}/internal/detonate_prototype/runs/{{ foreach.item.task_id }}/handoff"
          headers:
            kbn-xsrf: "true"
            elastic-api-version: "1"
            Content-Type: application/json
          body:
            remove:
              - detonate:coverage-reviewed
              - detonate:coverage-in-progress
            add:
              - detonate:coverage-requested

  # What the sweep found and did. `listed` is the handoff-list
  # size; dispatched counts live in the child executions, not here, because
  # dispatch is detached.
  - name: emit_result
    type: workflow.output
    status: completed
    with:
      listed: "${{ steps.resolve_entries.output.entries | default: consts.no_rows | size }}"
      list_failed: "${{ steps.list_handoffs.error != null }}"
