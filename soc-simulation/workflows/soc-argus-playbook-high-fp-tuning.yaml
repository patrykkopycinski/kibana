version: '1'
name: Argus Playbook — High False-Positive Tuning
description: >
  Argus playbook primitive: scan recent `.soc-outcomes` for rules whose
  average false-positive score exceeds a threshold and file a
  `consolidation` mutation intent per offender that tightens the rule
  (narrower query / higher threshold / stricter filters). Governance
  keeps the final say — this workflow only files intents, it does not
  mutate live rules.
enabled: true

triggers:
  - type: manual
  - type: scheduled
    with:
      every: 6h

inputs:
  - name: fp_threshold
    type: number
    required: false
    default: 0.5
    description: "Average false_positive_score (0..1) above which a rule is flagged for tuning."
  - name: lookback
    type: string
    required: false
    default: "now-24h"
  - name: min_observations
    type: number
    required: false
    default: 5
    description: "Minimum outcome count per rule before it is eligible for flagging — avoids flagging rules on single outlier events."
  - name: auto_file
    type: boolean
    required: false
    default: true
    description: "When true, file one consolidation mutation intent per flagged rule. When false, only produce the candidate list for the Playbooks tab."

consts:
  outcomes_index: ".soc-outcomes"
  recommendations_index: ".soc-recommendations"
  audit_index: ".soc-audit-trail"

steps:
  - name: fetch_outcomes
    type: elasticsearch.search
    with:
      index: "{{ consts.outcomes_index }}"
      size: 0
      query:
        bool:
          filter:
            - range: { "@timestamp": { gte: "{{ inputs.lookback }}" } }
      aggs:
        by_rule:
          terms: { field: "rule_id", size: 50 }
          aggs:
            fp_rate:
              avg: { field: "false_positive_score" }
            observation_count:
              value_count: { field: "rule_id" }
            flagged:
              bucket_selector:
                buckets_path:
                  fp: "fp_rate"
                  n: "observation_count"
                script:
                  source: "params.fp >= params.threshold && params.n >= params.min_n"
                  params:
                    threshold: "{{ inputs.fp_threshold }}"
                    min_n: "{{ inputs.min_observations }}"

  - name: log_scan
    type: elasticsearch.index
    with:
      index: "{{ consts.audit_index }}"
      document:
        "@timestamp": "{{ execution.startedAt | date: '%Y-%m-%dT%H:%M:%S.%LZ' }}"
        kind: "playbook_dispatch"
        playbook: "soc-argus-playbook-high-fp-tuning"
        lookback: "{{ inputs.lookback }}"
        fp_threshold: "{{ inputs.fp_threshold }}"
        min_observations: "{{ inputs.min_observations }}"
        flagged_rule_count: "{{ steps.fetch_outcomes.output.aggregations.by_rule.buckets | size }}"

  - name: file_tuning_intents
    type: foreach
    if: "{{ inputs.auto_file == true }}"
    foreach: "{{ steps.fetch_outcomes.output.aggregations.by_rule.buckets }}"
    steps:
      - name: write_tuning_intent
        type: elasticsearch.index
        with:
          index: "{{ consts.recommendations_index }}"
          document:
            "@timestamp": "{{ execution.startedAt | date: '%Y-%m-%dT%H:%M:%S.%LZ' }}"
            type: "mutation_intent"
            schema_version: 2
            rec_id: "arg-fp-{{ foreach.item.key }}"
            source: "argus.high_fp_tuning"
            status: "pending"
            track: "agentic"
            title: "Tighten high-FP rule {{ foreach.item.key }}"
            summary: "Rule {{ foreach.item.key }} averaged false_positive_score={{ foreach.item.fp_rate.value }} across {{ foreach.item.observation_count.value }} outcomes in the last {{ inputs.lookback }}. Tighten query / raise threshold / add filters."
            confidence: 55
            kind: "rule_consolidate"
            argus:
              origin: "consolidation"
              decision:
                kind: "rule_consolidate"
                confidence: 0.55
                door_class: "two_way"
              agent:
                id: "argus.high_fp_tuning"
                version: "1.0.0"
              actor:
                trust_tier: "frontier"
              procedure_clusters:
                - "high_fp:{{ foreach.item.key }}"
              evidence:
                rule_id: "{{ foreach.item.key }}"
                fp_rate: "{{ foreach.item.fp_rate.value }}"
                observation_count: "{{ foreach.item.observation_count.value }}"
                lookback: "{{ inputs.lookback }}"

outputs:
  - name: candidate_rules
    value: "{{ steps.fetch_outcomes.output.aggregations.by_rule.buckets }}"
  - name: filed_count
    value: "{{ steps.file_tuning_intents.output | size }}"
