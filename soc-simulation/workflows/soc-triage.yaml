version: '1'
name: SOC Triage
description: First responder workflow. Classifies alerts, assigns confidence, routes through pipeline.
enabled: true

triggers:
  - type: alert

steps:
  - name: deduplicate
    type: elasticsearch.search
    with:
      index: ".soc-triage-results"
      body:
        query:
          bool:
            filter:
              - range:
                  "@timestamp":
                    gte: "now-1h"
        size: 0

  - name: triage
    type: ai.agent
    agent-id: soc-triage-agent
    with:
      message: >
        Triage the following alert(s):
        {{ event.alerts | json }}
    timeout: 120s

  - name: store_result
    type: elasticsearch.index
    with:
      index: ".soc-triage-results"
      document:
        correlation_id: "{{ steps.triage.output.correlation_id }}"
        hop_count: 1
        alert_ids: "{{ steps.triage.output.alert_ids | json }}"
        classification: "{{ steps.triage.output.classification }}"
        confidence: "{{ steps.triage.output.confidence }}"
        reasoning: "{{ steps.triage.output.reasoning }}"
        entities: "{{ steps.triage.output.entities | json }}"
        mitre_techniques: "{{ steps.triage.output.mitre_techniques | json }}"

  - name: audit
    type: elasticsearch.index
    with:
      index: ".soc-audit-trail"
      document:
        correlation_id: "{{ steps.triage.output.correlation_id }}"
        agent_name: triage
        action: classified
        confidence: "{{ steps.triage.output.confidence }}"
        classification: "{{ steps.triage.output.classification }}"

  - name: route_high
    type: if
    condition: '${{ steps.triage.output.confidence >= 40 }}'
    steps:
      - name: enrich
        type: workflow.executeAsync
        with:
          workflow-id: soc-enrichment
          inputs:
            triage_result: "{{ steps.triage.output | json }}"
    else:
      - name: auto_close
        type: elasticsearch.index
        with:
          index: ".soc-outcomes"
          document:
            correlation_id: "{{ steps.triage.output.correlation_id }}"
            disposition: auto_closed_fp
            confidence_history:
              - agent: triage
                confidence: "{{ steps.triage.output.confidence }}"

on-failure:
  fallback:
    - name: dead_letter
      type: elasticsearch.index
      with:
        index: ".soc-dead-letter"
        body:
          source: triage_workflow
          error: "{{ error.message }}"
          retry_count: 0
