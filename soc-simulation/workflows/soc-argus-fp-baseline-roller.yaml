version: '1'
name: ARGUS FP Baseline Roller (B3)
description: >
  AutoDEX B3 — production-grounded FP baseline roller.

  Vision-doc §1.3.3 calls for grounding gate thresholds in actual
  per-rule alert volumes and FP rates, not the global
  DEFAULT_GATE_THRESHOLDS constants. B6 already shipped the per-rule
  override surface (`resolveGateThresholds(default, run, perRule)`).
  This workflow is the data-collection half: it computes a
  per-rule baseline snapshot from real telemetry every 24h and writes
  to `.soc-rule-fp-baseline`, where a follow-up applier workflow can
  read it and feed values into `CandidateRule.gate_overrides.max_fp_rate`
  per rule.

  Pure-logic spec lives at
  `lib/argus/governance/fp_baseline_estimator.ts` (22 unit tests). This
  workflow is the conservative one-row-per-rule emitter: it reads
  alert counts from the detection-engine alerts index, optional TP/FP
  outcomes from `.soc-outcomes`, and writes a baseline snapshot per
  rule using a Liquid mirror of the verdict matrix.

  Verdict matrix (mirrors `estimateRuleFpBaseline`):
    cold_start          : alert_count < min_alerts_for_baseline (50)
    volume_only         : alerts above floor, no labelled outcomes
    labelled            : alerts above floor, ≥min_labels_for_fp_rate
                          (20) labelled outcomes
    insufficient_labels : alerts above floor, but labelled outcomes < 20

  Triggers:
    * scheduled 24h : daily refresh
    * manual        : operator can re-roll on demand

enabled: true

triggers:
  - type: scheduled
    with:
      every: 24h
  - type: manual

consts:
  baseline_index:           ".soc-rule-fp-baseline"
  alerts_index:             ".alerts-security.alerts-default"
  outcomes_index:           ".soc-outcomes"
  audit_index:              ".soc-audit-trail"
  window_from:              "now-7d"
  window_hours:             168
  min_alerts_for_baseline:  50
  min_labels_for_fp_rate:   20
  default_fp_rate:          0.02
  schema_version:           1

steps:
  # ── 1. Aggregate alerts per rule (last 7d) ───────────────────────────
  - name: aggregate_alerts_per_rule
    type: elasticsearch.search
    with:
      index: "{{ consts.alerts_index }}"
      size: 0
      query:
        bool:
          filter:
            - range:
                "@timestamp":
                  gte: "{{ consts.window_from }}"
      aggregations:
        rules:
          terms:
            field: "kibana.alert.rule.uuid"
            size: 200

  # ── 2. Audit heartbeat (covers cluster with no alerts) ───────────────
  - name: heartbeat
    type: elasticsearch.index
    with:
      index: "{{ consts.audit_index }}"
      document:
        "@timestamp": "{{ execution.startedAt | date: '%Y-%m-%dT%H:%M:%S.%LZ' }}"
        event_type: "argus_fp_baseline_tick"
        source: "soc-argus-fp-baseline-roller"
        tick_id: "fp-baseline-{{ execution.startedAt | date: '%Y%m%d%H%M%S' }}"
        rules_aggregated: "{{ steps.aggregate_alerts_per_rule.output.aggregations.rules.buckets | size | default: 0 }}"
        window_from: "{{ consts.window_from }}"
        window_hours: "{{ consts.window_hours }}"

  # ── 2b. Compute a gate flag the workflow `if` operator can read ──────
  # The workflow engine's `if:` field uses KQL-equality, NOT Liquid filter
  # comparisons (the `>` operator is reserved as a KQL token), so the
  # arithmetic check has to land in a console step's output and the `if:`
  # then matches on string equality.
  - name: gate_has_rules
    type: console
    with:
      message: >-
        {%- assign _n = steps.aggregate_alerts_per_rule.output.aggregations.rules.buckets | size | default: 0 -%}
        {% if _n > 0 %}yes{% else %}no{% endif %}

  # ── 3. Fan-out: one baseline row per rule (volume-only verdict) ──────
  # NOTE: This is the conservative emission. The full verdict matrix
  # (labelled / insufficient_labels) needs a registered server-side step
  # `security.argusEstimateFpBaseline` that calls the shared TS helper
  # end-to-end with `.soc-outcomes` joined per rule. The pure-logic
  # spec already implements that shape — see RFC §6 for the migration
  # path. Until that step is registered, this YAML emits only the
  # volume_only / cold_start subset, which still grounds 1.3.3 for the
  # `expected_alerts_per_hour` field used by B6 overrides.
  - name: fanout_baselines
    type: foreach
    foreach: "{{ steps.aggregate_alerts_per_rule.output.aggregations.rules.buckets }}"
    if: "steps.gate_has_rules.output: yes"
    steps:
      - name: write_baseline_row
        type: elasticsearch.index
        with:
          index: "{{ consts.baseline_index }}"
          id: "{{ foreach.item.key }}"
          document:
            "@timestamp": "{{ execution.startedAt | date: '%Y-%m-%dT%H:%M:%S.%LZ' }}"
            rule_id: "{{ foreach.item.key }}"
            rule_name: "{{ foreach.item.key }}"
            verdict: >-
              {%- if foreach.item.doc_count >= consts.min_alerts_for_baseline -%}volume_only{%- else -%}cold_start{%- endif -%}
            window_hours: "{{ consts.window_hours }}"
            alert_count: "{{ foreach.item.doc_count }}"
            true_positive_count: null
            false_positive_count: null
            expected_alerts_per_hour: >-
              {%- if foreach.item.doc_count >= consts.min_alerts_for_baseline -%}{{ foreach.item.doc_count | divided_by: consts.window_hours }}{%- else -%}null{%- endif -%}
            fp_rate_estimate: null
            confidence: 0.63
            reasons:
              - "volume-only baseline: {{ foreach.item.doc_count }} alert(s) over {{ consts.window_hours }}h"
              - "labelled outcomes integration deferred to registered step (RFC §6)"
            thresholds_applied:
              min_alerts_for_baseline: "{{ consts.min_alerts_for_baseline }}"
              min_labels_for_fp_rate: "{{ consts.min_labels_for_fp_rate }}"
              volume_quantile: 0.95
              smoothing_alpha: 0.1
              default_fp_rate: "{{ consts.default_fp_rate }}"
            schema_version: "{{ consts.schema_version }}"

  - name: log_done
    type: console
    with:
      message: "ARGUS FP baseline roller complete — rules={{ steps.aggregate_alerts_per_rule.output.aggregations.rules.buckets | size | default: 0 }} window=last-{{ consts.window_hours }}h"
