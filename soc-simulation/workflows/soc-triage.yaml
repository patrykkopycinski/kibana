version: '1'
name: SOC Triage
description: First responder workflow. Classifies alerts, assigns confidence, routes through pipeline.
enabled: true

triggers:
  - type: alert

steps:
  - name: deduplicate
    type: elasticsearch.search
    with:
      index: ".soc-triage-results"
      body:
        query:
          bool:
            filter:
              - range:
                  "@timestamp":
                    gte: "now-1h"
        size: 0

  - name: triage
    type: ai.agent
    agent-id: soc-triage-agent
    with:
      message: >
        Triage the following alert(s):
        {{ event.alerts | json }}
    timeout: 120s

  - name: store_result
    type: console
    with:
      message: "Triage result: {{ steps.triage.output | json }}"

  - name: audit
    type: console
    with:
      message: "Triage audit: agent=triage action=classified confidence={{ steps.triage.output.confidence }} classification={{ steps.triage.output.classification }}"

  - name: route_high
    type: if
    condition: '${{ steps.triage.output.confidence >= 40 }}'
    steps:
      - name: enrich
        type: workflow.executeAsync
        with:
          workflow-id: soc-enrichment
          inputs:
            triage_result: "{{ steps.triage.output | json }}"
    else:
      - name: auto_close
        type: console
        with:
          message: "Triage auto-close FP: correlation_id={{ steps.triage.output.correlation_id }} confidence={{ steps.triage.output.confidence }}"

on-failure:
  fallback:
    - name: dead_letter
      type: console
      with:
        message: "Triage workflow failure: source=triage_workflow error={{ error.message }}"
