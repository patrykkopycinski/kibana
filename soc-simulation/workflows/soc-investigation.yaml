version: '1'
name: SOC Investigation
description: Deep threat hunting for ambiguous alerts.
enabled: true

triggers:
  - type: manual

inputs:
  - name: context
    type: string

steps:
  - name: investigate
    type: ai.agent
    agent-id: soc-hunt-agent
    with:
      message: >
        Investigate this ambiguous alert:
        {{ inputs.context }}
    timeout: 180s

  - name: log_result
    type: console
    with:
      message: "SOC Investigation result: {{ steps.investigate.output | json }}"
