version: '1'
name: SOC Pipeline Runs Last-1h Health Snapshot
description: Deterministically measure SOC pipeline workflow executions (runs/success/failure) from .kibana-event-log-* and write a trendable snapshot to .soc-audit-trail. This addresses watchdog's pipeline-run observability gap and avoids LLM reasoning.
enabled: true
triggers:
  - type: scheduled
    with:
      every: 15m
steps:
  - name: count_pipeline_runs_last_1h
    type: elasticsearch.request
    with:
      method: POST
      path: /.kibana-event-log-*/_search
      body:
        size: 0
        track_total_hits: true
        query:
          bool:
            filter:
              - range:
                  "@timestamp":
                    gte: "now-1h"
              - term:
                  event.provider: "alerting"
              - prefix:
                  rule.name: "SOC"
              - term:
                  event.action: "execute"
        aggs:
          by_outcome:
            terms:
              field: "event.outcome"
              size: 10
  - name: write_snapshot
    type: elasticsearch.index
    with:
      index: .soc-audit-trail
      document:
        "@timestamp": "{{ 'now' | date: '%Y-%m-%dT%H:%M:%SZ' }}"
        event_type: soc_pipeline_runs_last_1h_snapshot
        window: "now-1h"
        source_info:
          index: ".kibana-event-log-*"
          filter:
            event_provider: "alerting"
            rule_name_prefix: "SOC"
            event_action: "execute"
        pipeline:
          runs_total: "{{ steps.count_pipeline_runs_last_1h.output.hits.total.value | default: 0 }}"
          by_outcome: "{{ steps.count_pipeline_runs_last_1h.output.aggregations.by_outcome.buckets }}"
