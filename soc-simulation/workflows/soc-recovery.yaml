version: '1'
name: SOC Recovery
description: Dead-letter recovery. Finds stalled pipeline entries and logs them for manual review.
enabled: true

triggers:
  - type: scheduled
    with:
      every: 10m
  - type: manual

steps:
  - name: find_stalled
    type: elasticsearch.search
    with:
      index: ".soc-dead-letter"
      body:
        query:
          bool:
            must:
              - term:
                  status: "failed"
              - range:
                  "@timestamp":
                    gte: "now-1h"
        size: 20
        sort:
          - "@timestamp": desc

  - name: log_stalled_count
    type: console
    with:
      message: "Recovery found {{ steps.find_stalled.output.hits.total.value }} stalled entries"

  - name: write_recovery_log
    type: elasticsearch.index
    with:
      index: .soc-audit-trail
      document:
        "@timestamp": "{{ 'now' | date: '%Y-%m-%dT%H:%M:%SZ' }}"
        event_type: "dead_letter_recovery"
        source: "soc-recovery"
        stalled_count: "{{ steps.find_stalled.output.hits.total.value }}"
        details: "Recovery scan complete. Stalled entries logged for review."

  - name: log_done
    type: console
    with:
      message: "SOC Recovery scan complete"
