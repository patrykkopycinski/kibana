version: '1'
name: SOC Difficulty Controller
description: Performance-gated difficulty scaling. Evaluates SOC metrics and launches attack commands.
enabled: true

triggers:
  - type: scheduled
    with:
      every: 5m

steps:
  - name: get_current_level
    type: elasticsearch.search
    with:
      index: ".soc-difficulty-state"
      body:
        size: 1
        sort:
          - "@timestamp": desc

  - name: evaluate
    type: ai.agent
    agent-id: soc-difficulty-evaluator
    with:
      message: >
        Evaluate whether the SOC should graduate to the next difficulty level.
        Check .soc-outcomes for the last 30 minutes of MTTD, MTTR, automation rate, and confidence accuracy metrics.
    timeout: 60s

  - name: update_state
    type: console
    with:
      message: "Difficulty Controller state update: {{ steps.evaluate.output | json }}"

  - name: launch_attack
    type: console
    with:
      message: "Difficulty Controller attack command: level={{ steps.evaluate.output.level }} decision={{ steps.evaluate.output.decision }}"
