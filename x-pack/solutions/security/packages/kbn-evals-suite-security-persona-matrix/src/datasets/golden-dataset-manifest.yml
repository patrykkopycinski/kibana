# Golden dataset manifest — Chrysalis 95-alert attack-discovery reference
#
# UNSIGNED REFERENCE — INTERNAL ONLY. Do not cite externally until an expert
# signs off (flip reference_status below and record the reviewer + SHA).

dataset_id: chrysalis-95-attack-discovery
reference_status: unsigned
frozen_at_branch: eval/g11-ad-reference
provenance: |
  Dhrumil's canonical Insights episode corpus (ep*alerts.ndjson.gz), committed
  under security_solution/scripts/data/episodes/attacks. Restored into the
  live eval cluster from the deduped GCS snapshot
  gs://security-ai-datasets/attack-discovery/oh-my-malware-95-deduped/2026-07-24
  (alerts-snapshot). The dedup tooling and seed constants live in commit
  1b1006afa7bd (kbn-evals-suite-attack-discovery scripts/dedup_insights_alerts.mjs).

# Reference alert ids are the live `kibana.alert.uuid` values (the `_id` of each
# restored alert document). They were mapped mechanically from the pre-freeze
# labels `${seed_label}-{index:03d}-{host}` (deduped corpus sorted by
# (host asc, @timestamp asc)) via `kibana.alert.original_event.id`, which is
# unique on 95/95 live docs. Chain membership is unchanged.
# Label <-> uuid <-> timestamp map: chrysalis_live_corpus_fixture.ts.
seed_label: dhrumil-insights-gold-v1
total_alerts: 95
episode_count: 8
reference_chain_count: 9

# All 95 live alerts sit in 2026-03-26T22:12:18.438Z..641Z, so windows are
# millisecond ranges: [first alert of the episode, first alert of the next
# episode). The generate API filters @timestamp with gte/lte (end inclusive),
# so `end` below is the next episode's first timestamp minus 1 ms.
# Corpus window = first..last alert, inclusive.
corpus_window: { start: 2026-03-26T22:12:18.438Z, end: 2026-03-26T22:12:18.641Z }
episode_windows:
  1: { start: 2026-03-26T22:12:18.438Z, end: 2026-03-26T22:12:18.452Z, alerts: 9 }
  2: { start: 2026-03-26T22:12:18.453Z, end: 2026-03-26T22:12:18.477Z, alerts: 11 }
  3: { start: 2026-03-26T22:12:18.478Z, end: 2026-03-26T22:12:18.519Z, alerts: 32 }
  4: { start: 2026-03-26T22:12:18.520Z, end: 2026-03-26T22:12:18.574Z, alerts: 16 }
  5: { start: 2026-03-26T22:12:18.575Z, end: 2026-03-26T22:12:18.587Z, alerts: 5 }
  6: { start: 2026-03-26T22:12:18.588Z, end: 2026-03-26T22:12:18.604Z, alerts: 5 }
  7: { start: 2026-03-26T22:12:18.605Z, end: 2026-03-26T22:12:18.611Z, alerts: 6 }
  8: { start: 2026-03-26T22:12:18.612Z, end: 2026-03-26T22:12:18.641Z, alerts: 11 }

# Strata: OS family and technique family. Episode 3 is the only multi-chain
# episode (Emotet delivery vs payload/persistence clusters).
strata:
  os: { windows: [1, 2, 3, 4, 6, 7], linux: [5], macos: [8] }
  initial_access: { office_macro: [1, 3], onenote: [4], word_vbs: [7], user_exec: [2], msi: [6], interactive: [5] }
  malware_family: { emotet: [3], qbot: [4], sodinokibi: [2], bumblebee: [6], bpfdoor: [5], unnamed: [1, 7, 8] }

holdout:
  # Dhru's 95 IS this corpus (the anonymizedAlerts CSV-reconstruction path is
  # explicitly rejected — it loses host/episode structure). The corpus cannot
  # be its own holdout, so no separate Dhru holdout exists yet. Mark a future
  # independent seed as holdout here when one lands.
  dhru: not_separately_seedable

