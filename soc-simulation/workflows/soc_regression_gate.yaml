version: '1'
name: SOC Regression Gate
description: >
  The final gate every autonomous mutation passes through. Runs the proposed
  change against every frozen regression case and writes a pass/fail verdict to
  .soc-regression-runs. The soc_autonomous_applier blocks any mutation whose
  gate_result != 'pass'. Fully deterministic gate: pass-rate over frozen
  cases for the candidate rule (last_verdict == pass when present).

consts:
  regression_dataset_index: ".soc-regression-dataset"
  regression_runs_index: ".soc-regression-runs"

enabled: true

triggers:
  - type: manual

inputs:
  - name: candidate_artifact_ref
    type: string
    required: true
  - name: candidate_definition_hash
    type: string
    required: true
  - name: baseline_artifact_ref
    type: string
    required: false
  - name: baseline_definition_hash
    type: string
    required: false
  - name: trigger
    type: string
    required: true

steps:
  # ── Fetch frozen dataset ──────────────────────────────────────────────
  - name: get_cases
    type: elasticsearch.search
    with:
      index: "{{ consts.regression_dataset_index }}"
      size: 500
      query:
        bool:
          filter:
            - term:
                frozen:
                  value: true

  # ── Replay: deterministic pass-rate over frozen cases for this rule (candidate_artifact_ref = rule_id). ──
  - name: replay_case_fetch
    type: elasticsearch.search
    with:
      index: "{{ consts.regression_dataset_index }}"
      size: 100
      query:
        bool:
          must:
            - term:
                rule_id: "{{ inputs.candidate_artifact_ref }}"
            - term:
                frozen:
                  value: true
      sort:
        - "@timestamp": "desc"

  - name: replay_counts
    type: data.set
    with:
      total_cases: "{{ steps.replay_case_fetch.output.hits.total.value }}"
      passing_cases: "{{ steps.replay_case_fetch.output.hits.hits | where: '_source.last_verdict', 'pass' | size }}"

  - name: replay_candidate
    type: data.set
    with:
      passed: "{{ steps.replay_counts.output.passing_cases }}"
      failed: "{% assign t = steps.replay_counts.output.total_cases | default: 0 %}{% assign p = steps.replay_counts.output.passing_cases | default: 0 %}{{ t | minus: p }}"
      regressions: "{% assign t = steps.replay_counts.output.total_cases | default: 0 %}{% assign p = steps.replay_counts.output.passing_cases | default: 0 %}{{ t | minus: p }}"
      regression_delta: 0.0
      gate_result: "{% assign t = steps.replay_counts.output.total_cases | default: 0 %}{% assign p = steps.replay_counts.output.passing_cases | default: 0 %}{% if t == 0 %}fail{% else %}{% assign pr = p | times: 1.0 | divided_by: t %}{% if pr >= 0.8 %}pass{% else %}fail{% endif %}{% endif %}"
      gate_reason: "{% assign t = steps.replay_counts.output.total_cases | default: 0 %}{% assign p = steps.replay_counts.output.passing_cases | default: 0 %}{% if t == 0 %}Regression gate: no frozen cases for rule {{ inputs.candidate_artifact_ref }}{% else %}{% assign pr = p | times: 1.0 | divided_by: t %}Regression gate: {{ p }}/{{ t }} frozen cases pass last_verdict=pass ({{ pr | times: 100 }}%){% endif %}"
      per_case: "{{ steps.replay_case_fetch.output.hits.hits | json }}"

  # ── Persist gate outcome ──────────────────────────────────────────────
  - name: write_run
    type: elasticsearch.index
    with:
      index: "{{ consts.regression_runs_index }}"
      document:
        "@timestamp": "{{ 'now' | date: '%Y-%m-%dT%H:%M:%SZ' }}"
        run_id: "{{ execution.id }}"
        trigger: "{{ inputs.trigger }}"
        candidate_artifact_ref: "{{ inputs.candidate_artifact_ref }}"
        candidate_definition_hash: "{{ inputs.candidate_definition_hash }}"
        baseline_artifact_ref: "{{ inputs.baseline_artifact_ref | default: '' }}"
        baseline_definition_hash: "{{ inputs.baseline_definition_hash | default: '' }}"
        dataset_size: "{{ steps.get_cases.output.hits.hits | size }}"
        passed: "{{ steps.replay_candidate.output.passed | default: 0 }}"
        failed: "{{ steps.replay_candidate.output.failed | default: 0 }}"
        regressions: "{{ steps.replay_candidate.output.regressions | default: 0 }}"
        regression_delta: "{{ steps.replay_candidate.output.regression_delta | default: 0.0 }}"
        gate_result: "{{ steps.replay_candidate.output.gate_result | default: 'skipped' }}"
        gate_reason: "{{ steps.replay_candidate.output.gate_reason | default: 'replay returned no verdict' }}"
        per_case: "{{ steps.replay_candidate.output.per_case | default: [] }}"

  - name: log_done
    type: console
    with:
      message: "Regression Gate: {{ steps.replay_candidate.output.gate_result | default: 'skipped' }} for {{ inputs.candidate_artifact_ref }}"
