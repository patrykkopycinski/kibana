version: '1'
name: ARGUS Rule Health Monitor
description: Monitors applied ARGUS rules for high alert volume.
enabled: true

triggers:
  - type: scheduled
    with:
      every: 5m
  - type: manual

consts:
  outcomes_index: ".soc-outcomes"
  alerts_index: ".alerts-security.alerts-*"
  decisions_index: ".soc-autonomy-decisions"
  audit_index: ".soc-audit-trail"
  trace_index: ".soc-reasoning-trace"
  max_alerts_per_hour: 50

steps:
  - name: fetch_active_rules
    type: elasticsearch.search
    with:
      index: "{{ consts.outcomes_index }}"
      size: 20
      query:
        bool:
          filter:
            - term:
                status: "done"
            - range:
                applied_at:
                  gte: "now-24h"

  - name: gate_has_rules
    type: console
    with:
      message: >-
        {%- assign n = steps.fetch_active_rules.output.hits.total.value | default: 0 -%}
        {% if n > 0 %}yes{% else %}no{% endif %}

  - name: monitor_each_rule
    type: foreach
    foreach: "{{ steps.fetch_active_rules.output.hits.hits }}"
    if: "steps.gate_has_rules.output: yes"
    steps:
      - name: count_total_alerts
        type: elasticsearch.request
        with:
          method: POST
          path: "/{{ consts.alerts_index }}/_count"
          body:
            query:
              bool:
                filter:
                  - term:
                      "kibana.alert.rule.rule_id": "{{ foreach.item._source.rule_id }}"
                  - range:
                      "@timestamp":
                        gte: "now-1h"

      - name: compute_verdict
        type: console
        with:
          message: >-
            {% if steps.count_total_alerts.output.count > consts.max_alerts_per_hour %}rollback{% else %}healthy{% endif %}

      - name: update_outcome
        type: elasticsearch.update
        if: "steps.compute_verdict.output: rollback"
        with:
          index: "{{ consts.outcomes_index }}"
          id: "{{ foreach.item._id }}"
          doc:
            rolled_back: true
            rollback_reason: "alert volume exceeded threshold"

      - name: write_decision
        type: elasticsearch.index
        if: "steps.compute_verdict.output: rollback"
        with:
          index: "{{ consts.decisions_index }}"
          document:
            "@timestamp": "{{ 'now' | date: '%Y-%m-%dT%H:%M:%S.%LZ' }}"
            decision: "rolled_back"
            gate: "rule_health_monitor"
            rule_id: "{{ foreach.item._source.rule_id }}"
            reason: "Alert rate exceeded threshold"
            actor_id: "argus-autonomy"
            source: "soc_argus_rule_health_monitor"

      - name: write_trace
        type: elasticsearch.index
        with:
          index: "{{ consts.trace_index }}"
          document:
            "@timestamp": "{{ execution.startedAt | date: '%Y-%m-%dT%H:%M:%S.%LZ' }}"
            run_id: "rhm-{{ execution.startedAt | date: '%Y%m%d%H%M%S' }}"
            agent_id: "soc_argus_rule_health_monitor"
            step_index: 0
            step_type: "run_summary"
            content: "rule={{ foreach.item._source.rule_id | default: 'unknown' }} verdict={{ steps.compute_verdict.output }}"
            argus:
              agent:
                id: "soc_argus_rule_health_monitor"
                version: "argus-fp-tuning"
              decision:
                kind: "rule_health_monitor"
                id: "{{ foreach.item._id }}"
                confidence: 1.0
            gen_ai:
              system: "argus"
              operation:
                name: "argus.rule_health_monitor.evaluate"

      - name: write_edge
        type: elasticsearch.index
        if: "steps.compute_verdict.output: rollback"
        with:
          index: .soc-decision-graph
          document:
            "@timestamp": "{{ execution.startedAt | date: '%Y-%m-%dT%H:%M:%S.%LZ' }}"
            from_kind: "rule"
            from_id: "{{ foreach.item._source.rule_id }}"
            to_kind: "governance_action"
            to_id: "rollback"
            relation: "rule_health_rollback"
            source: "soc_argus_rule_health_monitor"

  - name: heartbeat
    type: elasticsearch.index
    with:
      index: "{{ consts.audit_index }}"
      document:
        "@timestamp": "{{ 'now' | date: '%Y-%m-%dT%H:%M:%SZ' }}"
        event_type: argus_rule_health_monitor_heartbeat
        source: "soc_argus_rule_health_monitor"

  - name: log_done
    type: console
    with:
      message: "ARGUS rule health monitor tick"
