version: '1'
name: ARGUS Playbook Runner
description: >
  Generic parameterized playbook runner. Executes a named playbook by running
  its Elasticsearch query, comparing hit volume to a threshold, optionally
  filing mutation_intent documents, and writing an audit trail entry.

  Supported playbooks: coverage-gap-triage, datasource-gap, high-fp-tuning,
  actor-escalation.
enabled: true

triggers:
  - type: manual

inputs:
  - name: playbook_id
    type: string
    required: true
    description: "Which playbook to run (coverage-gap-triage | datasource-gap | high-fp-tuning | actor-escalation)."
  - name: dry_run
    type: boolean
    required: false
    default: false
    description: "If true, skip mutation_intent emission."

consts:
  recommendations_index: ".soc-recommendations"
  audit_index: ".soc-audit-trail"

steps:
  - name: run_coverage_gap_triage
    type: elasticsearch.search
    if: "{{ inputs.playbook_id == 'coverage-gap-triage' }}"
    with:
      index: ".soc-coverage-gaps"
      size: 50
      query:
        bool:
          must:
            - range: { "@timestamp": { gte: "now-7d" } }
            - term: { status: "open" }

  - name: run_datasource_gap
    type: elasticsearch.search
    if: "{{ inputs.playbook_id == 'datasource-gap' }}"
    with:
      index: ".soc-coverage-gaps"
      size: 50
      query:
        bool:
          must:
            - term: { gap_type: "datasource" }
            - range: { "@timestamp": { gte: "now-7d" } }

  - name: run_high_fp_tuning
    type: elasticsearch.search
    if: "{{ inputs.playbook_id == 'high-fp-tuning' }}"
    with:
      index: ".soc-outcomes"
      size: 20
      query:
        bool:
          must:
            - range: { "@timestamp": { gte: "now-24h" } }
            - range: { fp_rate: { gte: 0.3 } }

  - name: run_actor_escalation
    type: elasticsearch.search
    if: "{{ inputs.playbook_id == 'actor-escalation' }}"
    with:
      index: ".soc-actor-trust-tiers"
      size: 10
      query:
        bool:
          must:
            - term: { tier: "untrusted" }
            - range: { violation_count: { gte: 3 } }

  - name: coalesce_metrics
    type: data.set
    with:
      playbook_hit_total: >-
        {% if inputs.playbook_id == 'coverage-gap-triage' %}{{ steps.run_coverage_gap_triage.output.hits.total.value | default: 0 }}{% elsif inputs.playbook_id == 'datasource-gap' %}{{ steps.run_datasource_gap.output.hits.total.value | default: 0 }}{% elsif inputs.playbook_id == 'high-fp-tuning' %}{{ steps.run_high_fp_tuning.output.hits.total.value | default: 0 }}{% elsif inputs.playbook_id == 'actor-escalation' %}{{ steps.run_actor_escalation.output.hits.total.value | default: 0 }}{% else %}0{% endif %}
      playbook_threshold: >-
        {% if inputs.playbook_id == 'coverage-gap-triage' %}3{% elsif inputs.playbook_id == 'datasource-gap' %}1{% elsif inputs.playbook_id == 'high-fp-tuning' %}1{% elsif inputs.playbook_id == 'actor-escalation' %}1{% else %}999999{% endif %}

  - name: gate_should_emit_intent
    type: console
    with:
      message: >-
        {%- assign h = steps.coalesce_metrics.output.playbook_hit_total | default: 0 | plus: 0 -%}
        {%- assign t = steps.coalesce_metrics.output.playbook_threshold | default: 999999 | plus: 0 -%}
        {% if inputs.dry_run == true %}no{% elsif h >= t %}yes{% else %}no{% endif %}

  - name: audit_playbook_run
    type: elasticsearch.index
    with:
      index: "{{ consts.audit_index }}"
      document:
        "@timestamp": "{{ execution.startedAt | date: '%Y-%m-%dT%H:%M:%S.%LZ' }}"
        kind: "playbook_dispatch"
        stage: "playbook"
        pipeline: "soc-argus-playbook-runner"
        action: "playbook_executed"
        status: "completed"
        playbook_id: "{{ inputs.playbook_id }}"
        hits: "{{ steps.coalesce_metrics.output.playbook_hit_total | default: 0 }}"
        threshold: "{{ steps.coalesce_metrics.output.playbook_threshold | default: 0 }}"
        dry_run: "{{ inputs.dry_run }}"
        should_emit_intent: "{{ steps.gate_should_emit_intent.output }}"

  - name: file_coverage_gap_intents
    type: foreach
    if: "{{ inputs.playbook_id == 'coverage-gap-triage' and inputs.dry_run == false and steps.gate_should_emit_intent.output == 'yes' }}"
    foreach: "{{ steps.run_coverage_gap_triage.output.hits.hits }}"
    steps:
      - name: write_gap_intent
        type: elasticsearch.index
        with:
          index: "{{ consts.recommendations_index }}"
          document:
            "@timestamp": "{{ execution.startedAt | date: '%Y-%m-%dT%H:%M:%S.%LZ' }}"
            type: "mutation_intent"
            schema_version: 2
            rec_id: "arg-gap-{{ foreach.item._id }}"
            source: "argus.gap_analysis"
            status: "pending"
            track: "agentic"
            title: "Gap coverage for {{ foreach.item._source.technique_id }}"
            summary: "{{ foreach.item._source.note }}"
            confidence: 55
            kind: "rule_create"
            argus:
              origin: "gap_analysis"
              decision: { kind: "rule_create", confidence: 0.55, door_class: "two_way" }
              agent: { id: "argus.gap_analysis", version: "1.0.0" }
              actor: { trust_tier: "frontier" }

  - name: file_datasource_gap_intents
    type: foreach
    if: "{{ inputs.playbook_id == 'datasource-gap' and inputs.dry_run == false and steps.gate_should_emit_intent.output == 'yes' }}"
    foreach: "{{ steps.run_datasource_gap.output.hits.hits }}"
    steps:
      - name: write_ds_intent
        type: elasticsearch.index
        with:
          index: "{{ consts.recommendations_index }}"
          document:
            "@timestamp": "{{ execution.startedAt | date: '%Y-%m-%dT%H:%M:%S.%LZ' }}"
            type: "mutation_intent"
            schema_version: 2
            rec_id: "arg-ds-gap-{{ foreach.item._id }}"
            source: "argus.datasource_gap"
            status: "pending"
            track: "agentic"
            title: "Backfill {{ foreach.item._source.technique_id }} (datasource gap)"
            summary: "Open datasource gap on {{ foreach.item._source.technique_id | default: 'unknown' }} — author ARGUS coverage."
            confidence: 55
            kind: "rule_create"
            argus:
              origin: "gap_analysis"
              decision:
                kind: "rule_create"
                confidence: 0.55
                door_class: "two_way"
              agent:
                id: "argus.datasource_gap"
                version: "1.0.0"
              actor:
                trust_tier: "frontier"

  - name: file_high_fp_intents
    type: foreach
    if: "{{ inputs.playbook_id == 'high-fp-tuning' and inputs.dry_run == false and steps.gate_should_emit_intent.output == 'yes' }}"
    foreach: "{{ steps.run_high_fp_tuning.output.hits.hits }}"
    steps:
      - name: write_fp_intent
        type: elasticsearch.index
        with:
          index: "{{ consts.recommendations_index }}"
          document:
            "@timestamp": "{{ execution.startedAt | date: '%Y-%m-%dT%H:%M:%S.%LZ' }}"
            type: "mutation_intent"
            schema_version: 2
            rec_id: "arg-fp-{{ foreach.item._source.rule_id | default: foreach.item._id }}"
            source: "argus.high_fp_tuning"
            status: "pending"
            track: "agentic"
            title: "Tighten high-FP rule {{ foreach.item._source.rule_id | default: 'unknown' }}"
            summary: "Outcome row flagged fp_rate≥0.3 — tighten query / threshold / filters."
            confidence: 55
            kind: "rule_consolidate"
            argus:
              origin: "consolidation"
              decision:
                kind: "rule_consolidate"
                confidence: 0.55
                door_class: "two_way"
              agent:
                id: "argus.high_fp_tuning"
                version: "1.0.0"
              actor:
                trust_tier: "frontier"

  - name: file_actor_escalation_intents
    type: foreach
    if: "{{ inputs.playbook_id == 'actor-escalation' and inputs.dry_run == false and steps.gate_should_emit_intent.output == 'yes' }}"
    foreach: "{{ steps.run_actor_escalation.output.hits.hits }}"
    steps:
      - name: write_actor_intent
        type: elasticsearch.index
        with:
          index: "{{ consts.recommendations_index }}"
          document:
            "@timestamp": "{{ execution.startedAt | date: '%Y-%m-%dT%H:%M:%S.%LZ' }}"
            type: "mutation_intent"
            schema_version: 2
            rec_id: "arg-actor-{{ foreach.item._source.actor_id | default: foreach.item._id }}"
            source: "argus.actor_escalation"
            status: "pending"
            track: "agentic"
            title: "Escalate untrusted actor {{ foreach.item._source.actor_id | default: foreach.item._id }}"
            summary: "Trust tier violation_count threshold breached — signal-quality review."
            confidence: 55
            kind: "rule_create"
            argus:
              origin: "actor_escalation"
              decision:
                kind: "rule_create"
                confidence: 0.55
                door_class: "two_way"
              agent:
                id: "argus.actor_escalation"
                version: "1.0.0"
              actor:
                trust_tier: "frontier"

outputs:
  - name: playbook_id
    value: "{{ inputs.playbook_id }}"
  - name: hits
    value: "{{ steps.coalesce_metrics.output.playbook_hit_total | default: 0 }}"
  - name: dry_run
    value: "{{ inputs.dry_run }}"
