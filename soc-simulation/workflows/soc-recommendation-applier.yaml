version: '1'
name: SOC Recommendation Applier
description: >
  Picks up recommendations with approved status or approved sub-items and executes them
  with deterministic Kibana/Elasticsearch operations per recommendation type.
  Includes a validation step that confirms approved items exist before execution.
  Runs every 5 minutes to process approved items from the review queue.

consts:
  recommendations_index: ".soc-recommendations"
  evolution_log_index: ".soc-evolution-log"
  audit_index: ".soc-audit-trail"

enabled: true

triggers:
  - type: scheduled
    with:
      every: 5m
  - type: manual

steps:
  - name: get_approved_recs
    type: elasticsearch.search
    with:
      index: "{{ consts.recommendations_index }}"
      query:
        bool:
          must:
            - terms:
                status:
                  - approved
          must_not:
            - term:
                status: applied
            - term:
                status: failed
      size: 3
      _source:
        - rec_id
        - type
        - source
        - status
        - title
        - summary
        - details
        - sub_items
        - confidence
        - argus

  - name: log_check
    type: console
    with:
      message: "Applier: found {{ steps.get_approved_recs.output.hits.total.value }} approved recommendations"

  - name: gate_has_recs
    type: console
    with:
      message: >-
        {% if steps.get_approved_recs.output.hits.total.value == 0 %}no{% else %}yes{% endif %}

  # Early-exit when there are no approved recommendations.
  - name: log_nothing
    type: console
    if: "steps.gate_has_recs.output: no"
    with:
      message: "Applier: no approved recommendations to process"
    end: true

  - name: dedupe_approved_hits
    type: data.dedupe
    if: "steps.gate_has_recs.output: yes"
    items: "{{ steps.get_approved_recs.output.hits.hits }}"
    with:
      keys:
        - "_id"

  - name: apply_recommendations
    type: foreach
    if: "steps.gate_has_recs.output: yes"
    foreach: "{{ steps.dedupe_approved_hits.output }}"
    steps:
      - name: rec
        type: data.set
        with:
          id: "{{ foreach.item._source.rec_id | default: foreach.item._id }}"
          summary: "{{ foreach.item._source.summary | default: foreach.item._source.title }}"

      - name: gate_hitl_tier
        type: console
        with:
          message: >-
            {% assign t = foreach.item._source.details.approval_tier | default: foreach.item._source.argus.approval_tier | default: 'tier_1' %}{% if t == 'tier_2' %}yes{% elsif t == 'tier_3' %}yes{% else %}no{% endif %}

      - name: await_approval
        type: waitForInput
        if: "steps.gate_hitl_tier.output: yes"
        with:
          message: "Recommendation {{ steps.rec.output.id }} requires approval: {{ steps.rec.output.summary }}"
          timeout: 24h

      - name: apply_detection_rule
        type: kibana.request
        if: "foreach.item._source.details.artifact_type: rule"
        with:
          method: POST
          path: /api/detection_engine/rules
          body: "{{ foreach.item._source.details.new_definition }}"

      - name: apply_rule_tuning
        type: kibana.request
        if: "foreach.item._source.type: rule_tuning"
        with:
          method: POST
          path: /api/detection_engine/rules
          body: "{{ foreach.item._source.details.new_definition }}"

      - name: log_applied
        type: elasticsearch.index
        with:
          index: "{{ consts.evolution_log_index }}"
          document:
            "@timestamp": "{{ 'now' | date: '%Y-%m-%dT%H:%M:%SZ' }}"
            source: soc-recommendation-applier
            intent_rec_id: "{{ foreach.item._id }}"
            artifact_type: "{{ foreach.item._source.details.artifact_type | default: foreach.item._source.type }}"
            artifact_id: "{{ foreach.item._source.details.artifact_id | default: foreach.item._source.rec_id }}"
            op: "{{ foreach.item._source.details.op | default: 'apply' }}"
            result: applied
            reason: Deterministic apply from approved recommendation

      - name: mark_applied
        type: elasticsearch.request
        with:
          method: POST
          path: "/{{ consts.recommendations_index }}/_update/{{ foreach.item._id }}"
          body:
            doc:
              status: applied
              applied_by: soc-recommendation-applier
              applied_at: "{{ 'now' | date: '%Y-%m-%dT%H:%M:%S.%LZ' }}"

  - name: log_application
    type: elasticsearch.index
    if: "steps.gate_has_recs.output: yes"
    with:
      index: "{{ consts.audit_index }}"
      document:
        "@timestamp": "{{ 'now' | date: '%Y-%m-%dT%H:%M:%SZ' }}"
        workflow_id: "soc-recommendation-applier"
        event_type: "recommendation_applied"
        source: "soc-recommendation-applier"
        details: "{{ steps.apply_recommendations.output | json }}"

  - name: log_done
    type: console
    with:
      message: "Applier: recommendation processing complete"
