version: '1'
name: SOC Meta Agent
description: System evolution. Analyzes performance, tunes agent ecosystem, creates specialists for coverage gaps.
enabled: true

triggers:
  - type: scheduled
    with:
      every: 15m

steps:
  - name: evolve
    type: ai.agent
    agent-id: soc-meta-agent
    with:
      message: >
        Analyze system-wide SOC performance and decide on evolution actions.
        Check .soc-outcomes, .soc-coverage-gaps, .soc-agent-health for patterns.
    timeout: 300s

  - name: log_evolution
    type: console
    with:
      message: "Meta Agent evolution: {{ steps.evolve.output | json }}"

  - name: audit
    type: console
    with:
      message: "Meta Agent audit: agent=meta action=evolved"
