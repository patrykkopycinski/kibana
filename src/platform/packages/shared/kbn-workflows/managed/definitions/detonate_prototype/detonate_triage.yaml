version: "1"
name: Detonate triage
description: >
  Detonate prototype: the thin relay. The detonation chain lives in the
  Forensics Watch's Detonate sample worker, installed per space as
  `system-security-forensics-detonate-sample-<spaceId>`; this workflow
  forwards a Run (slide 15's "Detonate suspicious file hash") to that
  per-space copy in the caller's space. The engine forbids a workflow from
  triggering itself, which is why the worker's sweep dispatches here rather
  than recursing. Experimental: installed only while the Detonate prototype
  feature flag is on.
enabled: true
tags:
  - security
  - detonate_prototype
# No concurrency key on the relay. The worker's per-run mode owns the
# `detonate-<sha256>` slot, and the engine holds a workflow's slot across a
# synchronous `workflow.execute`: a relay-level copy of the same key makes
# the hop compete with its own caller for one slot, and every run drops
# ("Dropped due to concurrency limit"). Duplicate suppression stays where
# the chain lives — the second relay on a hash hops, its child is dropped
# by the worker's slot, and the relay finishes.
triggers:
  # API-fired only (workflow.execute / Run dialog). No alert trigger exists in
  # the registry yet — "automated" today means one API call, with the run
  # visible in Executions.
  - type: manual
    inputs:
      properties:
        sha256:
          type: string
          minLength: 64
          maxLength: 64
          description: Hash of the sample to triage, typically the alert's file.hash.sha256.
        alert_id:
          type: string
          minLength: 1
          maxLength: 128
          description: Elasticsearch _id of the alert the verdict is written back to.
        case_id:
          type: string
          maxLength: 256
          description: Optional case to carry confirmed-malicious evidence into, as a comment.
        conversation_id:
          type: string
          maxLength: 256
          description: >-
            Optional Investigation conversation to journal the verdict into (an
            AlertZero Watch Orchestrator passes its sweep's Investigation).
            Absent on standalone runs — no journal note is written then.
      required:
        - sha256
        - alert_id
      additionalProperties: false
steps:
  # The load-bearing hop: the engine resolves `system-security-forensics-*
  # with the per-space suffix at dispatch time (the same `resolveWorkflowDocumentId`
  # shape `workflow.executeAsync` uses for managed parents), and the default
  # run-as mode runs the child as the calling user rather than the relay's own
  # account, so the per-run chain executes under the worker's service account
  # when a sweep dispatched it or the analyst's own identity on a manual Run.
  # Synchronous `workflow.execute` rather than executeAsync: the relay adds no
  # value of its own once the hop lands, and the run record should resolve to
  # the full verdict chain, not a fire-and-forget handoff.
  - name: detonate_in_space
    type: workflow.execute
    with:
      workflow-id: "system-security-forensics-detonate-sample-{{ workflow.spaceId }}"
      inputs:
        sha256: "{{ inputs.sha256 }}"
        alert_id: "{{ inputs.alert_id }}"
        case_id: "{{ inputs.case_id }}"
        conversation_id: "{{ inputs.conversation_id }}"
