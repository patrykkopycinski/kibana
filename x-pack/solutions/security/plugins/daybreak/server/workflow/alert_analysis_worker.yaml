# PD-2 Worker Workflow — real 5-phase alert-analysis worker.
# Setup → Guard → Enrich → Reason → Act (FR-006).
#
# Gated behind the daybreak experimental flag, default off (FR-007, NFR-2).
# This is the production workflow definition; the integration test
# (alert_analysis_worker.test.ts) exercises the Setup phase and enabled-gate
# short-circuit with an inline YAML compatible with the WorkflowRunFixture.
version: '1'
name: Daybreak Alert Analysis Worker
description: >-
  Real 5-phase alert-analysis worker: Setup (config load) → Guard (idempotency)
  → Enrich (evidence packaging) → Reason (ai.agent) → Act (proposal emission).
  Gated behind the daybreak experimental flag, default off (FR-006, FR-007, NFR-2).
enabled: false
triggers:
  - type: manual
steps:
  # Phase 1 — Setup (FR-007): load per-space runtime config via a flat
  # kibana.request step. The workflow-level enabled gate is enforced by the
  # execute route before dispatching; the engine runtime strips nested-step
  # configs, so all actionable steps must be top-level.
  - name: setup
    type: kibana.request
    with:
      debug: true
      method: GET
      path: '/internal/daybreak/config'
      headers:
        x-elastic-internal-origin: 'kibana'

  # Phase 2 — Enrich (FR-009): package real evidence from the alert into a
  # compact ground-truth block, structurally separate from the Reason-phase
  # framing/rubric (NFR-4 prompt-injection control).
  - name: enrich
    type: kibana.request
    with:
      method: GET
      path: '/api/daybreak/alert-summary?rowId={{inputs.rowId}}'
      headers:
        x-elastic-internal-origin: 'kibana'
        kbn-xsrf: 'true'

  # Phase 3 — Reason (FR-010): ai.agent step invoking the daybreak-alert-analysis
  # agent scoped to the alert-analysis skill. MUST NOT use deprecated
  # inference.* / bedrock.* / gen-ai.* step types (FR-011).
  - name: reason
    type: ai.agent
    agent-id: daybreak-alert-analysis-agent
    with:
      message: >-
        Analyze the following alert evidence and produce a structured
        triage verdict: {{ steps.enrich.output | json }}
    timeout: 600s
    on-failure:
      retry:
        max-attempts: 3
        strategy: exponential
        delay: 2s
        multiplier: 2
        max-delay: 30s
        jitter: true
      continue: false

  # Phase 4 — Act (FR-014): emit a Proposal/Result record with an auditable
  # shape. The from-worker-run route validates the Enrich + Reason output and
  # fail-closes on malformed data (FR-015, FR-016).
  - name: act
    type: kibana.request
    with:
      method: POST
      path: '/api/daybreak/proposals/from-worker-run'
      headers:
        x-elastic-internal-origin: 'kibana'
        kbn-xsrf: 'true'
        Content-Type: 'application/json'
      body:
        enrichedJson: '{{ steps.enrich.output | json }}'
        reasonJson: '{{ steps.reason.output | json }}'
        configJson: '{{ steps.setup.output | json }}'
        sourceWatchId: 'daybreak-alert-analysis-watch'
