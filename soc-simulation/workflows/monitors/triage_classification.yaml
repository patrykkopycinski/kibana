version: '1'
name: SOC Triage Classification Field Presence Monitor
description: Deterministically detect when .soc-triage documents are missing the `classification` field (blocking triage-by-disposition KPIs) and write a trendable health signal to .soc-audit-trail.
enabled: true
triggers:
  - type: scheduled
    with:
      every: 15m
steps:
  - name: count_triage_last_6h
    type: elasticsearch.search
    with:
      index: ".soc-triage*"
      size: 0
      track_total_hits: true
      query:
        range:
          "@timestamp":
            gte: "now-6h"

  - name: count_triage_missing_classification_last_6h
    type: elasticsearch.search
    with:
      index: ".soc-triage*"
      size: 0
      track_total_hits: true
      query:
        bool:
          filter:
            - range:
                "@timestamp":
                  gte: "now-6h"
          must_not:
            - exists:
                field: "classification"

  - name: gate_classification
    type: console
    with:
      message: >-
        {%- assign _t = steps.count_triage_last_6h.output.hits.total.value | default: 0 -%}
        {%- assign _m = steps.count_triage_missing_classification_last_6h.output.hits.total.value | default: 0 -%}
        {% if _t > 0 and _m > 0 %}alert{% else %}ok{% endif %}

  - name: write_ok
    if: "steps.gate_classification.output: ok"
    type: elasticsearch.index
    with:
      index: .soc-audit-trail
      document:
        "@timestamp": "{{ 'now' | date: '%Y-%m-%dT%H:%M:%SZ' }}"
        event_type: soc_triage_classification_field_check
        status: OK
        window: "now-6h"
        observed:
          triage_docs_last_6h: "{{ steps.count_triage_last_6h.output.hits.total.value | default: 0 }}"
          triage_missing_classification_last_6h: "{{ steps.count_triage_missing_classification_last_6h.output.hits.total.value | default: 0 }}"

  - name: write_alert
    if: "steps.gate_classification.output: alert"
    type: elasticsearch.index
    with:
      index: .soc-audit-trail
      document:
        "@timestamp": "{{ 'now' | date: '%Y-%m-%dT%H:%M:%SZ' }}"
        event_type: soc_triage_classification_field_check
        status: ALERT
        window: "now-6h"
        observed:
          triage_docs_last_6h: "{{ steps.count_triage_last_6h.output.hits.total.value | default: 0 }}"
          triage_missing_classification_last_6h: "{{ steps.count_triage_missing_classification_last_6h.output.hits.total.value | default: 0 }}"
        notes:
          - "Watchdog reports triage-by-disposition is 'unknown'. Current telemetry shows triage docs exist but `classification` is absent, blocking TP/FP/Suspicious KPIs."
          - "This workflow makes the condition explicit and trendable for remediation (triage writer/schema)."
