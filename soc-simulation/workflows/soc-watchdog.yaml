version: '1'
name: SOC Watchdog
description: Health monitoring. Checks agent throughput, dead letters, pipeline gaps, coverage gaps.
enabled: true

triggers:
  - type: scheduled
    with:
      every: 5m

steps:
  - name: check_health
    type: ai.agent
    agent-id: soc-watchdog-agent
    with:
      message: >
        Run a health check on the SOC mesh. Query all indices for throughput, latency, dead letters, and coverage gaps.
    timeout: 120s

  - name: store_health
    type: console
    with:
      message: "Watchdog health check result: {{ steps.check_health.output | json }}"

  - name: store_gaps
    type: console
    with:
      message: "Watchdog coverage gaps: {{ steps.check_health.output | json }}"

  - name: audit
    type: console
    with:
      message: "Watchdog audit: agent=watchdog action=health_check"
