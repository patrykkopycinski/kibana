version: '1'
name: SOC Watchdog
description: >
  Health monitoring and coverage gap detection. Uses deterministic ES queries for
  KPI checks and writes structured health reports.
enabled: true

triggers:
  - type: scheduled
    with:
      every: 15m
  - type: manual

consts:
  audit_index: ".soc-audit-trail"
  trust_index: ".soc-trust-scores"
  dead_letter_index: ".soc-dead-letter"
  health_index: ".soc-argus-health"
  outcomes_index: ".soc-outcomes"
  triage_results_index: ".soc-triage-results"
  metrics_index: ".soc-metrics"
  heartbeat_interval_minutes: 5
  short_freeze_window_minutes: 30

steps:
  # ── Gather aggregated signals (NOT raw docs — avoids LLM token overrun) ──
  - name: outcomes_agg
    type: elasticsearch.search
    with:
      index: "{{ consts.outcomes_index }}"
      size: 0
      query:
        range:
          "@timestamp":
            gte: "now-6h"
      aggs:
        total: { value_count: { field: "@timestamp" } }
        by_disposition:
          terms: { field: "disposition", size: 20 }
        avg_confidence:
          avg: { field: "confidence" }
        by_technique:
          terms: { field: "techniques_observed", size: 10 }
          aggs:
            avg_conf: { avg: { field: "confidence" } }
            fp_count:
              filter: { term: { disposition: "auto_closed_fp" } }

  - name: triage_agg
    type: elasticsearch.search
    with:
      index: "{{ consts.triage_results_index }}"
      size: 0
      query:
        range:
          "@timestamp":
            gte: "now-6h"
      aggs:
        total: { value_count: { field: "@timestamp" } }
        by_disposition:
          terms: { field: "disposition", size: 20 }

  - name: pipeline_agg
    type: elasticsearch.search
    with:
      index: "{{ consts.metrics_index }}"
      size: 0
      query:
        range:
          "@timestamp":
            gte: "now-1h"
      aggs:
        total: { value_count: { field: "@timestamp" } }
        by_status:
          terms: { field: "status", size: 10 }

  - name: dead_letter_count
    type: elasticsearch.search
    with:
      index: "{{ consts.dead_letter_index }}"
      size: 0
      query:
        bool:
          must:
            - term: { status: "failed" }
            - range: { "@timestamp": { gte: "now-1h" } }

  # ── Health-check: audit-trail pulse + KPI thresholds (deterministic) ─────────────────
  - name: health_check
    type: elasticsearch.search
    with:
      index: "{{ consts.audit_index }}"
      size: 0
      query:
        bool:
          must:
            - range:
                "@timestamp":
                  gte: "now-1h"
      aggs:
        by_pipeline:
          terms:
            field: "pipeline"
            size: 50
        by_status:
          terms:
            field: "status"
            size: 10

  - name: evaluate_health
    type: data.set
    with:
      total_heartbeats: "{{ steps.health_check.output.hits.total.value }}"
      outcomes_total_6h: "{{ steps.outcomes_agg.output.aggregations.total.value }}"
      triage_total_6h: "{{ steps.triage_agg.output.aggregations.total.value }}"
      pipeline_runs_1h: "{{ steps.pipeline_agg.output.aggregations.total.value }}"
      dead_letter_failed_1h: "{{ steps.dead_letter_count.output.hits.total.value }}"
      healthy: "{% assign hb = steps.health_check.output.hits.total.value | default: 0 %}{% assign dl = steps.dead_letter_count.output.hits.total.value | default: 0 %}{% assign pr = steps.pipeline_agg.output.aggregations.total.value | default: 0 %}{% if hb >= 5 and dl <= 10 and pr > 0 %}true{% else %}false{% endif %}"
      pipeline_count: "{{ steps.health_check.output.aggregations.by_pipeline.buckets | size }}"
      status_summary: "{{ steps.health_check.output.aggregations.by_status.buckets | map: 'key' | join: ', ' }}"
      verdict: "{% assign hb = steps.health_check.output.hits.total.value | default: 0 %}{% assign dl = steps.dead_letter_count.output.hits.total.value | default: 0 %}{% assign pr = steps.pipeline_agg.output.aggregations.total.value | default: 0 %}{% if hb >= 5 and dl <= 10 and pr > 0 %}healthy{% else %}degraded{% endif %}"
      failing_dead_letter: "{% assign dl = steps.dead_letter_count.output.hits.total.value | default: 0 %}{% if dl > 10 %}true{% else %}false{% endif %}"
      stalled_pipeline: "{% assign pr = steps.pipeline_agg.output.aggregations.total.value | default: 0 %}{% if pr == 0 %}true{% else %}false{% endif %}"
      audit_aggs: "{{ steps.health_check.output.aggregations | json }}"
      outcomes_by_disposition: "{{ steps.outcomes_agg.output.aggregations.by_disposition.buckets | json }}"
      triage_by_disposition: "{{ steps.triage_agg.output.aggregations.by_disposition.buckets | json }}"
      pipeline_by_status: "{{ steps.pipeline_agg.output.aggregations.by_status.buckets | json }}"

  # ── Fast trust unfreeze (short-horizon transient freezes) ─────────
  # Complements the hourly trust-tier assessor: recover workflows frozen <30m
  # for non-governance reasons without waiting for the next tier tick.
  - name: find_short_freezes
    type: elasticsearch.request
    with:
      method: POST
      path: "/{{ consts.trust_index }}/_search"
      body:
        query:
          bool:
            must:
              - term: { status: frozen }
              - range: { frozen_at: { gte: "now-{{ consts.short_freeze_window_minutes }}m" } }
            must_not:
              - term: { freeze_reason: governance_violation }
        size: 50

  - name: gate_has_short_freezes
    type: console
    with:
      message: >-
        {% assign v = steps.find_short_freezes.output.hits.total.value | default: 0 %}
        {% if v > 0 %}yes{% else %}no{% endif %}

  - name: fast_unfreeze_loop
    type: foreach
    if: "steps.gate_has_short_freezes.output: yes"
    foreach: "{{ steps.find_short_freezes.output.hits.hits }}"
    steps:
      - name: unfreeze_entity
        type: elasticsearch.request
        with:
          method: POST
          path: "/{{ consts.trust_index }}/_update/{{ foreach.item._id }}"
          body:
            doc:
              status: active
              unfrozen_at: "{{ 'now' | date: '%Y-%m-%dT%H:%M:%S.%LZ' }}"
              unfreeze_reason: fast_track_transient

      - name: audit_fast_unfreeze
        type: elasticsearch.request
        with:
          method: POST
          path: "/{{ consts.audit_index }}/_doc"
          body:
            "@timestamp": "{{ 'now' | date: '%Y-%m-%dT%H:%M:%S.%LZ' }}"
            event_type: fast_trust_unfreeze
            entity_id: "{{ foreach.item._source.entity_id }}"
            previous_status: frozen
            new_status: active
            reason: "Short-horizon transient freeze auto-recovered"

  # ── Write results ────────────────────────────────────────────────
  # NOTE (2026-04): the watchdog previously also wrote an aggregate
  # health-report blob to `.soc-coverage-gaps`, but that doc had no
  # `technique_id` / `status` / `severity` / `confidence` fields and so
  # was silently ignored by the downstream consumers
  # (`soc_argus_playbook_runner`, `soc_deteng`, `soc_meta`).
  # The canonical producer of per-technique coverage-gap rows in the
  # triage-playbook shape is now `soc_gap_analyzer`. The watchdog keeps
  # its audit-trail health row below.
  - name: write_audit
    type: elasticsearch.index
    with:
      index: "{{ consts.audit_index }}"
      document:
        "@timestamp": "{{ 'now' | date: '%Y-%m-%dT%H:%M:%SZ' }}"
        event_type: "health_check"
        source: "soc_watchdog"
        details: "{{ steps.evaluate_health.output | json }}"

  - name: log_result
    type: console
    with:
      message: "SOC Watchdog health check complete"
