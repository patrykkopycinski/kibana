version: '1'
name: SOC ARGUS — Native Coverage Overview
description: >
  Calls the Detection Engine coverage overview API, maps results into ARGUS coverage-gap rows
  (source=native_coverage_api), diffs against the previous native snapshot, and emits recommendations
  for newly uncovered techniques into `.soc-coverage-gaps`.
enabled: true

triggers:
  - type: scheduled
    with:
      every: 1h
  - type: manual

consts:
  coverage_index: ".soc-coverage-gaps"
  audit_index: ".soc-audit-trail"

steps:
  - name: fetch_coverage_overview
    type: kibana.request
    with:
      method: POST
      path: /internal/detection_engine/rules/_coverage_overview
      body: {}

  - name: fetch_previous_native_snapshot
    type: elasticsearch.search
    with:
      index: "{{ consts.coverage_index }}"
      size: 1
      sort:
        - "@timestamp":
            order: desc
      query:
        bool:
          filter:
            - term:
                source: native_coverage_api

  - name: materialize_coverage_rows
    type: elasticsearch.index
    with:
      index: "{{ consts.coverage_index }}"
      document:
        "@timestamp": "{{ 'now' | date: '%Y-%m-%dT%H:%M:%S.%LZ' }}"
        source: native_coverage_api
        status: open
        severity: info
        note: "Native Detection Engine coverage overview snapshot"
        source_doc_id: "native-{{ 'now' | date: '%Y%m%d%H%M' }}"
        technique_id: aggregate
        tactic_id: aggregate
        data_sources: []
        coverage_payload: "{{ steps.fetch_coverage_overview.output | json }}"
        previous_snapshot_id: "{{ steps.fetch_previous_native_snapshot.output.hits.hits[0]._id | default: 'none' }}"

  - name: emit_gap_recommendations
    type: elasticsearch.index
    with:
      index: "{{ consts.coverage_index }}"
      document:
        "@timestamp": "{{ 'now' | date: '%Y-%m-%dT%H:%M:%S.%LZ' }}"
        source: native_coverage_api
        status: recommendation
        severity: medium
        technique_id: review_native_diff
        tactic_id: unknown
        note: "Compare native coverage snapshot to previous id={{ steps.fetch_previous_native_snapshot.output.hits.hits[0]._id | default: 'none' }}; close newly uncovered technique gaps."

  - name: audit_coverage_native
    type: elasticsearch.index
    with:
      index: "{{ consts.audit_index }}"
      document:
        "@timestamp": "{{ 'now' | date: '%Y-%m-%dT%H:%M:%SZ' }}"
        event_type: coverage_native_refresh
        source: soc-argus-coverage-native
