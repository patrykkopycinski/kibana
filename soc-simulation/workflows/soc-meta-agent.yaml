version: '1'
name: SOC Meta Agent
description: System evolution. Analyzes performance, creates specialist workflows and agents for coverage gaps.
enabled: true

triggers:
  - type: scheduled
    with:
      every: 15m

steps:
  - name: evolve
    type: ai.agent
    agent-id: soc-meta-agent
    with:
      message: >
        Analyze the SOC mesh and decide if evolution actions are needed.
        Current state: 3 endpoint VMs, 8 SOC agents, 10 workflows, detection rules for T1059.004, T1033, T1496.
        Check if any coverage gaps need new specialist workflows or agents.
    timeout: 60s

  - name: log_evolution
    type: console
    with:
      message: "Meta Agent decision: {{ steps.evolve.output | json }}"
