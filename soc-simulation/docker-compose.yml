services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION:-9.4.0-SNAPSHOT}
    container_name: soc-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-changeme}
      xpack.security.http.ssl.enabled: "false"
      # Enable ML on this node with enough memory for model deployments
      xpack.ml.use_auto_machine_memory_percent: "true"
      xpack.ml.max_machine_memory_percent: "50"
      node.roles: "master,data,ingest,ml,transform,remote_cluster_client"
      ES_JAVA_OPTS: "-Xms2g -Xmx2g"
    ports:
      - "0.0.0.0:${ES_PORT:-19200}:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u elastic:${ELASTIC_PASSWORD:-changeme} http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      retries: 30
    mem_limit: 8g

  setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION:-9.4.0-SNAPSHOT}
    container_name: soc-setup
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: "no"
    command: >
      bash -c '
        echo "Setting kibana_system password...";
        until curl -sf -u "elastic:${ELASTIC_PASSWORD:-changeme}" http://elasticsearch:9200; do sleep 5; done;
        if curl -sf -X POST -u "elastic:${ELASTIC_PASSWORD:-changeme}" \
          -H "Content-Type: application/json" \
          http://elasticsearch:9200/_security/user/kibana_system/_password \
          -d "{\"password\":\"${ELASTIC_PASSWORD:-changeme}\"}"; then
          echo " Done.";
          touch /tmp/setup-done;
        else
          echo " Failed — setup-done NOT created." >&2;
          exit 1;
        fi
      '
    healthcheck:
      test: ["CMD-SHELL", "[ -f /tmp/setup-done ] || exit 1"]
      interval: 5s
      retries: 1

  kibana:
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION:-9.4.0-SNAPSHOT}
    container_name: soc-kibana
    environment:
      NODE_OPTIONS: "--max-old-space-size=3072"
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${ELASTIC_PASSWORD:-changeme}
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: "soc-sim-random-32-char-encrypt-key!!"
      XPACK_FLEET_AGENTS_ELASTICSEARCH_HOSTS: '["${FLEET_ELASTICSEARCH_HOST:-http://elasticsearch:9200}"]'
      XPACK_FLEET_AGENTS_FLEET_SERVER_HOSTS: '["${FLEET_SERVER_EXTERNAL_HOST:-http://fleet-server:8220}"]'
      # Agent Builder settings are in config/kibana.yml via uiSettings.overrides
      # Enable all APIs — in production mode, internal APIs and versioned routes are restricted
      SERVER_VERSIONED_VERSIONRESOLUTION: "newest"
      SERVER_VERSIONED_STRICTCLIENTVERSIONCHECK: "false"
      SERVER_RESTRICTINTERNALAPIS: "false"
    volumes:
      - ./config/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
    ports:
      - "0.0.0.0:${KIBANA_PORT:-15601}:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
      setup:
        condition: service_completed_successfully
    mem_limit: 4g
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5601/api/status || exit 1"]
      interval: 10s
      retries: 60
      start_period: 60s

  fleet-server:
    image: docker.elastic.co/elastic-agent/elastic-agent:${STACK_VERSION:-9.4.0-SNAPSHOT}
    container_name: soc-fleet-server
    environment:
      FLEET_SERVER_ENABLE: "true"
      FLEET_SERVER_HOST: "0.0.0.0"
      FLEET_SERVER_INSECURE_HTTP: "true"
      FLEET_SERVER_ELASTICSEARCH_HOST: http://elasticsearch:9200
      FLEET_SERVER_ELASTICSEARCH_USERNAME: elastic
      FLEET_SERVER_ELASTICSEARCH_PASSWORD: ${ELASTIC_PASSWORD:-changeme}
      FLEET_SERVER_POLICY_ID: fleet-server-policy
      FLEET_URL: http://fleet-server:8220
      KIBANA_FLEET_SETUP: "1"
      # Kibana runs from source on the host (see config/kibana.dev.yml), not as a
      # compose service. Point Fleet Server setup at the host Kibana via
      # host.docker.internal so setup-on-first-boot can call the Fleet API.
      KIBANA_FLEET_HOST: ${KIBANA_FLEET_HOST:-http://host.docker.internal:15601}
      KIBANA_FLEET_USERNAME: elastic
      KIBANA_FLEET_PASSWORD: ${ELASTIC_PASSWORD:-changeme}
    ports:
      - "0.0.0.0:${FLEET_PORT:-18220}:8220"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8220/api/status || exit 1"]
      interval: 15s
      retries: 60
      start_period: 120s

  caldera:
    build:
      context: ./infra/caldera
      dockerfile: Dockerfile
    container_name: soc-caldera
    ports:
      - "0.0.0.0:${CALDERA_PORT:-18888}:8888"
      - "0.0.0.0:${CALDERA_CONTACT_TCP:-17010}:7010"
      - "0.0.0.0:${CALDERA_CONTACT_HTTP:-17012}:7012"
      - "0.0.0.0:${CALDERA_CONTACT_UDP:-17011}:7011/udp"
    volumes:
      - caldera_data:/opt/caldera/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -H 'KEY: ${CALDERA_API_KEY:-ADMIN123}' http://localhost:8888/api/v2/health || exit 1"]
      interval: 10s
      retries: 30
      start_period: 120s
    restart: unless-stopped

  soc-endpoint-1:
    image: docker.elastic.co/elastic-agent/elastic-agent:${STACK_VERSION:-9.4.0-SNAPSHOT}
    container_name: soc-endpoint-1
    hostname: soc-endpoint-1
    user: root
    depends_on:
      fleet-server:
        condition: service_healthy
      caldera:
        condition: service_healthy
    environment:
      # Internal compose network endpoints
      FLEET_URL: http://fleet-server:8220
      FLEET_INSECURE: "true"
      # Host Kibana (runs from source on port 15601)
      KIBANA_HOST: ${KIBANA_FLEET_HOST:-http://host.docker.internal:15601}
      KIBANA_USERNAME: elastic
      KIBANA_PASSWORD: ${ELASTIC_PASSWORD:-changeme}
      # Caldera (internal compose network) — for sandcat fetch
      CALDERA_URL: http://caldera:8888
      CALDERA_API_KEY: ${CALDERA_API_KEY:-ADMIN123}
      # Fleet policy to enrol into (must already exist on Kibana)
      POLICY_ID: ${SOC_ENDPOINT_POLICY_ID:-soc-endpoint-policy}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: ["/opt/soc/enroll_and_run.sh"]
    volumes:
      - ./infra/endpoint/enroll_and_run.sh:/opt/soc/enroll_and_run.sh:ro
    restart: unless-stopped

  # Caldera command dispatch and polling is now done by two native workflows —
  # soc-caldera-dispatcher and soc-caldera-poller — which use elasticsearch.*,
  # http, and foreach steps. No Python bridge is required. The former
  # caldera-bridge service was removed; this file now contains ONLY:
  #   - elasticsearch  (stack)
  #   - kibana         (stack)
  #   - fleet-server   (stack)
  #   - elastic-agent  (stack)
  #   - caldera        (third-party attack emulator, driven by the workflows above)

volumes:
  caldera_data: {}
  es_data: {}
