version: '1'
name: SOC Meta Agent
description: System evolution. Fetches SOC metrics, then AI agent decides on evolution actions.
enabled: true

triggers:
  - type: scheduled
    with:
      every: 15m

steps:
  - name: get_outcomes
    type: elasticsearch.esql.query
    with:
      query: >
        FROM .soc-outcomes
        | WHERE @timestamp > NOW() - 1 HOUR
        | STATS total = COUNT(*), auto_resolved = COUNT_IF(disposition == "auto_resolved"), avg_confidence = AVG(confidence)
      format: json

  - name: get_coverage_gaps
    type: elasticsearch.esql.query
    with:
      query: >
        FROM .soc-coverage-gaps
        | WHERE @timestamp > NOW() - 1 HOUR
        | STATS gap_count = COUNT(*) BY technique_id
      format: json

  - name: get_agent_health
    type: elasticsearch.esql.query
    with:
      query: >
        FROM .soc-agent-health
        | STATS latest_status = LAST(status), latest_throughput = LAST(throughput) BY agent_id
      format: json

  - name: evolve
    type: ai.agent
    agent-id: soc-meta-agent
    with:
      message: >
        Analyze the SOC mesh performance and decide on evolution actions:

        Outcomes (last 1h): {{ steps.get_outcomes.output | json }}
        Coverage gaps: {{ steps.get_coverage_gaps.output | json }}
        Agent health: {{ steps.get_agent_health.output | json }}

        Current setup: 3 endpoint VMs, 8 SOC agents, 10 workflows, detection rules for T1059.004, T1033, T1496.
        If you identify coverage gaps, recommend creating new specialist workflows or agents.
    timeout: 300s

  - name: log_result
    type: console
    with:
      message: "Meta Agent decision: {{ steps.evolve.output | json }}"
