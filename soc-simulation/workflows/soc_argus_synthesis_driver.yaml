version: '1'
name: ARGUS Synthesis Driver
description: >
  AutoDEX autonomous synthesis driver — runs Path A end-to-end on fresh
  CVE advisories.

  This workflow replaces the original TaskManager-based driver
  (`security:argus-synthesis-driver`). The orchestration — schedule,
  kill-switch read, advisory selection, per-advisory iteration, audit
  heartbeat — lives in this YAML; the heavy lift per advisory (Pareto
  frontier, polymorphic-variant generation + validation, mutation-intent
  build) lives in the registered workflow step
  `security.argusSynthesizeAdvisory` (server/workflows/step_types/
  argus_synthesize_advisory_step), which in turn calls the shared
  `synthesizeOne` primitive that the chat-skill tool
  `argus.synthesize_rule_candidate` also routes through. That keeps the
  three Path A entry points — autonomous workflow, chat skill, and the
  CLI in `@kbn/argus-exploit-to-detection` — provably equivalent.

  Each tick:

    1. Reads `.soc-kill-switch`. If `autonomy_enabled=false` the workflow
       writes a heartbeat and exits without synthesising anything (the
       audit trail still shows the tick happened).

    2. Picks up to N fresh advisories from `.soc-cve-advisories` whose
       `status` is `ingested` and that have NO `recommendation_id` /
       `draft_rule_id` yet (those have already been synthesised — the
       `soc_argus_exploit_to_detection.yaml` reconciler will promote
       them to `detected`).

    3. For each candidate, calls `security.argusSynthesizeAdvisory`,
       which runs the Pareto frontier + variant generation + validation,
       writes the resulting mutation intent to `.soc-mutation-intents`,
       and emits per-variant traces to `.soc-reasoning-trace` plus a
       per-advisory audit row to `.soc-evolution-log`.

    4. Writes a tick-level summary row to `.soc-evolution-log` so the
       Autonomy Feed can render "minutes since last synthesis" and
       per-tick counts.

  Triggers:
    * scheduled 5m  : matches the cadence of the legacy TaskManager driver
                      (RFC B1, §3.4)
    * manual        : an operator can force a sweep after seeding new
                      advisories (mirrors the pattern in
                      `soc_argus_exploit_to_detection.yaml`)

enabled: true

triggers:
  - type: scheduled
    with:
      every: 5m
  - type: manual

consts:
  advisories_index: ".soc-cve-advisories"
  kill_switch_index: ".soc-kill-switch"
  evolution_log_index: ".soc-evolution-log"
  # Mirrors SYNTHESIS_MAX_ADVISORIES_PER_TICK from the old TaskManager
  # constants — keep low while the rejection-rate gate is still tuning.
  max_advisories_per_tick: 3
  # AutoDEX governance gap (Severity-3) — daily cost budget gate.
  # Caps the number of `synthesis.advisory` evolution-log rows the driver
  # may produce in any rolling 24h. One row per LLM-driven Path A call
  # so this bounds variant-generation spend without instrumenting the
  # connector. Override per-cluster by patching the YAML.
  daily_synthesis_call_budget: 100
  cost_window: "now-24h"

steps:
  # ── 1. Kill-switch read ─────────────────────────────────────────────
  # Using elasticsearch.request (not elasticsearch.search) because the
  # typed step's sort validation rejects the structured `{"@timestamp": {order: desc}}`
  # shape we need. The other long-running workflows in this repo
  # (soc_argus_health_aggregator, soc_argus_drift_monitor, …) use the
  # same raw-POST form for the same reason.
  - name: read_kill_switch
    type: elasticsearch.request
    with:
      method: POST
      path: "/{{ consts.kill_switch_index }}/_search?ignore_unavailable=true"
      body:
        size: 1
        sort:
          - "@timestamp":
              order: desc
        _source: ["autonomy_enabled"]
        query:
          match_all: {}

  # `kill_switch_gate.output` is a literal string `"yes"` (autonomy is
  # ON, proceed with synthesis) or `"no"` (kill switch tripped, skip).
  # Matches the convention used by other SOC workflows
  # (`soc_argus_exploit_to_detection.yaml`, `soc_gap_analyzer.yaml`,
  # `soc_argus_de_health.yaml`) so downstream `if:` clauses can use the
  # `output: yes` shape the parser already supports.
  - name: kill_switch_gate
    type: console
    with:
      message: >-
        {%- assign _hits = steps.read_kill_switch.output.hits.hits | default: empty -%}
        {%- assign _src = _hits[0]._source | default: empty -%}
        {%- assign _enabled = _src.autonomy_enabled | default: true -%}
        {% if _enabled == false %}no{% else %}yes{% endif %}

  # ── 1b. Cost-budget gate ────────────────────────────────────────────
  # AutoDEX governance gap (Severity-3) — synthesis spend control. Counts
  # rolling-24h `synthesis.advisory` rows produced by THIS driver. If the
  # count is at-or-above `consts.daily_synthesis_call_budget`, the foreach
  # is skipped for the rest of the tick. The kill switch above is the
  # operator-facing emergency brake; this is the steady-state cost
  # ceiling — no human action needed, just a soft cap that keeps a
  # runaway loop from accumulating O(thousand) LLM calls / day.
  - name: count_recent_calls
    type: elasticsearch.request
    if: "steps.kill_switch_gate.output: yes"
    with:
      method: POST
      path: "/{{ consts.evolution_log_index }}/_count"
      body:
        query:
          bool:
            filter:
              - term: { event_type: "synthesis.advisory" }
              - term: { source: "argus.synthesis.driver" }
              - range:
                  "@timestamp":
                    gte: "{{ consts.cost_window }}"

  - name: cost_budget_gate
    type: console
    with:
      message: >-
        {%- assign _ks = steps.kill_switch_gate.output -%}
        {%- if _ks == 'no' -%}no
        {%- else -%}
          {%- assign _used = steps.count_recent_calls.output.count | default: 0 -%}
          {%- assign _budget = consts.daily_synthesis_call_budget -%}
          {%- if _used >= _budget -%}no{%- else -%}yes{%- endif -%}
        {%- endif -%}

  # When the budget gate trips, write a single audit row so the Pulse
  # panel and ops alerting can detect spend ceilings being hit.
  - name: write_budget_decision
    type: elasticsearch.index
    if: "steps.cost_budget_gate.output: no"
    with:
      index: .soc-autonomy-decisions
      document:
        "@timestamp": "{{ execution.startedAt | date: '%Y-%m-%dT%H:%M:%S.%LZ' }}"
        tick_id: "argus-synthesis-tick-{{ execution.startedAt | date: '%Y%m%d%H%M%S' }}"
        workflow_id: "soc_argus_synthesis_driver"
        decision: "{% if steps.kill_switch_gate.output == 'no' %}halted_kill_switch{% else %}halted_cost_budget{% endif %}"
        gate: "{% if steps.kill_switch_gate.output == 'no' %}kill_switch{% else %}cost_budget{% endif %}"
        used_calls_24h: "{{ steps.count_recent_calls.output.count | default: 0 }}"
        budget_calls_24h: "{{ consts.daily_synthesis_call_budget }}"
        reason: "{% if steps.kill_switch_gate.output == 'no' %}Kill switch tripped — synthesis halted.{% else %}Daily synthesis call budget reached. Driver skipping foreach until window rolls.{% endif %}"

  # ── 2. Pick fresh advisories ────────────────────────────────────────
  - name: fetch_pending_advisories
    type: elasticsearch.request
    if: "steps.cost_budget_gate.output: yes"
    with:
      method: POST
      path: "/{{ consts.advisories_index }}/_search"
      body:
        size: "{{ consts.max_advisories_per_tick }}"
        sort:
          - "@timestamp":
              order: desc
        query:
          bool:
            must:
              - term: { status: "ingested" }
            must_not:
              - exists: { field: "recommendation_id" }
              - exists: { field: "draft_rule_id" }

  # ── 3. Synthesise each advisory through Path A ──────────────────────
  - name: synthesize_each_advisory
    type: foreach
    if: "steps.cost_budget_gate.output: yes"
    foreach: "{{ steps.fetch_pending_advisories.output.hits.hits }}"
    steps:
      - name: synthesize_advisory
        type: security.argusSynthesizeAdvisory
        with:
          advisory_id: "{{ foreach.item._source.advisory_id }}"
          caller_id: "soc_argus_synthesis_driver"

  # ── 4. Tick-level audit row ─────────────────────────────────────────
  - name: tick_summary
    type: elasticsearch.index
    with:
      index: "{{ consts.evolution_log_index }}"
      document:
        "@timestamp": "{{ execution.startedAt | date: '%Y-%m-%dT%H:%M:%S.%LZ' }}"
        event_type: "synthesis.tick"
        agent_id: "argus.synthesis.driver"
        source: "soc_argus_synthesis_driver"
        actor: "argus.synthesis.driver"
        trust_tier: "probationary"
        result: "{% if steps.kill_switch_gate.output == 'no' %}halted_kill_switch{% elsif steps.cost_budget_gate.output == 'no' %}halted_cost_budget{% else %}ok{% endif %}"
        message: >-
          ARGUS synthesis tick — autonomy_enabled={{ steps.kill_switch_gate.output | default: 'yes' }}
          advisories_in={{ steps.fetch_pending_advisories.output.hits.hits | size | default: 0 }}
          calls_24h={{ steps.count_recent_calls.output.count | default: 0 }}/{{ consts.daily_synthesis_call_budget }}
        metrics_snapshot:
          autonomy_enabled: "{{ steps.kill_switch_gate.output | default: 'yes' }}"
          cost_budget_armed: true
          calls_used_24h: "{{ steps.count_recent_calls.output.count | default: 0 }}"
          calls_budget_24h: "{{ consts.daily_synthesis_call_budget }}"
          cost_gate_passed: "{{ steps.cost_budget_gate.output | default: 'yes' }}"
          advisories_in: "{{ steps.fetch_pending_advisories.output.hits.hits | size | default: 0 }}"
          tick_id: "argus-synthesis-tick-{{ execution.startedAt | date: '%Y%m%d%H%M%S' }}"

  - name: log_done
    type: console
    with:
      message: >-
        ARGUS synthesis-driver tick argus-synthesis-tick-{{ execution.startedAt | date: '%Y%m%d%H%M%S' }} —
        autonomy_enabled={{ steps.kill_switch_gate.output | default: 'yes' }}
        cost_gate={{ steps.cost_budget_gate.output | default: 'yes' }}
        calls_24h={{ steps.count_recent_calls.output.count | default: 0 }}/{{ consts.daily_synthesis_call_budget }}
        advisories_in={{ steps.fetch_pending_advisories.output.hits.hits | size | default: 0 }}
