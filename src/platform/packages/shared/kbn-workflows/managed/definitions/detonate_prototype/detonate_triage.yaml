version: "1"
name: Detonate triage
description: >
  Detonate prototype: the automated triage tier. A reputation gate runs
  first — a digest the service has already seen detonate is tagged straight
  away and never spends a VM. Only `unknown` hashes are detonated, and the
  run's verdict is written back to the alert (tag plus evidence note; the
  alert's status is never touched by the workflow). A malicious verdict also
  offers a fleet-wide blocklist entry — behind an analyst approval, never on
  the verdict alone. Experimental, off by default.
enabled: true
tags:
  - security
  - detonate_prototype
settings:
  # One run per sample at a time. The triage batch and the detonate sweep can
  # both pick a fresh alert before either writes its verdict tag, and two runs
  # on one hash spend two VMs and raise two close proposals for the same
  # alerts. A run parked at the blocklist gate keeps the slot, so a later
  # alert on the same hash waits for the next sweep, which finds it untagged.
  concurrency:
    key: "detonate-{{ inputs.sha256 }}"
    strategy: drop
    max: 1
triggers:
  # API-fired only (workflow.execute / Run dialog). No alert trigger exists in
  # the registry yet — "automated" today means one API call, with the run
  # visible in Executions.
  - type: manual
    inputs:
      properties:
        sha256:
          type: string
          minLength: 32
          maxLength: 128
          description: Hash of the sample to triage, typically the alert's file.hash.sha256.
        alert_id:
          type: string
          minLength: 1
          maxLength: 128
          description: Elasticsearch _id of the alert the verdict is written back to.
        case_id:
          type: string
          maxLength: 256
          description: Optional case to carry confirmed-malicious evidence into, as a comment.
        conversation_id:
          type: string
          maxLength: 256
          description: >-
            Optional Investigation conversation to journal the verdict into (an
            AlertZero Watch Orchestrator passes its sweep's Investigation).
            Absent on standalone runs — no journal note is written then.
      required:
        - sha256
        - alert_id
      additionalProperties: false
outputs:
  - name: source
    type: string
  - name: verdict
    type: string
  - name: tag
    type: string
steps:
  # The gate only answers `known-malicious` or `unknown`. `unknown` is honest
  # uncertainty — no benign answer exists — and it is what earns a detonation.
  - name: reputation
    type: detonate.prototype.detonateReputation
    with:
      sha256: "{{ inputs.sha256 }}"

  - name: reputation_gate
    type: switch
    expression: "{{ steps.reputation.output.status }}"
    cases:
      # Already-known malware: write the verdict back from reputation alone.
      # No VM is spent re-confirming what the service has already seen, and
      # the note says so explicitly so nobody hunts for a run that does not
      # exist.
      - match: known-malicious
        steps:
          - name: tag_known
            type: security.setAlertTags
            with:
              alert_ids: "{{ inputs.alert_id }}"
              tags_to_add:
                - "detonate:known-malicious"

          - name: note_known
            type: security.createNote
            with:
              document_id: "{{ inputs.alert_id }}"
              text: >-
                Detonate triage: reputation gate reports this hash as
                known-malicious{% if steps.reputation.output.malware_family != blank %} (family
                {{ steps.reputation.output.malware_family }}){% endif %}. No new detonation was
                run — the verdict comes from prior runs of the same sample.

          # F9 journal leg for the reputation-gated path: same contract as the
          # detonated branch's journal step, no VM spent.
          - name: journal_known
            type: ai.conversation.add_user_message
            if: "${{ inputs.conversation_id != blank }}"
            on-failure:
              continue: true
            with:
              conversation_id: "{{ inputs.conversation_id }}"
              message: >-
                File detonation verdict for alert {{ inputs.alert_id }}:
                KNOWN-MALICIOUS (reputation gate{% if steps.reputation.output.malware_family != blank %},
                family {{ steps.reputation.output.malware_family }}{% endif %}) — no new
                detonation was run; the verdict comes from prior runs of the same sample
                (hash {{ inputs.sha256 | slice: 0, 12 }}…).

    # `unknown` falls through to the default: detonate, derive the verdict,
    # write it back. This is the only path that spends a VM.
    default:
      - name: detonate
        type: detonate.prototype.detonateSample
        with:
          sample_hash: "{{ inputs.sha256 }}"
          # The sandbox OS is recorded on the task and surfaces in the verdict
          # output — the blocklist artifact below is compiled per OS and
          # accepts exactly one, so it must travel with the run.
          vm_os_family: linux
          tags:
            - "alert:{{ inputs.alert_id }}"
            - "triage"
          max_wait_secs: 900

      - name: verdict
        type: detonate.prototype.detonateVerdict
        with:
          task_id: "{{ steps.detonate.output.task_id }}"
          alert_id: "{{ inputs.alert_id }}"

      - name: apply
        type: detonate.prototype.applyDetonationVerdict
        with:
          verdict: "{{ steps.verdict.output.verdict }}"
          alert_id: "{{ inputs.alert_id }}"
          task_id: "{{ steps.verdict.output.task_id }}"
          evidence: "{{ steps.verdict.output.evidence }}"

      # F9 journal leg: when an AlertZero Watch passed its Investigation's
      # conversation, the verdict is posted there too, so the sweep's whole
      # evidence trail is readable in one place. Runs after `apply` — the
      # alert write-back is the primary contract; the journal is additive and
      # must never fail a run whose verdict already landed.
      - name: journal_verdict
        type: ai.conversation.add_user_message
        if: "${{ inputs.conversation_id != blank }}"
        on-failure:
          continue: true
        with:
          conversation_id: "{{ inputs.conversation_id }}"
          message: >-
            File detonation verdict for alert {{ inputs.alert_id }}:
            {{ steps.verdict.output.verdict | upcase }} —
            {{ steps.verdict.output.evidence }}
            (task {{ steps.verdict.output.task_id }}, hash {{ inputs.sha256 | slice: 0, 12 }}…)

      # F3: the run's extracted IOCs (domains, IPs, hashes) are only as
      # valuable as the question they answer next — which OTHER hosts in
      # the fleet contacted the same infrastructure? Two hunts, one per
      # indicator family the sim extracts: DNS answers for the domains,
      # destination IPs for the IPs.
      #
      # The IN-lists splice textually (the alertzero batched-generation
      # pattern). That is safe only because the detonate step validates
      # every IOC before it reaches this workflow: domains must match a
      # hostname pattern and IPs must parse, so no value carries a quote
      # or backslash, and each family is capped at 100 entries. The `if`
      # guards keep an empty family from ever compiling an invalid
      # `IN ("")` — an absent `extracted_iocs` (service predates
      # extraction) also never fires the step.
      #
      # `on-failure: continue` on both: a stack without endpoint network
      # data (the common lab case) fails the FROM clause at
      # verification — "Unknown column [dns.question.name]" — and a
      # missing hunt must not fail a triage run whose verdict is already
      # on the alert.
      #
      # The hunts run inside the detonate branch only, after `apply`,
      # because that is where `steps.detonate.output.extracted_iocs`
      # exists; the known-malicious branch has no detonation to extract
      # from (its note already says so).
      - name: hunt_domains
        type: elasticsearch.esql.query
        if: "${{ steps.detonate.output.extracted_iocs != blank and steps.detonate.output.extracted_iocs.domains.size > 0 }}"
        on-failure:
          continue: true
        with:
          query: |-
            FROM logs-endpoint.events.network-*
              | WHERE @timestamp >= NOW() - 30d
              | WHERE dns.question.name IN ("{{ steps.detonate.output.extracted_iocs.domains | join: '", "' }}")
              | STATS last_seen = MAX(@timestamp) BY host.name
              | KEEP host.name, last_seen
              | SORT host.name ASC
              | LIMIT 100

      - name: hunt_ips
        type: elasticsearch.esql.query
        if: "${{ steps.detonate.output.extracted_iocs != blank and steps.detonate.output.extracted_iocs.ips.size > 0 }}"
        on-failure:
          continue: true
        with:
          query: |-
            FROM logs-endpoint.events.network-*
              | WHERE @timestamp >= NOW() - 30d
              | WHERE destination.ip IN ("{{ steps.detonate.output.extracted_iocs.ips | join: '", "' }}")
              | STATS last_seen = MAX(@timestamp) BY host.name
              | KEEP host.name, last_seen
              | SORT host.name ASC
              | LIMIT 100

      # Both hunts land on the alert as a note: the analyst sees the
      # fleet exposure without leaving the alert. `map: 'first'`
      # extracts the hostname from each row (rows are
      # [host.name, last_seen]); `uniq` because a host found by BOTH
      # hunts (DNS and TCP to the same infrastructure) must not appear
      # twice. Skipped or failed hunts render as empty lists — `concat`
      # over an empty array is still an array.
      - name: hunt_note
        type: security.createNote
        if: "${{ (steps.hunt_domains.output != blank and steps.hunt_domains.output.values.size > 0) or (steps.hunt_ips.output != blank and steps.hunt_ips.output.values.size > 0) }}"
        on-failure:
          continue: true
        with:
          document_id: "{{ inputs.alert_id }}"
          text: >-
            {%- if steps.hunt_domains.output != blank -%}
            {%- assign domain_hosts = steps.hunt_domains.output.values | map: 'first' -%}
            {%- else -%}
            {%- assign domain_hosts = '' | split: ',' -%}
            {%- endif -%}
            {%- if steps.hunt_ips.output != blank -%}
            {%- assign ip_hosts = steps.hunt_ips.output.values | map: 'first' -%}
            {%- else -%}
            {%- assign ip_hosts = '' | split: ',' -%}
            {%- endif -%}
            {%- assign hosts = domain_hosts | concat: ip_hosts | uniq | sort -%}
            Detonate hunt: {{ hosts | join: ', ' }} also contacted the
            infrastructure this sample used ({% if domain_hosts.size > 0 %}DNS{% endif %}{% if domain_hosts.size > 0 and ip_hosts.size > 0 %} and {% endif %}{% if ip_hosts.size > 0 %}destination IP{% endif %} matches over the last 30 days).

      # F7 proposals. Only a Watch-driven run raises them: the Watch passes its
      # Investigation, which is where a proposal lives, and runs as the Watch's
      # service account, which `run-as-mode: inherit` hands to the proposal
      # bridge. A standalone run has neither, so every step below is skipped.
      # They sit before the blocklist gate so a pending approval there (up to an
      # hour) never delays them, and are started async so this run never parks
      # on an analyst's decision. Each one is `on-failure: continue`: the verdict
      # is already on the alert, and a failed proposal must not fail the run.
      #
      # Quiet: the sample's run history decides. Enough consecutive quiet runs
      # earn an exception proposal on the rule that raised the alert.
      - name: run_history
        type: detonate.prototype.detonateRunHistory
        if: "${{ inputs.conversation_id != blank and steps.verdict.output.verdict == 'quiet' }}"
        on-failure:
          continue: true
        with:
          sha256: "{{ inputs.sha256 }}"

      # The exception is added to the rule that raised the alert, so its
      # saved-object id is read off the alert itself.
      - name: source_alert
        type: elasticsearch.search
        if: "${{ steps.run_history.output.proposal_eligible == true }}"
        on-failure:
          continue: true
        with:
          index: ".alerts-security.alerts-{{ workflow.spaceId }}"
          ignore_unavailable: true
          size: 1
          _source:
            - kibana.alert.rule.uuid
            - kibana.alert.rule.name
          query:
            ids:
              values:
                - "{{ inputs.alert_id }}"

      # Malicious: every alert still open on the same sample is a confirmed
      # true positive, not just the one this run was started for. A sibling
      # that already carries a detonate verdict was covered by its own run's
      # proposal, so only this run's alert and untagged siblings are taken.
      - name: open_hash_alerts
        type: elasticsearch.search
        if: "${{ inputs.conversation_id != blank and steps.verdict.output.verdict == 'malicious' }}"
        on-failure:
          continue: true
        with:
          index: ".alerts-security.alerts-{{ workflow.spaceId }}"
          ignore_unavailable: true
          size: 100
          _source: false
          query:
            bool:
              filter:
                - term:
                    file.hash.sha256: "{{ inputs.sha256 }}"
                - term:
                    kibana.alert.workflow_status: open
              should:
                - ids:
                    values:
                      - "{{ inputs.alert_id }}"
                - bool:
                    must_not:
                      - terms:
                          kibana.alert.workflow_tags:
                            - "detonate:malicious"
                            - "detonate:quiet"
                            - "detonate:inconclusive"
                            - "detonate:known-malicious"
              minimum_should_match: 1

      # `if` conditions take no filters, so the proposal guards and the
      # values they need are resolved here first.
      - name: resolve_proposals
        type: data.set
        with:
          exception_rule_uuid: "{{ steps.source_alert.output.hits.hits[0]._source['kibana.alert.rule.uuid'] }}"
          exception_rule_name: "{{ steps.source_alert.output.hits.hits[0]._source['kibana.alert.rule.name'] }}"
          close_alert_ids: "${{ steps.open_hash_alerts.output.hits.hits | map: '_id' }}"
          close_alert_count: "${{ steps.open_hash_alerts.output.hits.hits | size }}"

      - name: propose_exception
        type: workflow.executeAsync
        if: "${{ steps.run_history.output.proposal_eligible == true and variables.exception_rule_uuid != blank }}"
        on-failure:
          continue: true
        with:
          workflow-id: system-create-alertzero-proposal
          run-as-mode: inherit
          inputs:
            conversationId: "{{ inputs.conversation_id }}"
            title: "Add a rule exception for a quiet sample ({{ inputs.sha256 | slice: 0, 12 }}…)"
            comment: |-
              **Exclude this file hash from "{{ variables.exception_rule_name }}"?**

              {{ steps.run_history.output.evidence_comment }}

              Approving adds a `file.hash.sha256 is {{ inputs.sha256 }}` exception to the rule, so it stops alerting on this sample.
            actionWorkflowId: system-alertzero-action-add-rule-exception
            actionInput:
              rule_id: "{{ variables.exception_rule_uuid }}"
              name: "Detonate: quiet sample {{ inputs.sha256 | slice: 0, 12 }}…"
              description: >-
                Added after {{ steps.run_history.output.quiet_streak }} consecutive
                quiet sandbox detonations of this sample (latest task
                {{ steps.verdict.output.task_id }}).
              entries:
                - field: file.hash.sha256
                  operator: is
                  value: "{{ inputs.sha256 }}"
            category: configure
            # Removes this one hash from one rule: no other detection changes.
            impact: low
            # Absence of behaviour in a sandbox is weaker evidence than its
            # presence, whatever the streak.
            confidence: medium
            autoApprove: false

      # The verdict is per sample, so the siblings in the close proposal get
      # the tag too. Otherwise the next sweep finds them untagged, detonates
      # the same hash again and proposes closing them a second time.
      - name: tag_hash_siblings
        type: security.setAlertTags
        if: "${{ variables.close_alert_count > 0 }}"
        on-failure:
          continue: true
        with:
          alert_ids: "${{ variables.close_alert_ids }}"
          tags_to_add:
            - "detonate:malicious"

      - name: propose_close
        type: workflow.executeAsync
        if: "${{ variables.close_alert_count > 0 }}"
        on-failure:
          continue: true
        with:
          workflow-id: system-create-alertzero-proposal
          run-as-mode: inherit
          inputs:
            conversationId: "{{ inputs.conversation_id }}"
            title: "Close {{ variables.close_alert_count }} alert{% if variables.close_alert_count != 1 %}s{% endif %} as true positive: detonation confirmed malicious"
            comment: |-
              **Close {{ variables.close_alert_count }} open alert{% if variables.close_alert_count != 1 %}s{% endif %} on this sample as true positive?**

              A sandbox detonation confirmed the sample malicious: {{ steps.verdict.output.evidence }}

              Sample: {{ inputs.sha256 }}
              Detonation task: {{ steps.verdict.output.task_id }}

              Closing records the verdict; containment (blocklist, isolation) is a separate decision.
            actionWorkflowId: system-alertzero-action-close-alerts-tp
            actionInput:
              alertIds: "${{ variables.close_alert_ids }}"
              reason: true_positive
            category: respond
            impact: medium
            confidence: high
            autoApprove: false

      # F6: a blocklist write is a fleet-wide enforcement action, so it never
      # rides on a sandbox verdict alone — an analyst confirms it first. The
      # gate sits after `apply` (the verdict is already on the alert either
      # way) and before any blocklist write. A timeout reads as no answer and
      # skips the blocklist: the run stays honest rather than failing loudly
      # over a decision nobody made. The failure travels as an error on the
      # step, adopted below before the output is evicted.
      - name: blocklist_gate
        type: waitForApproval
        if: "${{ steps.verdict.output.verdict == 'malicious' }}"
        timeout: 3600s
        on-failure:
          continue: true
        with:
          message: >-
            Detonate triage: blocklist this hash on every endpoint?
            {{ steps.verdict.output.evidence }}
          approveLabel: Blocklist hash
          rejectLabel: Skip

      # `waitForApproval` output resolves to its latest execution and is not
      # exempt from eviction, so the answer is adopted into a variable before
      # anything reads it. Blank on timeout, which is what the guard below
      # keys on: an unanswered gate is not a yes.
      - name: resolve_blocklist_gate
        type: data.set
        if: "${{ steps.verdict.output.verdict == 'malicious' }}"
        with:
          blocklist_approved: '${{ steps.blocklist_gate.output.response.approved == true }}'
          blocklist_timed_out: '${{ steps.blocklist_gate.error != blank }}'
          blocklist_responded_by: "{{ steps.blocklist_gate.output.respondedBy }}"

      # The write itself. `item_id` is derived from the hash so the step is
      # idempotent: re-running triage on the same sample skips instead of
      # stacking duplicate entries. `on-failure: continue` because a stack
      # without the blocklist list (it is created by the Artifacts UI, not
      # provisioned) must not fail the whole triage run — the verdict is
      # already recorded on the alert.
      - name: blocklist
        type: security.createExceptionListItem
        if: "${{ variables.blocklist_approved == true }}"
        on-failure:
          continue: true
        with:
          list_id: endpoint_blocklists
          namespace_type: agnostic
          item_id: "detonate-{{ inputs.sha256 }}"
          overwrite: true
          name: "Detonate: {{ steps.verdict.output.evidence | truncate: 200 }}"
          description: >-
            Added by the Detonate triage workflow after an approved malicious
            detonation (task {{ steps.verdict.output.task_id }}).
          entries:
            # Endpoint blocklist entries must be `match_any` + `included` with
            # an array value (BlocklistValidator) — the step's `is_one_of`
            # verb maps to exactly that; plain `is` maps to `match` and the
            # blocklist validator rejects it.
            - field: file.hash.sha256
              operator: is_one_of
              values:
                - "{{ inputs.sha256 }}"
          # An endpoint blocklist artifact is compiled per OS and the validator
          # accepts exactly one os_types entry (minSize 1, maxSize 1) — the OS
          # the sample actually ran on, from the verdict output. A deduplicated
          # submit returns an earlier run that may not have recorded its OS;
          # fall back to the OS the detonate step requested.
          os_types:
            - "{{ steps.verdict.output.vm_os_family | default: 'linux' }}"
          # Attribution: the resumed execution writes under the workflow
          # runner's identity, not the approver's, so the approver is recorded
          # on the item itself — the audit trail the Artifacts UI shows.
          comments:
            - "Blocklisted by {{ variables.blocklist_responded_by }} after detonation task {{ steps.verdict.output.task_id }}."

      # A confirmed-malicious detonation is worth a case comment; a quiet or
      # inconclusive run stays on the alert, where the analyst already is.
      # Failing to comment on the case must not fail the run — the alert
      # already carries the verdict.
      - name: case_comment_on_malicious
        type: if
        condition: "${{ steps.verdict.output.verdict == 'malicious' and inputs.case_id != blank }}"
        steps:
          - name: comment
            type: detonate.prototype.caseComment
            on-failure:
              continue: true
            with:
              case_id: "{{ inputs.case_id }}"
              comment: "Detonation confirmed malicious — {{ steps.verdict.output.evidence }}"
