version: '1'
name: SOC Detection Engineering
description: Feedback loop. Fetches triage outcomes, then AI agent recommends rule tuning.
enabled: true

triggers:
  - type: scheduled
    with:
      every: 30m

steps:
  - name: get_outcomes
    type: elasticsearch.esql.query
    with:
      query: >
        FROM .soc-outcomes
        | WHERE @timestamp > NOW() - 30 MINUTES
        | STATS total = COUNT(*), fp_count = COUNT_IF(disposition == "auto_closed_fp"), avg_confidence = AVG(confidence) BY techniques_observed
      format: json

  - name: get_triage_results
    type: elasticsearch.esql.query
    with:
      query: >
        FROM .soc-triage-results
        | WHERE @timestamp > NOW() - 30 MINUTES
        | STATS total = COUNT(*) BY classification
      format: json

  - name: tune_rules
    type: ai.agent
    agent-id: soc-deteng-agent
    with:
      message: >
        Analyze these triage outcomes and recommend detection rule tuning:

        Outcomes by technique (last 30min): {{ steps.get_outcomes.output | json }}
        Triage classifications (last 30min): {{ steps.get_triage_results.output | json }}

        If FP rate > 50%, recommend adding exceptions or raising thresholds.
        If a technique has no detection rule, recommend creating one.
    timeout: 300s

  - name: log_result
    type: console
    with:
      message: "DetEng result: {{ steps.tune_rules.output | json }}"
