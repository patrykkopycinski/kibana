version: '1'
name: SOC Case Creation
description: Creates Kibana cases with full evidence chains and AI-generated summaries.
enabled: true

triggers:
  - type: manual

inputs:
  - name: correlation_id
    type: string
  - name: confidence
    type: number
  - name: alert_ids
    type: string
  - name: entities
    type: string

steps:
  - name: create_case
    type: ai.agent
    agent-id: soc-case-agent
    with:
      message: >
        Create a case for this security incident.
        Correlation ID: {{ inputs.correlation_id }}
        Confidence: {{ inputs.confidence }}
        Alert IDs: {{ inputs.alert_ids }}
        Entities: {{ inputs.entities }}
    timeout: 180s

  - name: log_result
    type: console
    with:
      message: "Case creation completed for correlation_id={{ inputs.correlation_id }}"
