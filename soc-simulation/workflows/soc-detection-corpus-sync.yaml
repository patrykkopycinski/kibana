version: '1'
name: SOC Detection Corpus Sync
description: >
  Bootstraps `.soc-detection-corpus` from live Kibana detection rules that are
  currently enabled. Each enabled rule is upserted as one corpus document
  (`_id` == rule UUID) so ARGUS coverage surfaces stay aligned with the
  detection engine without a separate ingest CLI.

  Runs hourly and on demand. Emits a heartbeat to `.soc-audit-trail`.

enabled: true

triggers:
  - type: scheduled
    with:
      every: 1h
  - type: manual

consts:
  corpus_index: ".soc-detection-corpus"
  audit_index: ".soc-audit-trail"

steps:
  - name: fetch_enabled_rules
    type: kibana.request
    with:
      method: GET
      path: /api/detection_engine/rules/_find?per_page=100&filter=alert.attributes.enabled:true
      headers:
        kbn-xsrf: "true"
        elastic-api-version: "2023-10-31"

  - name: rules_sync_gate
    type: console
    with:
      message: >-
        {%- assign rules = steps.fetch_enabled_rules.output.data -%}
        {%- if rules -%}
          {%- assign n = rules | size -%}
        {%- else -%}
          {%- assign n = 0 -%}
        {%- endif -%}
        {% if n > 0 %}yes{% else %}no{% endif %}

  - name: sync_each_rule
    type: foreach
    if: "steps.rules_sync_gate.output: yes"
    foreach: "{{ steps.fetch_enabled_rules.output.data | default: empty }}"
    steps:
      - name: index_corpus_entry
        type: elasticsearch.index
        with:
          index: "{{ consts.corpus_index }}"
          id: "{{ foreach.item.id }}"
          document:
            "@timestamp": "{{ execution.startedAt | date: '%Y-%m-%dT%H:%M:%S.%LZ' }}"
            rule_id: "{{ foreach.item.rule_id | default: foreach.item.id }}"
            name: "{{ foreach.item.name }}"
            description: "{{ foreach.item.description | default: '' }}"
            type: "{{ foreach.item.type }}"
            severity: "{{ foreach.item.severity }}"
            tags: "{{ foreach.item.tags | default: empty | json }}"
            threat: "{{ foreach.item.threat | default: empty | json }}"
            index: "{{ foreach.item.index | default: empty | json }}"
            created_by: "{{ foreach.item.created_by.username | default: foreach.item.created_by | default: 'unknown' }}"
            updated_at: "{{ foreach.item.updated_at | default: foreach.item.updatedAt }}"
            source: "live_sync"

  - name: heartbeat
    type: elasticsearch.index
    with:
      index: "{{ consts.audit_index }}"
      document:
        "@timestamp": "{{ execution.startedAt | date: '%Y-%m-%dT%H:%M:%S.%LZ' }}"
        event_type: soc_detection_corpus_sync_tick
        source: "soc-detection-corpus-sync"
        tick_id: "detection-corpus-sync-{{ execution.startedAt | date: '%Y%m%d%H%M%S' }}"
        rules_synced: >-
          {%- assign rules = steps.fetch_enabled_rules.output.data -%}
          {%- if rules -%}{{ rules | size }}{%- else -%}0{%- endif -%}
        gate: "{{ steps.rules_sync_gate.output }}"

  - name: log_done
    type: console
    with:
      message: >-
        SOC detection corpus sync complete — gate={{ steps.rules_sync_gate.output }} rules={%- assign rules = steps.fetch_enabled_rules.output.data -%}{%- if rules -%}{{ rules | size }}{%- else -%}0{%- endif -%}
