version: '1'
name: SOC Enrichment
description: Entity enrichment pipeline for triage results.
enabled: true

triggers:
  - type: manual

inputs:
  - name: triage_result
    type: string

steps:
  - name: enrich
    type: ai.agent
    agent-id: soc-entity-agent
    with:
      message: >
        Enrich this triage result with entity context:
        {{ inputs.triage_result }}
    timeout: 120s

  - name: log_result
    type: console
    with:
      message: "SOC Enrichment result: {{ steps.enrich.output | json }}"
