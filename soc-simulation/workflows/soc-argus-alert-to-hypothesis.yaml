version: '1'
name: ARGUS Alert-to-Hypothesis Bridge
description: >
  ARGUS bridge workflow: watches open security alerts in a short poll window that
  are not tagged `soc-hypothesis-scanned`, checks `.soc-cve-advisories` for existing
  coverage, and creates advisory documents to trigger the synthesis pipeline when
  none exists. Emits reasoning-trace and decision-graph edges for new advisories,
  with a periodic audit heartbeat.

enabled: true

triggers:
  - type: alert
  - type: scheduled
    with:
      every: 3m
  - type: manual

consts:
  advisories_index: ".soc-cve-advisories"
  corpus_index: ".soc-detection-corpus"
  alerts_index: ".alerts-security.alerts-*"
  poll_window: "now-10m"
  workflow_id: soc-argus-alert-to-hypothesis

steps:
  # ── 1. Recent open alerts (hypothesis pipeline not yet scanned) ─────
  - name: fetch_recent_alerts
    type: elasticsearch.search
    with:
      index: "{{ consts.alerts_index }}"
      size: 20
      query:
        bool:
          filter:
            - range:
                "@timestamp":
                  gte: "{{ consts.poll_window }}"
            - term:
                kibana.alert.workflow_status: open
          must_not:
            - term:
                kibana.alert.workflow_tags: soc-hypothesis-scanned
      _source:
        - kibana.alert.rule.rule_id
        - kibana.alert.rule.name
        - kibana.alert.rule.threat
        - kibana.alert.severity
        - host.name
        - kibana.alert.rule.description

  - name: gate_has_alerts
    type: console
    with:
      message: >-
        {% assign count = steps.fetch_recent_alerts.output.hits.hits | size | default: 0 %}{% if count > 0 %}yes{% else %}no{% endif %}

  - name: check_attack_discovery
    type: ai.agent
    if: "steps.gate_has_alerts.output: yes"
    agent-id: default
    connector-id: sonnet
    with:
      message: >
        Use security.attack_discovery_search to find any correlated attack chains involving these alerts:
        {{ steps.fetch_recent_alerts.output.hits.hits | json }}.
        Return any discovered attack chains with their alert groupings.
      schema:
        type: object
        properties:
          attack_chains:
            type: array
            items:
              type: object
              properties:
                chain_id:
                  type: string
                alerts:
                  type: array
                  items:
                    type: string
                technique:
                  type: string
                confidence:
                  type: number
          has_chains:
            type: boolean
        required:
          - attack_chains
          - has_chains
    timeout: 300s
    on_failure:
      - name: log_check_attack_discovery_failure
        type: elasticsearch.request
        with:
          method: POST
          path: /.soc-audit-trail/_doc
          body:
            event_type: workflow_step_failure
            workflow_id: "{{ consts.workflow_id }}"
            step_id: check_attack_discovery
            step_name: check_attack_discovery
            error: "{{ error.message }}"
            "@timestamp": "{{ 'now' | date: '%Y-%m-%dT%H:%M:%S.%LZ' }}"

  # ── 2. Per-alert advisory gap fill ───────────────────────────────────
  - name: check_each_alert
    type: foreach
    if: "steps.gate_has_alerts.output: yes"
    foreach: "{{ steps.fetch_recent_alerts.output.hits.hits }}"
    steps:
      - name: check_existing_advisory
        type: elasticsearch.search
        with:
          index: "{{ consts.advisories_index }}"
          size: 1
          query:
            bool:
              filter:
                - term:
                    advisory_id: "argus-alert-hyp-{{ foreach.item._source.kibana.alert.rule.rule_id }}"

      - name: has_advisory_gate
        type: console
        with:
          message: >-
            {%- assign _n = steps.check_existing_advisory.output.hits.hits | size | default: 0 -%}
            {% if _n > 0 %}yes{% else %}no{% endif %}

      - name: create_advisory
        type: elasticsearch.index
        if: "steps.has_advisory_gate.output: no"
        with:
          index: "{{ consts.advisories_index }}"
          id: "argus-alert-hyp-{{ foreach.item._source.kibana.alert.rule.rule_id }}"
          document:
            "@timestamp": "{{ execution.startedAt | date: '%Y-%m-%dT%H:%M:%S.%LZ' }}"
            advisory_id: "argus-alert-hyp-{{ foreach.item._source.kibana.alert.rule.rule_id }}"
            cve_id: "ALERT-{{ foreach.item._source.kibana.alert.rule.rule_id | upcase }}"
            title: "Alert-driven hypothesis — {{ foreach.item._source.kibana.alert.rule.name }}"
            summary: "ARGUS detected uncovered alert pattern from rule {{ foreach.item._source.kibana.alert.rule.rule_id }} on host {{ foreach.item._source.host.name | default: 'unknown' }}. Attack discovery (batch): has_chains={{ steps.check_attack_discovery.output.structured_output.has_chains | default: false }} chains={{ steps.check_attack_discovery.output.structured_output.attack_chains | json }}. Automatically creating hypothesis for synthesis pipeline."
            severity: "{{ foreach.item._source.kibana.alert.severity | default: 'medium' }}"
            status: "ingested"
            source: "argus.alert-to-hypothesis"
            mitre_techniques: "{{ foreach.item._source.kibana.alert.rule.threat | default: '[]' }}"
            alert_source_rule_id: "{{ foreach.item._source.kibana.alert.rule.rule_id }}"

      - name: emit_hypothesis_trace
        type: elasticsearch.index
        if: "steps.has_advisory_gate.output: no"
        with:
          index: .soc-reasoning-trace
          document:
            "@timestamp": "{{ execution.startedAt | date: '%Y-%m-%dT%H:%M:%S.%LZ' }}"
            run_id: "argus-hyp-{{ execution.startedAt | date: '%Y%m%d%H%M%S' }}-{{ foreach.item._source.kibana.alert.rule.rule_id }}"
            agent_id: "soc-argus-alert-to-hypothesis"
            step_index: 0
            step_type: "run_summary"
            content: "Alert-to-hypothesis: created advisory for rule {{ foreach.item._source.kibana.alert.rule.rule_id }}; attack_discovery={{ steps.check_attack_discovery.output.structured_output | json }}"
            argus:
              agent:
                id: "soc-argus-alert-to-hypothesis"
                version: "argus-e2e-v1"
              decision:
                kind: "alert_to_hypothesis"
                id: "argus-alert-hyp-{{ foreach.item._source.kibana.alert.rule.rule_id }}"
                confidence: 0.85
            gen_ai:
              system: "argus"
              operation:
                name: "argus.alert_to_hypothesis.create_advisory"
              agent:
                id: "soc-argus-alert-to-hypothesis"
                name: "ARGUS Alert-to-Hypothesis Bridge"
                description: "Watches alerts and creates advisory entries for uncovered techniques"

      - name: emit_graph_edge
        type: elasticsearch.index
        if: "steps.has_advisory_gate.output: no"
        with:
          index: .soc-decision-graph
          document:
            "@timestamp": "{{ execution.startedAt | date: '%Y-%m-%dT%H:%M:%S.%LZ' }}"
            from_type: "alert"
            from_id: "{{ foreach.item._id }}"
            to_type: "advisory"
            to_id: "argus-alert-hyp-{{ foreach.item._source.kibana.alert.rule.rule_id }}"
            edge_label: "hypothesis_created"
            source: "soc-argus-alert-to-hypothesis"

  # ── 3. Heartbeat + summary ───────────────────────────────────────────
  - name: heartbeat
    type: elasticsearch.index
    with:
      index: .soc-audit-trail
      document:
        "@timestamp": "{{ execution.startedAt | date: '%Y-%m-%dT%H:%M:%S.%LZ' }}"
        event_type: argus_alert_to_hypothesis_tick
        source: "soc-argus-alert-to-hypothesis"
        tick_id: "argus-ath-tick-{{ execution.startedAt | date: '%Y%m%d%H%M%S' }}"
        alerts_polled: "{{ steps.fetch_recent_alerts.output.hits.hits | size | default: 0 }}"
        gate_has_alerts: "{{ steps.gate_has_alerts.output | default: 'unknown' }}"

  - name: log_done
    type: console
    with:
      message: "ARGUS alert-to-hypothesis tick argus-ath-tick-{{ execution.startedAt | date: '%Y%m%d%H%M%S' }} — polled={{ steps.fetch_recent_alerts.output.hits.hits | size | default: 0 }} gate={{ steps.gate_has_alerts.output | default: 'unknown' }}"
