version: '1'
name: SOC ARGUS — Containment (response actions)
description: >
  Governance-gated endpoint response actions: kill-switch, trust tier, budget and cooldown gates,
  then Defend response APIs (isolate / kill_process / scan), audit trail, and optional case comment.
enabled: true

triggers:
  - type: manual

inputs:
  - name: action
    type: string
    required: true
    description: "isolate_host | kill_process | scan_host"
  - name: endpoint_ids
    type: string
    required: true
    description: Comma-separated Elastic Agent endpoint IDs.
  - name: case_id
    type: string
    required: false
    default: ""
  - name: actor_id
    type: string
    required: true
    description: Actor id for trust lookup in .soc-actor-trust-tiers.
  - name: trust_tier_required
    type: string
    required: false
    default: "trusted"
  - name: budget_window_hours
    type: string
    required: false
    default: "24"
  - name: budget_max_actions
    type: integer
    required: false
    default: 20
  - name: cooldown_minutes
    type: integer
    required: false
    default: 30
  - name: comment
    type: string
    required: false
    default: "ARGUS containment workflow"
  - name: kill_pid
    type: integer
    required: false
    default: 0
  - name: kill_entity_id
    type: string
    required: false
    default: ""
  - name: scan_path
    type: string
    required: false
    default: "C:\\\\Windows\\\\Temp"

consts:
  kill_switch_index: ".soc-kill-switch"
  trust_index: ".soc-actor-trust-tiers"
  audit_index: ".soc-audit-trail"
  response_actions_index: ".soc_response-actions"
  budget_limit_24h: 20
  cooldown_minutes: 30

steps:
  - name: read_kill_switch
    type: elasticsearch.request
    with:
      method: POST
      path: "/{{ consts.kill_switch_index }}/_search"
      body:
        size: 1
        query:
          term:
            scope: global
        sort:
          - "@timestamp":
              order: desc

  - name: gate_kill_switch_blocks
    type: console
    with:
      message: "{% if steps.read_kill_switch.output.hits.hits[0]._source.autonomy_enabled == false %}yes{% else %}no{% endif %}"

  - name: abort_kill_switch_audit
    type: elasticsearch.index
    if: "steps.gate_kill_switch_blocks.output: yes"
    with:
      index: "{{ consts.audit_index }}"
      document:
        "@timestamp": "{{ 'now' | date: '%Y-%m-%dT%H:%M:%SZ' }}"
        event_type: containment_aborted
        source: soc_argus_containment
        reason: kill_switch_active

  - name: abort_kill_switch_end
    type: console
    if: "steps.gate_kill_switch_blocks.output: yes"
    with:
      message: "Containment blocked — kill-switch active"
    end: true

  - name: check_maintenance_windows
    type: kibana.request
    with:
      method: GET
      path: /internal/alerting/rules/maintenance_window/_active

  - name: gate_maintenance_blocks
    type: console
    with:
      message: >-
        {% assign n = steps.check_maintenance_windows.output | size | default: 0 %}{% if n > 0 %}yes{% else %}no{% endif %}

  - name: audit_maintenance_skip
    type: elasticsearch.index
    if: "steps.gate_maintenance_blocks.output: yes"
    with:
      index: "{{ consts.audit_index }}"
      document:
        "@timestamp": "{{ 'now' | date: '%Y-%m-%dT%H:%M:%SZ' }}"
        event_type: containment_skipped_maintenance
        source: soc_argus_containment
        reason: "Active maintenance window detected"
        maintenance_windows: "{{ steps.check_maintenance_windows.output | json }}"

  - name: skip_for_maintenance
    type: workflow.output
    if: "steps.gate_maintenance_blocks.output: yes"
    status: cancelled
    with:
      status: skipped
      reason: maintenance_window_active

  - name: read_trust_tier
    type: elasticsearch.search
    with:
      index: "{{ consts.trust_index }}"
      size: 1
      query:
        bool:
          filter:
            - term:
                actor_id: "{{ inputs.actor_id }}"
      sort:
        - "@timestamp":
            order: desc

  - name: gate_trust_ok
    type: console
    with:
      message: >-
        {% assign tier = steps.read_trust_tier.output.hits.hits[0]._source.tier | default: 'quarantined' %}{% if tier == inputs.trust_tier_required %}yes{% elsif inputs.trust_tier_required == 'trusted' and tier == 'frontier' %}yes{% else %}no{% endif %}

  - name: count_recent_containment
    type: elasticsearch.search
    with:
      index: "{{ consts.response_actions_index }}"
      size: 0
      track_total_hits: true
      query:
        bool:
          filter:
            - term:
                source: soc_argus_containment
            - range:
                "@timestamp":
                  gte: "now-{{ inputs.budget_window_hours }}h"

  - name: gate_budget_ok
    type: console
    with:
      message: "{% assign c = steps.count_recent_containment.output.hits.total.value | default: 0 | plus: 0 %}{% assign lim = consts.budget_limit_24h | plus: 0 %}{% if c < lim %}yes{% else %}no{% endif %}"

  - name: count_cooldown
    type: elasticsearch.search
    with:
      index: "{{ consts.response_actions_index }}"
      size: 0
      track_total_hits: true
      query:
        bool:
          filter:
            - term:
                source: soc_argus_containment
            - range:
                "@timestamp":
                  gte: "now-{{ consts.cooldown_minutes }}m"

  - name: gate_cooldown_ok
    type: console
    with:
      message: "{% assign c = steps.count_cooldown.output.hits.total.value | default: 0 %}{% if c == 0 %}yes{% else %}no{% endif %}"

  - name: gate_all_pass
    type: console
    with:
      message: >-
        {% if steps.gate_trust_ok.output == 'yes' and steps.gate_budget_ok.output == 'yes' and steps.gate_cooldown_ok.output == 'yes' %}yes{% else %}no{% endif %}

  - name: isolate_host
    type: kibana.request
    if: "{{ inputs.action == 'isolate_host' and steps.gate_all_pass.output == 'yes' }}"
    with:
      method: POST
      path: /api/endpoint/action/isolate
      body:
        endpoint_ids: "${{ inputs.endpoint_ids | split: ',' | strip }}"
        comment: "{{ inputs.comment }}"

  - name: kill_process_by_entity
    type: kibana.request
    if: "{{ inputs.action == 'kill_process' and inputs.kill_entity_id != '' and steps.gate_all_pass.output == 'yes' }}"
    with:
      method: POST
      path: /api/endpoint/action/kill_process
      body:
        endpoint_ids: "${{ inputs.endpoint_ids | split: ',' | strip }}"
        comment: "{{ inputs.comment }}"
        parameters:
          entity_id: "{{ inputs.kill_entity_id }}"

  - name: kill_process_by_pid
    type: kibana.request
    if: "{{ inputs.action == 'kill_process' and inputs.kill_entity_id == '' and inputs.kill_pid > 0 and steps.gate_all_pass.output == 'yes' }}"
    with:
      method: POST
      path: /api/endpoint/action/kill_process
      body:
        endpoint_ids: "${{ inputs.endpoint_ids | split: ',' | strip }}"
        comment: "{{ inputs.comment }}"
        parameters:
          pid: "{{ inputs.kill_pid }}"

  - name: scan_host
    type: kibana.request
    if: "{{ inputs.action == 'scan_host' and steps.gate_all_pass.output == 'yes' }}"
    with:
      method: POST
      path: /api/endpoint/action/scan
      body:
        endpoint_ids: "${{ inputs.endpoint_ids | split: ',' | strip }}"
        comment: "{{ inputs.comment }}"
        parameters:
          path: "{{ inputs.scan_path }}"

  - name: write_response_action
    type: elasticsearch.index
    if: "steps.gate_all_pass.output: yes"
    with:
      index: "{{ consts.response_actions_index }}"
      document:
        "@timestamp": "{{ 'now' | date: '%Y-%m-%dT%H:%M:%SZ' }}"
        source: soc_argus_containment
        action_type: "{{ inputs.action }}"
        target: "{{ inputs.endpoint_ids }}"
        status: submitted
        case_id: "{{ inputs.case_id }}"

  - name: audit_containment
    type: elasticsearch.index
    if: "steps.gate_all_pass.output: yes"
    with:
      index: "{{ consts.audit_index }}"
      document:
        "@timestamp": "{{ 'now' | date: '%Y-%m-%dT%H:%M:%SZ' }}"
        event_type: containment_action
        source: soc_argus_containment
        action: "{{ inputs.action }}"
        case_id: "{{ inputs.case_id }}"
        actor_id: "{{ inputs.actor_id }}"

  - name: case_comment
    type: cases.addComment
    if: "{{ inputs.case_id != '' and steps.gate_all_pass.output == 'yes' }}"
    with:
      case_id: "{{ inputs.case_id }}"
      comment: "ARGUS containment executed: {{ inputs.action }} on endpoints {{ inputs.endpoint_ids }}"

  - name: audit_gates_failed
    type: elasticsearch.index
    if: "steps.gate_all_pass.output: no"
    with:
      index: "{{ consts.audit_index }}"
      document:
        "@timestamp": "{{ 'now' | date: '%Y-%m-%dT%H:%M:%SZ' }}"
        event_type: containment_blocked
        source: soc_argus_containment
        trust_ok: "{{ steps.gate_trust_ok.output }}"
        budget_ok: "{{ steps.gate_budget_ok.output }}"
        cooldown_ok: "{{ steps.gate_cooldown_ok.output }}"
