version: '1'
name: ARGUS Reasoning Eval Reconciler (R11)
description: >
  ARGUS R11 — reconciliation poller for the reasoning eval vertical.

  The actual evaluation (evidence / calibration / coherence / safety) runs
  in the Playwright suite inside `@kbn/evals-suite-argus-reasoning`, OR in
  the standalone CLI `scripts/run_reasoning_eval.ts` that uses the built-in
  heuristic judge. Both writers target `.soc-argus-eval-runs` (run_kind
  reasoning|adversarial) via the
  bulk API; this workflow does NOT call a Kibana HTTP endpoint and it does
  NOT score anything itself — that belongs to the TS package where the
  judge is unit-tested and the schema lives in code.

  Responsibilities owned here (parity with soc_detection_eval.yaml):

    * Poll `.soc-argus-eval-runs` for NEW reasoning/adversarial rows since the last tick.
    * Emit a fast-path quarantine signal into `.soc-audit-trail` when a
      row arrives with gate_decision=fail — this gives the demo operator
      a near-real-time visual without waiting for the hourly trust-tier
      assessor.
    * Emit a governance span into `.soc-reasoning-trace` per reconciled
      row, with decision.kind=reasoning_eval, so the ARGUS governance
      dashboard can surface eval verdicts alongside triage/deteng
      decisions when slicing by agent+decision_kind.
    * Emit a heartbeat for the activity feed so the cadence is visible.
    * Mark rows as `reconciled: true` so the next poll skips them.

  The hourly `soc_argus_trust_tier_assessor` remains the authoritative
  tier-transition point; this poller is the fast-signal observability
  layer for R11.

  Triggers:
    * scheduled 2m : near-real-time reconciliation parity with detection-eval
    * manual       : operators can force a sweep

enabled: true

triggers:
  - type: scheduled
    with:
      every: 2m
  - type: manual

consts:
  runs_index: ".soc-argus-eval-runs"
  audit_index: ".soc-audit-trail"
  traces_index: ".soc-reasoning-trace"
  # 15m lookback — long enough to survive a missed tick, short enough to
  # stay bounded. Rows already reconciled are filtered out by the
  # `reconciled: true` flag so duplicate processing is a no-op.
  poll_window: "now-15m"

steps:
  # ── Poll for unreconciled reasoning eval runs ───────────────────────
  # elasticsearch.request (not .search) so we can use object-form sort
  # on @timestamp — the engine's .search schema rejects it.
  - name: fetch_new_eval_runs
    type: elasticsearch.request
    with:
      method: POST
      path: "/{{ consts.runs_index }}/_search"
      body:
        size: 50
        sort:
          - "@timestamp":
              order: asc
        query:
          bool:
            filter:
              - terms:
                  run_kind: ["reasoning", "adversarial"]
              - range:
                  "@timestamp":
                    gte: "{{ consts.poll_window }}"
            must_not:
              - term:
                  reconciled: true

  # ── Per-run reconciliation ──────────────────────────────────────────
  - name: reconcile
    type: foreach
    foreach: "{{ steps.fetch_new_eval_runs.output.hits.hits }}"
    steps:
      # R11 fast-path: when a fail verdict lands, drop a quarantine hint
      # into the audit trail immediately. The hourly trust-tier assessor
      # is still the authoritative writer of .soc-actor-trust-tiers —
      # this row is a visibility signal (demo dashboards, alerting) and
      # an anchor for post-incident forensics.
      - name: fail_gate_check
        type: console
        with:
          message: >-
            {%- assign _gd = foreach.item._source.gate_decision | default: 'marginal' -%}
            {% if _gd == 'fail' %}yes{% else %}no{% endif %}

      - name: emit_quarantine_hint
        type: elasticsearch.index
        if: "steps.fail_gate_check.output: yes"
        with:
          index: "{{ consts.audit_index }}"
          document:
            "@timestamp": "{{ execution.startedAt | date: '%Y-%m-%dT%H:%M:%S.%LZ' }}"
            event_type: argus_reasoning_eval_fail_hint
            source: "soc_argus_reasoning_eval"
            severity: "high"
            run_id: "{{ foreach.item._source.run_id }}"
            suite_id: "{{ foreach.item._source.suite_id | default: 'argus-reasoning-vertical' }}"
            mean_safety: "{{ foreach.item._source.aggregate.mean.safety | default: 0 }}"
            mean_evidence: "{{ foreach.item._source.aggregate.mean.evidence | default: 0 }}"
            p5_safety: "{{ foreach.item._source.aggregate.p5.safety | default: 0 }}"
            message: >-
              Reasoning eval run {{ foreach.item._source.run_id }} failed
              the R11 gate. Trust-tier assessor will quarantine the
              affected actor cohort on its next tick.

      # ARGUS M2.5 — governance span per reconciled eval run. The
      # decision.kind=reasoning_eval signal is the distinguishing field
      # that lets the governance dashboard separate eval verdicts from
      # triage / deteng / rule_eval decisions when slicing by
      # agent+decision_kind.
      - name: write_eval_reasoning_trace
        type: elasticsearch.index
        with:
          index: "{{ consts.traces_index }}"
          document:
            "@timestamp": "{{ execution.startedAt | date: '%Y-%m-%dT%H:%M:%S.%LZ' }}"
            run_id: "{{ foreach.item._source.run_id }}"
            agent_id: "soc_argus_reasoning_eval"
            step_index: 0
            step_type: "run_summary"
            content: >-
              Reasoning eval {{ foreach.item._source.run_id }} →
              gate={{ foreach.item._source.gate_decision | default: 'marginal' }}
              spans={{ foreach.item._source.spans_evaluated | default: 0 }}
              mean_safety={{ foreach.item._source.aggregate.mean.safety | default: 0 }}
              mean_evidence={{ foreach.item._source.aggregate.mean.evidence | default: 0 }}
            argus:
              agent:
                id: "soc_argus_reasoning_eval"
                version: "argus-m2.5"
              decision:
                kind: "reasoning_eval"
                id: "{{ foreach.item._source.run_id }}"
                # Use aggregate.mean.safety as the confidence proxy — it's
                # the dimension R11 penalises hardest, so it is the most
                # honest single-number summary of run quality.
                confidence: "{{ foreach.item._source.aggregate.mean.safety | default: 0 }}"
              actor:
                trust_tier: "scoped"
            attributes:
              argus.agent.id: "soc_argus_reasoning_eval"
              argus.agent.version: "argus-m2.5"
              argus.decision.kind: "reasoning_eval"
              argus.decision.id: "{{ foreach.item._source.run_id }}"
              argus.decision.confidence: "{{ foreach.item._source.aggregate.mean.safety | default: 0 }}"
              argus.actor.trust_tier: "scoped"
            # OTEL-GenAI-1.x (R9) — tag this as an eval operation so a
            # collector / Phoenix viewer can filter eval verdicts out
            # from raw LLM calls. Scoring itself is deterministic
            # Playwright / CLI (not an LLM call), so gen_ai.usage is
            # intentionally omitted.
            gen_ai:
              system: "argus"
              operation:
                name: "argus.reasoning_eval.reconcile"
              agent:
                id: "soc_argus_reasoning_eval"
                name: "ARGUS Reasoning Eval Reconciler"
                description: >-
                  Polls .soc-argus-eval-runs (reasoning/adversarial) and emits governance
                  traces + fast-path quarantine hints for R11 reasoning
                  eval verdicts.

      # Mark the eval-run row as reconciled so the next poll skips it.
      - name: mark_run_reconciled
        type: elasticsearch.update
        with:
          index: "{{ consts.runs_index }}"
          id: "{{ foreach.item._id }}"
          doc:
            reconciled: true
            reconciled_at: "{{ execution.startedAt | date: '%Y-%m-%dT%H:%M:%S.%LZ' }}"
            reconciled_tick: "reasoning-eval-tick-{{ execution.startedAt | date: '%Y%m%d%H%M%S' }}"

  # ── Heartbeat + tick summary ────────────────────────────────────────
  - name: heartbeat
    type: elasticsearch.index
    with:
      index: "{{ consts.audit_index }}"
      document:
        "@timestamp": "{{ execution.startedAt | date: '%Y-%m-%dT%H:%M:%S.%LZ' }}"
        event_type: argus_reasoning_eval_tick
        source: "soc_argus_reasoning_eval"
        tick_id: "reasoning-eval-tick-{{ execution.startedAt | date: '%Y%m%d%H%M%S' }}"
        runs_reconciled: "{{ steps.fetch_new_eval_runs.output.hits.hits | size | default: 0 }}"

  - name: log_done
    type: console
    with:
      message: >-
        ARGUS reasoning-eval poll complete — reconciled
        {{ steps.fetch_new_eval_runs.output.hits.hits | size | default: 0 }}
        new eval-run row(s)
        (tick reasoning-eval-tick-{{ execution.startedAt | date: '%Y%m%d%H%M%S' }})
