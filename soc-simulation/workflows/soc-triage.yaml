version: '1'
name: SOC Triage
description: First responder workflow. Classifies alerts, assigns confidence, routes through pipeline.
enabled: true

triggers:
  - type: manual
  - type: alert

steps:
  - name: log_alert
    type: console
    with:
      message: "SOC Triage received alert: {{ event | json }}"

  - name: triage
    type: ai.agent
    agent-id: soc-triage-agent
    with:
      message: >
        Triage the following alert(s):
        {{ event | json }}
    timeout: 120s

  - name: log_result
    type: console
    with:
      message: "SOC Triage result: {{ steps.triage.output | json }}"
