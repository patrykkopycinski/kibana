version: "1"
name: Auto-detonate high severity malware alerts
description: >
  Detonate prototype: when a rule produces high or critical alerts that carry
  a file sha256, detonates each sample this space has no completed run of.
  At most 10 distinct hashes per rule execution are considered. Detonation sends a
  file out and uses allowance, so this workflow is off by default.
# Epic #20877 §7: off by default because each run uses detonation allowance; pending product answer.
enabled: false
tags:
  - security
  - detonate_prototype
triggers:
  - type: alert
steps:
  # Epic #20877 §7: capped at 10 distinct hashes per event so one noisy rule cannot spend the allowance; pending product answer.
  # Hashes are de-duplicated before the cap, so repeated alerts for one sample do not use up the 10.
  - name: detonate_each_alert
    type: foreach
    foreach: "${{ event.alerts | where_exp: 'a', \"(a.kibana.alert.severity == 'high' or a.kibana.alert.severity == 'critical') and a.file.hash.sha256 != blank\" | map: 'file.hash.sha256' | uniq | slice: 0, 10 }}"
    steps:
      # A failed lookup or submit skips that hash; the next one still runs.
      - name: reputation
        type: detonate.prototype.detonateReputation
        on-failure:
          continue: true
        with:
          sha256: "{{ foreach.item }}"

      # A completed run of this sample in this space is enough to skip it.
      # Epic #20877 §7: a run still in flight is not seen by the lookup, so overlapping events can submit the same hash twice; pending product answer.
      - name: detonate
        type: detonate.prototype.detonateSample
        if: "${{ steps.reputation.output.status == 'unknown' and steps.reputation.output.last_task_id == blank }}"
        on-failure:
          continue: true
        with:
          sample_hash: "{{ foreach.item }}"
          tags:
            - auto-detonate
