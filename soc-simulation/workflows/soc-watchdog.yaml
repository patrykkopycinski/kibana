version: '1'
name: SOC Watchdog
description: Health monitoring. Fetches SOC metrics, then AI agent analyzes for issues.
enabled: true

triggers:
  - type: scheduled
    with:
      every: 5m

steps:
  - name: get_audit_trail
    type: elasticsearch.esql.query
    with:
      query: >
        FROM .soc-audit-trail
        | WHERE @timestamp > NOW() - 10 MINUTES
        | STATS event_count = COUNT(*) BY agent_name
      format: json

  - name: get_dead_letters
    type: elasticsearch.search
    with:
      index: ".soc-dead-letter"
      body:
        query:
          range:
            "@timestamp":
              gte: "now-1h"
        size: 0

  - name: get_outcomes
    type: elasticsearch.esql.query
    with:
      query: >
        FROM .soc-outcomes
        | WHERE @timestamp > NOW() - 1 HOUR
        | STATS total = COUNT(*), avg_confidence = AVG(confidence) BY disposition
      format: json

  - name: analyze
    type: ai.agent
    agent-id: soc-watchdog-agent
    with:
      message: >
        Analyze this SOC health data and report status:

        Audit trail (last 10min): {{ steps.get_audit_trail.output | json }}
        Dead letters (last 1h): {{ steps.get_dead_letters.output.hits.total.value }} items
        Outcomes (last 1h): {{ steps.get_outcomes.output | json }}
    timeout: 300s

  - name: log_result
    type: console
    with:
      message: "Watchdog result: {{ steps.analyze.output | json }}"
