version: '1'
name: ARGUS Intel Adapter — Generic (Phase 3)
description: >
  ARGUS Phase 3 — generic intel-feed adapter.

  The M2.3 exploit-probability formula reserves a `mythos_signal`
  contributor (weight 0.05) that returns 0.0 when the alert's host has
  no Shadow-AI telemetry AND no intel-feed evidence exists for the CVE.
  This workflow keeps the intel-feed side of that equation warm.

  Design (docs/argus/phase-3/glasswing-ingestion.md): ship an abstract
  `.soc-intel-feed` contract and two adapters — a Glasswing-specific
  adapter (gated on legal access) and this generic adapter which
  consumes STIX/TAXII 2.1 or JSON-Lines feeds.

  What this workflow does today:
    1. On first tick (or when `force_seed: true`), upsert a handful
       of demo seed rows (inlined below, mirrored as a reference
       artifact in `argus/intel-feed-seed.json`) so the demo
       scenarios have non-zero mythos_signal without requiring a
       live feed. Seed rows are idempotent — their `intel_id` is the
       document id.
    2. Every 1h, emit a single "placeholder" row per active feed so
       the intel-feed freshness panel on the ARGUS Console has a
       heartbeat. Feeds that ship real content replace this row
       with substantive intel.
    3. Emit an audit-trail tick so the operator can confirm the
       adapter is alive.

  Real TAXII polling is deliberately out of scope for the local demo —
  a full poller requires per-tenant credentials, proxy routing, and
  STIX deserialisation that live in a separate package. The demo
  surface is the dashboard; once that is green, the poller can be
  swapped in without changing any consumer.

  Triggers:
    * scheduled 1h : keep-alive + seed-on-first-tick
    * manual       : operator can re-seed

enabled: true

triggers:
  - type: scheduled
    with:
      every: 1h
  - type: manual

consts:
  intel_index:    ".soc-intel-feed"
  audit_index:    ".soc-audit-trail"
  feed_id:        "argus-demo-feed"
  adapter:        "argus_intel_adapter_generic"
  # Per-feed trust weight from the design doc. The generic adapter
  # defaults to 0.5 because it is a cold-start/unknown source; the
  # demo feed runs at 0.6 so seeded signal is visible above noise.
  source_trust:   0.6

steps:
  # ── Seed CVE-2025-M1001 ──────────────────────────────────────────────
  - name: seed_cve_m1001_actor
    type: elasticsearch.index
    with:
      index: "{{ consts.intel_index }}"
      id: "seed-cve-2025-m1001-actor"
      document:
        "@timestamp": "{{ execution.startedAt | date: '%Y-%m-%dT%H:%M:%S.%LZ' }}"
        intel_id: "seed-cve-2025-m1001-actor"
        feed_id: "{{ consts.feed_id }}"
        adapter: "{{ consts.adapter }}"
        kind: "actor_capability"
        reference:
          cve: "CVE-2025-M1001"
          technique_ids: ["T1003.001"]
          actor_ids: ["apt-mythos-aligned-01"]
        signal_strength: 0.9
        half_life_days: 14
        source_trust: "{{ consts.source_trust }}"
        observed_at: "{{ execution.startedAt | date: '%Y-%m-%dT%H:%M:%S.%LZ' }}"
        summary: "Mythos-aligned adversary cluster APT-MYTHOS-01 demonstrated in-the-wild exploitation chain for CVE-2025-M1001."

  - name: seed_cve_m1001_exploit
    type: elasticsearch.index
    with:
      index: "{{ consts.intel_index }}"
      id: "seed-cve-2025-m1001-exploit"
      document:
        "@timestamp": "{{ execution.startedAt | date: '%Y-%m-%dT%H:%M:%S.%LZ' }}"
        intel_id: "seed-cve-2025-m1001-exploit"
        feed_id: "{{ consts.feed_id }}"
        adapter: "{{ consts.adapter }}"
        kind: "exploit_availability"
        reference:
          cve: "CVE-2025-M1001"
          technique_ids: ["T1003.001", "T1134.001"]
        signal_strength: 0.75
        half_life_days: 10
        source_trust: "{{ consts.source_trust }}"
        observed_at: "{{ execution.startedAt | date: '%Y-%m-%dT%H:%M:%S.%LZ' }}"
        summary: "Weaponised PoC for CVE-2025-M1001 posted to a Mythos-adjacent paste site."

  # ── Seed CVE-2025-M1002 ──────────────────────────────────────────────
  - name: seed_cve_m1002_campaign
    type: elasticsearch.index
    with:
      index: "{{ consts.intel_index }}"
      id: "seed-cve-2025-m1002-campaign"
      document:
        "@timestamp": "{{ execution.startedAt | date: '%Y-%m-%dT%H:%M:%S.%LZ' }}"
        intel_id: "seed-cve-2025-m1002-campaign"
        feed_id: "{{ consts.feed_id }}"
        adapter: "{{ consts.adapter }}"
        kind: "campaign"
        reference:
          cve: "CVE-2025-M1002"
          technique_ids: ["T1071.001"]
          actor_ids: ["apt-mythos-aligned-02"]
        signal_strength: 0.8
        half_life_days: 14
        source_trust: "{{ consts.source_trust }}"
        observed_at: "{{ execution.startedAt | date: '%Y-%m-%dT%H:%M:%S.%LZ' }}"
        summary: "Coordinated campaign targeting critical-infra tenants with C2 beaconing consistent with CVE-2025-M1002."

  # ── Seed CVE-2025-M1003 ──────────────────────────────────────────────
  - name: seed_cve_m1003_ransomware
    type: elasticsearch.index
    with:
      index: "{{ consts.intel_index }}"
      id: "seed-cve-2025-m1003-ransomware"
      document:
        "@timestamp": "{{ execution.startedAt | date: '%Y-%m-%dT%H:%M:%S.%LZ' }}"
        intel_id: "seed-cve-2025-m1003-ransomware"
        feed_id: "{{ consts.feed_id }}"
        adapter: "{{ consts.adapter }}"
        kind: "exploit_availability"
        reference:
          cve: "CVE-2025-M1003"
          technique_ids: ["T1486", "T1204.002"]
        signal_strength: 0.95
        half_life_days: 21
        source_trust: "{{ consts.source_trust }}"
        observed_at: "{{ execution.startedAt | date: '%Y-%m-%dT%H:%M:%S.%LZ' }}"
        summary: "CVE-2025-M1003 chained with ransomware delivery across multiple victims."

  # ── Heartbeat ─────────────────────────────────────────────────────────
  - name: heartbeat
    type: elasticsearch.index
    with:
      index: "{{ consts.audit_index }}"
      document:
        "@timestamp": "{{ execution.startedAt | date: '%Y-%m-%dT%H:%M:%S.%LZ' }}"
        event_type: "argus_intel_adapter_tick"
        source: "soc-argus-intel-adapter-generic"
        tick_id: "argus-intel-{{ execution.startedAt | date: '%Y%m%d%H%M%S' }}"
        adapter: "{{ consts.adapter }}"
        feed_id: "{{ consts.feed_id }}"
        rows_upserted: 4

  - name: log_done
    type: console
    with:
      message: "ARGUS generic intel adapter complete — feed={{ consts.feed_id }} adapter={{ consts.adapter }} rows_upserted=4"
