version: '1'
name: SOC Case Creation
description: Creates a Kibana case from triage results using AI.
enabled: true

triggers:
  - type: manual

inputs:
  - name: alert_data
    type: string

steps:
  - name: create_case
    type: ai.agent
    agent-id: soc-case-agent
    with:
      message: >
        Create a Kibana case for this triaged alert:
        {{ inputs.alert_data }}
    timeout: 60s

  - name: log_result
    type: console
    with:
      message: "Case created: {{ steps.create_case.output | json }}"
