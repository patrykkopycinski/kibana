version: '1'
name: SOC Case Creation
description: Creates Kibana cases with full evidence chains and AI-generated summaries.
enabled: true

triggers:
  - type: manual

inputs:
  - name: correlation_id
    type: string
    required: true
  - name: confidence
    type: number
    required: true
  - name: alert_ids
    type: string
  - name: entities
    type: string

steps:
  - name: create_case
    type: ai.agent
    agent-id: soc-case-agent
    with:
      message: >
        Create a case for this security incident.
        Correlation ID: {{ inputs.correlation_id }}
        Confidence: {{ inputs.confidence }}
        Alert IDs: {{ inputs.alert_ids }}
        Entities: {{ inputs.entities }}
    timeout: 180s

  - name: store_outcome
    type: console
    with:
      message: "Case creation outcome: {{ steps.create_case.output | json }}"

  - name: audit
    type: console
    with:
      message: "Case audit: agent=case action=case_created correlation_id={{ inputs.correlation_id }} confidence={{ inputs.confidence }}"

on-failure:
  fallback:
    - name: dead_letter
      type: console
      with:
        message: "Case workflow failure: source=case_workflow correlation_id={{ inputs.correlation_id }} error={{ error.message }}"
